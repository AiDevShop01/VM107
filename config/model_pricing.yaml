version: "1.0"
description: "Pricing overrides — LiteLLM provides rates for 2,600+ models automatically"

# Only add models here if you need to OVERRIDE LiteLLM's pricing
# or for models too new to be in LiteLLM's database.
# Ollama is always $0.00 (handled in code, no entry needed).
# All other models are looked up from LiteLLM's model_cost database.
models:
  # DeepSeek V4 Flash — too new for LiteLLM (April 2026)
  # Source: https://api-docs.deepseek.com/quick_start/pricing
  deepseek/deepseek-v4-flash:
    input_per_1k: 0.00014
    output_per_1k: 0.00028
