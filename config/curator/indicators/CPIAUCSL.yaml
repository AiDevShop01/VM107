indicator_id: CPIAUCSL
name: Consumer Price Index for All Urban Consumers
category: inflation
frequency: monthly
country: US
importance: critical

short_description: >
  Headline US consumer price inflation — the broadest measure of cost of living
  changes for urban consumers, covering food, energy, shelter, medical, and
  services. Published monthly by the Bureau of Labor Statistics.

why_it_matters: |
  The CPI is the Federal Reserve's primary inflation gauge and a direct input to
  monetary policy decisions. Surprise direction historically dominates 1-day
  cross-asset reactions: a beat lifts USD, pressures long-duration bonds, weighs
  on gold via rising real yields, and compresses equity multiples. A miss
  triggers the inverse playbook. The "last mile" path from ~3% back to 2%
  determines the pace and depth of rate cuts — making every print a macro event.

affected_assets:
  - DEXUSEU       # USD/EUR — directly repriced on CPI surprise
  - GOLDAMGBD228NLBM  # Gold spot — real yield channel
  - DGS10         # 10-year Treasury — dominant sensitivity
  - DGS2          # 2-year Treasury — most rate-sensitive end
  - SP500         # Equities — multiple compression on hot prints
  - FEDFUNDS      # Fed Funds rate expectations
