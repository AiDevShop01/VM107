indicator_id: IRLTLT01EZM156N
name: Long-Term Government Bond Yields, 10-Year, Eurozone
category: rates
frequency: monthly
country: Eurozone
importance: high

short_description: >
  Harmonised long-term government bond yield (10-year maturity) for the
  Eurozone area, sourced from the OECD and published by FRED. Covers a
  GDP-weighted average of eurozone member state 10-year sovereign yields,
  representing the Eurozone's benchmark rate for long-duration sovereign debt.

why_it_matters: |
  The Eurozone 10-year yield is a core input for EUR/USD cross-rate pricing
  and ECB policy expectations. Eurozone duration risk drives relative rate
  differentials with US Treasuries (DGS10), directly influencing EUR/USD
  direction via the interest rate parity mechanism. Rising EZ yields — driven
  by ECB hawkishness, fiscal expansion, or inflation persistence — typically
  support the EUR against the USD, compressing US-EZ rate spreads. Conversely,
  EZ yield compression relative to Treasuries supports USD strength. Peripheral
  spread widening (Italy/Spain vs Germany) embedded in the aggregate signals
  eurozone fiscal stress — historically a risk-off trigger for EUR assets.
  Key events: ECB policy meetings, Eurozone CPI, German IFO/PMI, Italian
  bond auctions.

affected_assets:
  - DEXUSEU       # EUR/USD — direct rate differential repricing
  - DEXJPUS       # JPY/USD — cross-EUR carry dynamics
  - DGS10         # US 10-year — rate spread cross-reference
  - GOLDAMGBD228NLBM  # Gold — EZ risk stress and EUR safe haven demand
  - SP500         # US equities — EZ growth signal and capital flow
