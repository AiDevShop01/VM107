indicator_id: BUSLOANS
name: Commercial and Industrial Loans, All Commercial Banks
category: credit
frequency: weekly
country: US
importance: medium

short_description: >
  Total outstanding commercial and industrial (C&I) loans at all US commercial
  banks, published weekly by the Federal Reserve H.8 release. Captures
  business borrowing demand across the banking system.

why_it_matters: |
  C&I loan growth is a leading indicator of the credit cycle and a Fed-watched
  proxy for business investment appetite. When companies borrow aggressively to
  fund expansion, C&I loans accelerate ahead of GDP growth. Contraction in
  C&I loans — particularly rapid drawdowns — has historically preceded
  recessions as banks tighten standards or businesses anticipate weaker demand.
  The Fed monitors C&I loan growth alongside Senior Loan Officer Survey data
  to assess credit conditions and the transmission of monetary policy tightening
  into the real economy.

affected_assets:
  - SP500         # Equities — credit availability drives investment and margins
  - BAMLH0A0HYM2  # High-yield spreads — C&I contraction precedes spread widening
  - DGS2          # Short-term rates — policy sensitivity channel
  - DEXUSEU       # USD — business credit demand signals economic trajectory
  - FEDFUNDS      # Rate expectations reset on credit cycle turns
