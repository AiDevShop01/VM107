indicator_id: NONBORRES
name: Non-Borrowed Reserves of Depository Institutions
category: liquidity
frequency: weekly
country: US
importance: medium

short_description: >
  Total reserves of depository institutions held at Federal Reserve banks
  minus reserves borrowed from the Fed (discount window + term auction
  facility), published weekly. Measures structural liquidity in the banking
  system separate from Fed-provided emergency support.

why_it_matters: |
  Non-borrowed reserves (NBR) is a structural liquidity gauge that separates
  organic bank reserves from Fed-injected emergency funding. When NBR turns
  sharply negative — as in 2007-2008 — it signals banks are borrowing heavily
  from the Fed's discount window, indicating stress. During quantitative
  tightening (QT), tracking NBR alongside the Fed's balance sheet (WALCL)
  and reserve requirement proxies helps estimate how far the Fed can shrink
  its balance sheet before bank reserves approach 'ample reserves' floor.
  Useful for gauging QT trajectory and proximity to the 'reversal point' where
  the Fed may need to pause or restart asset purchases.

affected_assets:
  - WALCL         # Fed balance sheet — QT trajectory cross-reference
  - DGS2          # Short-term rates — liquidity stress repricing
  - BAMLH0A0HYM2  # High-yield spreads — bank stress signal
  - SP500         # Equities — systemic liquidity risk channel
