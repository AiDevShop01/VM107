indicator_id: TEDRATE
name: TED Spread (3-Month LIBOR Minus 3-Month T-Bill Rate)
category: credit_risk
frequency: daily
country: US
importance: medium

short_description: >
  The spread between 3-month USD LIBOR (interbank unsecured borrowing rate)
  and the 3-month US Treasury bill yield. A classic measure of perceived
  interbank credit risk and systemic financial stress, historically in
  basis points. Note: LIBOR was sunset in June 2023; this series has
  limited forward relevance but retains retrospective analytical value.

why_it_matters: |
  The TED spread (T-bill / Eurodollar Difference) was the canonical interbank
  stress gauge for decades, spiking dramatically in 2007-2008 when interbank
  lending froze. Widening TED signals banks do not trust each other's short-term
  credit, correlating with equity drawdowns, dollar strength, and flight-to-quality
  Treasury demand. Since SOFR replaced LIBOR as the benchmark floating rate in
  June 2023, the TED spread is no longer a live indicator — it stopped publishing
  on April 30, 2023 at FRED. It remains relevant for historical analysis of past
  stress episodes and as a retrospective calibration anchor. For current
  interbank stress monitoring, track SOFR-OIS spread or the FRA-OIS spread instead.

affected_assets:
  - DGS3MO        # 3-month Treasury — the T-bill leg of the spread
  - SP500         # Equities — TED widening precedes equity drawdowns
  - DEXUSEU       # USD — flight-to-quality in stress episodes
  - GOLDAMGBD228NLBM  # Gold — alternative safe haven during stress
