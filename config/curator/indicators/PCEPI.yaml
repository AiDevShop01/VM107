indicator_id: PCEPI
name: Personal Consumption Expenditures Price Index
category: inflation
frequency: monthly
country: US
importance: critical

short_description: >
  Headline measure of inflation in consumer spending, published monthly by
  the Bureau of Economic Analysis. Covers the full breadth of goods and
  services purchased by US households, using chain-weighting to adjust
  for substitution effects. The Federal Reserve's officially mandated
  inflation gauge.

why_it_matters: |
  PCE is the Fed's preferred inflation measure, explicitly cited in FOMC
  statements and the Fed's 2% symmetric target framework. Unlike CPI, PCE
  uses a chain-weighted formula that better captures consumer substitution
  behaviour, and its broader scope includes healthcare payments made on
  behalf of consumers (employer/government-paid). Historically PCE runs
  30-60 basis points below CPI. For policy expectations, a PCE surprise
  trades more cleanly than CPI because it is the number the Fed actually
  targets — a hot print raises the bar for rate cuts (bonds down, USD up);
  a soft print opens the door (bonds rally, USD softens, equities mixed).

affected_assets:
  - FEDFUNDS      # Rate expectations — most direct policy lever
  - DGS2          # 2-year Treasury — front-end most sensitive
  - DGS10         # 10-year Treasury — duration repricing
  - DEXUSEU       # USD — policy divergence with ECB
  - SP500         # Equities — multiple compression on hot prints
  - GOLDAMGBD228NLBM  # Gold — real yield channel
