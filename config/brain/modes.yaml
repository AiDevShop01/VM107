# Brain Layer Behavioral Modes Configuration
# Defines hysteresis parameters and task type weights for each behavioral mode

version: 1

# Global confirmation cycles and hold time
confirmation_cycles: 3
min_hold_seconds: 60

# Mode-specific configuration
modes:
  # Exploration mode: Learn and discover patterns
  exploration:
    # Hysteresis thresholds
    enter_threshold: 0.6
    exit_threshold: 0.4

    # Primary signal for mode transition
    primary_signal: entropy

    # Task type weights (multipliers)
    task_type_weights:
      research: 1.3
      analysis: 1.3
      execution: 0.8
      maintenance: 1.0

  # Exploitation mode: Execute on known patterns
  exploitation:
    # Hysteresis thresholds
    enter_threshold: 0.7
    exit_threshold: 0.5

    # Primary signal for mode transition
    primary_signal: success_rate

    # Task type weights (multipliers)
    task_type_weights:
      research: 0.8
      analysis: 1.0
      execution: 1.3
      maintenance: 1.0

  # Stabilization mode: Fix problems and reduce failures
  stabilization:
    # Hysteresis thresholds
    enter_threshold: 0.3
    exit_threshold: 0.5

    # Primary signal for mode transition
    primary_signal: failure_rate

    # Task type weights (multipliers)
    task_type_weights:
      research: 0.5
      analysis: 0.7
      execution: 0.5
      maintenance: 1.5

    # Priority adjustments
    p1_boost: 1.5
    p3_suppress: 0.5
    p4_suppress: 0.3
