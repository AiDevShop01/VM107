[pytest]
# Pytest configuration for VM107

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test discovery patterns
testpaths = tests

# Markers
markers =
    phase83: Phase 83 FRED API rebuild tests
    phase_87: Phase 87 — Macro Intelligence Workbench (Regime + Transmission)
    phase89: Phase 89 macro investigation + counterfactual + contradiction + discovery
    phase90: Phase 90 Forecast Engine tests (VM107)
    phase92: Phase 92 — Macro Knowledge & Research Platform (research_documents capability registry entry)
    slow: tests that exceed 5 seconds
    quick: Quick-run subset for per-task feedback sampling
    requires_deps: Tier-2 tests needing the CI venv (faiss/langchain/simpleeval/flask); excluded from the host-clean fast loop

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests
timeout = 60
