# Phase 43 router config. Edit affinity entries to add Phase 44+ agent blocks.
# mode_weights MUST sum to 1.0 per mode (validator enforces in Plan 02).
#
# Schema version: 1.0
# Owner: Phase 43 — LLM Model Router
# Populated by: Plan 02 (affinity map, model catalog, peak_hours)
#
# Key constraints (LOCKED per CONTEXT.md):
#   - affinity[default][default] MUST always exist (double-fallback guarantees)
#   - mode_weights sum to exactly 1.0 per mode
#   - Local tier always present in every fallback chain (currently DeepSeek Flash; Ollama dropped 2026-05-03 — base_url unreachable from container)
#   - task_type keys are Phase 42 TaskModel.task_type values VERBATIM

version: "1.0"

routing:
  timezone: "Australia/Perth"
  peak_hours:
    - "08:00-12:00"
    - "14:00-18:00"

mode_weights:
  exploration:
    quality: 0.6
    cost: 0.25
    latency: 0.15
  exploitation:
    quality: 0.4
    cost: 0.4
    latency: 0.2
  stabilization:
    quality: 0.2
    cost: 0.3
    latency: 0.5

# Daily USD caps for the agent_type and system scopes used by AlertPipeline (Plan 04 + Plan 05).
# Plan 03's BudgetGate.get_agent_type_aggregate / get_system_aggregate read max_usd from this block
# (Redis aggregates only carry spent_usd; max_usd is config-driven, not state).
# Per-goal caps live on the goal document (budget_max_cost_usd) — NOT here.
budget_caps:
  agent_types:
    agent_zero: {max_usd_per_day: 5.00}
    default:    {max_usd_per_day: 1.00}
  system:
    max_usd_per_day: 50.00

models:
  "anthropic/claude-4-sonnet-20250514":
    tier: primary
    quality_score: 0.92
    latency_ms: 2000
    cost_per_1k_output_usd: 0.015
  "anthropic/claude-3-7-sonnet-20250219":
    tier: primary
    quality_score: 0.90
    latency_ms: 2200
    cost_per_1k_output_usd: 0.015
  "anthropic/claude-4-opus-20250514":
    tier: primary
    quality_score: 0.95
    latency_ms: 3000
    cost_per_1k_output_usd: 0.075
    # Stabilization mode drops this — too expensive + high variance
  "openai/gpt-4o":
    tier: primary
    quality_score: 0.88
    latency_ms: 1800
    cost_per_1k_output_usd: 0.010
  "anthropic/claude-haiku-4-5":
    tier: secondary
    quality_score: 0.75
    latency_ms: 800
    cost_per_1k_output_usd: 0.005
  "anthropic/claude-3-haiku-20240307":
    tier: secondary
    quality_score: 0.70
    latency_ms: 700
    cost_per_1k_output_usd: 0.00125
  "openai/gpt-4o-mini":
    tier: secondary
    quality_score: 0.72
    latency_ms: 900
    cost_per_1k_output_usd: 0.0006
  # Ollama models removed 2026-05-03: OLLAMA_BASE_URL=192.168.1.113:11434 in env, but
  # LiteLLM defaults to localhost:11434 inside the vm107 container — connection refused.
  # When Ollama base_url is wired through LiteLLM (model_providers.yaml api_base), restore:
  #   "ollama/llama3.2":   {tier: local, quality_score: 0.55, latency_ms: 300, cost_per_1k_output_usd: 0.0}
  #   "ollama/qwen2.5:14b": {tier: local, quality_score: 0.62, latency_ms: 600, cost_per_1k_output_usd: 0.0}
  # User's only configured cloud LLM (API_KEY_DEEPSEEK set in container env).
  # Until additional provider keys land, every affinity chain points here for
  # all 3 tiers — the e2e router pipeline still exercises end-to-end this way.
  "deepseek/deepseek-v4-flash":
    tier: primary
    quality_score: 0.78
    latency_ms: 1200
    cost_per_1k_output_usd: 0.00028

# Stabilization-safe set (referenced by Plan 05 brain filter).
# DeepSeek Flash is cheap + low-variance, so it qualifies as safe for stabilization.
# Ollama entries removed 2026-05-03 (unreachable from container); restore alongside model catalog.
stabilization_safe_models:
  - "deepseek/deepseek-v4-flash"
  - "anthropic/claude-haiku-4-5"
  - "openai/gpt-4o-mini"
  - "anthropic/claude-3-haiku-20240307"

# Phase 43 affinity map TEMPORARILY pinned to DeepSeek Flash for every
# (agent, task_type) chain because that's the only cloud LLM the user
# currently has API keys for. When ANTHROPIC / OPENAI / OPENROUTER keys land,
# restore the multi-tier chains (saved in git history at commit 7e9b75d).
affinity:
  agent_zero:
    analysis:
      primary:   ["deepseek/deepseek-v4-flash"]
      secondary: ["deepseek/deepseek-v4-flash"]
      local:     ["deepseek/deepseek-v4-flash"]
    execution:
      primary:   ["deepseek/deepseek-v4-flash"]
      secondary: ["deepseek/deepseek-v4-flash"]
      local:     ["deepseek/deepseek-v4-flash"]
    validation:
      primary:   ["deepseek/deepseek-v4-flash"]
      secondary: ["deepseek/deepseek-v4-flash"]
      local:     ["deepseek/deepseek-v4-flash"]
    research:
      primary:   ["deepseek/deepseek-v4-flash"]
      secondary: ["deepseek/deepseek-v4-flash"]
      local:     ["deepseek/deepseek-v4-flash"]
    default:
      primary:   ["deepseek/deepseek-v4-flash"]
      secondary: ["deepseek/deepseek-v4-flash"]
      local:     ["deepseek/deepseek-v4-flash"]
  default:
    default:
      primary:   ["deepseek/deepseek-v4-flash"]
      secondary: ["deepseek/deepseek-v4-flash"]
      local:     ["deepseek/deepseek-v4-flash"]
  # Phase 43.2 — production canary for failover infrastructure.
  # Primary is intentionally unreachable (DNS NXDOMAIN); secondary MUST succeed via fallback.
  # Schedule: daily 03:00 Australia/Perth (Dagster canary_failover_check asset — Plan 04).
  # Field names MUST match AffinityMap.lookup() iteration: ('primary', 'secondary', 'local').
  canary_agent:
    validation:
      # primary uses openai/ prefix so LiteLLM attempts a real HTTP call (not BadRequestError).
      # The canary script overrides api_base to http://127.0.0.1:1 (port 1 = connection refused)
      # which produces a real APIConnectionError — a RETRYABLE error that fires failover.
      primary:   ["openai/canary-probe"]
      secondary: ["deepseek/deepseek-v4-flash"]
      local:     ["deepseek/deepseek-v4-flash"]

alert_overrides: {}   # per-goal threshold overrides (Plan 04 reads this)


# ===== Phase 43.1 additions (utility-path routing) =====
# Schema: extend in place — DO NOT refactor existing affinity:/mode_weights:/peak_hours:/budget_caps:/models: keys.
# CRITICAL: utility: block is REQUIRED — AffinityMap.from_yaml raises KeyError when missing.
# NEVER silently fall back from utility to chat affinity (defeats cost separation).

cost_thresholds:
  cheap_usd_per_1k_output: 0.005
  expensive_usd_per_1k_output: 0.02

latency_sla_ms:
  research:   5000
  analysis:   4000
  validation: 3000
  execution:  2000
  default:    3000

utility:
  # All tiers pinned to DeepSeek Flash 2026-05-03 — only working LLM in the container.
  # Was: local: ollama/llama3.2 + execution override using ollama/qwen2.5:14b.
  # The router correctly selected ollama/llama3.2 on peak_hard_shift, but LiteLLM
  # connection failed (localhost:11434 vs actual 192.168.1.113:11434).
  # Restore Ollama tiers when:
  #   1. Ollama base_url wired through model_providers.yaml api_base, OR
  #   2. LiteLLM auto-failover (Phase 43 deferred item) implemented so secondary kicks in
  default:
    primary:   ["deepseek/deepseek-v4-flash"]
    secondary: ["deepseek/deepseek-v4-flash"]
    local:     ["deepseek/deepseek-v4-flash"]
  overrides:
    synthesis:
      # synthesis falls back to chat affinity routing for this task_type (preserves cost-first weights though)
      allow_chat_models: true
    # research, analysis, validation, execution all use utility.default
