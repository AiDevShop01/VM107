description: >
  Projects canonical TradeAnalyticsSnapshot rows into the Qdrant
  `trade_intelligence` collection — one snapshot-level embedding per
  (execution, ruleset_version) pair (CONTEXT §10/§11/§14/§15). Composes the
  deterministic embedding document via embedding_document.compose, embeds
  via all-mpnet-base-v2 (768-dim, cosine), upserts at point id
  f"{execution_id}:{ruleset_version}". Independent embedding_prompt_version
  dimension preserves replay fidelity (CONTEXT §5).
