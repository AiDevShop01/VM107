description: >
  POST /api/v1/agents/pipeline/refine — async-only external HTTP entry
  surface for the bounded refinement loop. Validates hypothesis_id +
  schema_version + async flag; persists initial RefinementLoopState; emits
  refinement_loop_started (SOLE event emitted from the HTTP surface);
  dispatches the loop to the Phase 42 scheduler via
  enqueue_refinement_worker; returns 202 + {task_id, loop_id, started_at}.

  CONTEXT § Decision 16: refinement transaction boundary — "begin bounded
  refinement search on this immutable research intent." § Decision 17:
  V1 is async-only; sync HTTP invocation makes no sense for 5-20-minute
  cognition workflows. § Decision 18: sole-emitter invariant — endpoint
  emits exactly ONE refinement event (refinement_loop_started); main_loop
  emits the rest from the worker context.

  Response shape:
    202 Accepted
    {"task_id": "task_...", "loop_id": "loop_...", "started_at": "..."}

  Hard-fails:
    404 — hypothesis_id missing from hypotheses collection
    422 — schema_version != 1, async != true, malformed body
    503 — Phase 42 scheduler dispatch failure (transient)
