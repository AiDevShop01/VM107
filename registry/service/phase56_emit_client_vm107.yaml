description: >
  VM107-side Phase 56 event-store emit client. POSTs refinement-lifecycle
  events to VM100's Phase 56 event store at
  POST /api/journal/internal/events/emit.

  Retry policy (Plan 48-03 Task 3.1 contract):
    - HTTP 2xx -> return None
    - HTTP 4xx -> raise Phase56EmitError IMMEDIATELY (no retry — client error)
    - HTTP 5xx -> retry exactly ONCE, then raise Phase56EmitError
    - httpx.ConnectError -> retry exactly ONCE, then raise Phase56EmitError

  Env-driven config (Directive #4): VM100_INTERNAL_BASE_URL is read via
  os.environ[...] direct subscript at every emit call. Missing env raises
  KeyError at the call site — fail-fast beats silent misconfiguration.

  Also exports validate_snapshot_for_replay(stored_hash) -> None which
  raises SnapshotMismatchError when the live CapabilityRegistry snapshot
  hash differs from the loop's stored hash (CONTEXT § Decision 15 HARD
  FAIL replay contract). Used by replay_query_service_extension_vm107.
