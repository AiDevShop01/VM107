id: campaign_service
type: service
status: real
shipped: 55
planned_phase: null
short_description: 'Canonical 12-state Campaign lifecycle engine — the ONLY official
  entry point for Campaign state mutation (CONTEXT decision #4).

  '
long_description: "CampaignService is the canonical state-transition engine for the\n\
  Campaign entity. Per CONTEXT decision #4, this is THE entry point\nfor Campaign\
  \ state mutation. Frontend, Dagster, agents, and scripts\nMUST go through this service.\
  \ Direct ORM state writes are blocked\nat the service layer (Pydantic typed payload\
  \ validation) AND at the\nDB layer (CHECK constraints — defense-in-depth per Decision\
  \ 5).\n\nCampaignService.transition_to delegates to lifecycle_base\n._atomic_transition\
  \ (shared with IdeaService and ExecutionService).\nThe shared engine runs the entire\
  \ transition inside a single\ntransaction.atomic() block:\n\n  SELECT FOR UPDATE\
  \ row lock\n    -> in-Python idempotency check\n    -> validate target_state in\
  \ ALLOWED_TRANSITIONS[current_state]\n    -> build typed Pydantic event payload\n\
  \    -> INSERT Event row\n    -> UPDATE entity state\n    -> regenerate TradeJournal\
  \ cache (Campaign only — Decision 5)\n    -> schedule post-commit signal (transaction.on_commit)\n\
  \nIf validation fails, InvalidTransitionError is raised AFTER the\nSELECT FOR UPDATE\
  \ — the transaction rolls back atomically, no Event\nrow is written, no signal is\
  \ scheduled. The \"NEVER state-without-event,\nNEVER event-without-state\" invariant\
  \ holds.\n\nIdempotency is defense-in-depth: in-Python check is the first line;\n\
  the DB partial UniqueConstraint event_idempotency_unique_source_envelope\n(Plan\
  \ 55-02) is the second. Replay returns the existing Event row\n(idempotent=True);\
  \ the service NEVER writes duplicates.\n\nPer Plan 55-05 Pattern 18: source='adapter'\
  \ is recorded when the\ncall is routed through the TradeJournalAdapter facade. Direct\
  \ service\ncallers from Dagster / agents / frontend record their own source\nlabel.\n"
location:
  source: VM100/backend/journal/services/campaign_service.py
  shared_engine: VM100/backend/journal/services/lifecycle_base.py
api_structure: "CampaignService.transition_to(\n    campaign_id: UUID,\n    target_state:\
  \ CampaignState,\n    reason: str,\n    actor: str,\n    metadata: dict | None =\
  \ None,\n    source: Literal[frontend|dagster|agent|script|adapter] = \"script\"\
  ,\n    source_envelope_id: UUID | None = None,\n) -> tuple[Campaign, Event, idempotent:\
  \ bool]\n\nRaises:\n  InvalidTransitionError — target_state not in ALLOWED_TRANSITIONS[current_state]\n\
  \  pydantic.ValidationError — event payload fails Literal validation (programming\
  \ error)\n"
guarantees:
- Validate target_state in ALLOWED_TRANSITIONS[current_state] or raise InvalidTransitionError
- 'Atomic: Event row INSERT + state UPDATE in one transaction.atomic() block'
- Domain signal emitted post-commit only (transaction.on_commit) — NEVER on rollback
- Idempotent on (campaign_id, target_state, source_envelope_id) tuple
- SELECT FOR UPDATE row lock — concurrent calls serialize cleanly, no deadlock
- Pydantic-typed event payload (CampaignStateTransitionEvent) — Literal validation
  BEFORE INSERT
- TradeJournal cache regenerated inside the SAME atomic block (Decision 5 + ISSUE-8)
- ALLOWED_TRANSITIONS table is locked (12 states, 18 transitions); ARCHIVED terminal
allowed_transitions_source: campaign state_machine YAML (registry/state_machine/campaign.yaml)
related_capabilities:
- campaign
- campaign_state_transition
- idea_service
- execution_service
- legacy_status_mapping
- trade_journal_adapter
tags:
