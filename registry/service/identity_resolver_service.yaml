description: |
  Phase 58.1 F-4 — Resolves a trade-identity input (int trade_id, Execution
  UUID, or TradeJournal UUID) to a normalized (trade_id, execution_id,
  journal_id) triple. Used by get_trade_context to honor either the
  trade_id or journal_id request field per Phase 55-00 identity reconciliation.

  Resolver priority order (verified against models.py):
    1. int → api.Trade.id (BIGINT hypertable PK)
    2. UUID → Execution.id (fewest indirections to current execution)
    3. UUID → TradeJournal.id (DRAFT journals always exist here)
    4. miss → 404 with `tried: [trade_id_int, execution_id_uuid, journal_id_uuid]`

  Plan 02 ships the implementation:
    - VM100/backend/journal/services/identity_resolver_service.py
    - VM100/backend/journal/routers/internal_router.py (new endpoint)
