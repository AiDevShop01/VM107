id: execution_service
type: service
status: real
shipped: 55
planned_phase: null
short_description: 'Canonical 3-state Execution lifecycle engine — the ONLY official
  entry point for Execution state mutation (mechanical only).

  '
long_description: "ExecutionService is the canonical state-transition engine for the\n\
  Execution entity. Parallel surface to CampaignService.transition_to\nper CONTEXT\
  \ decision #4 — the ONLY official entry point for\nExecution state mutation.\n\n\
  Per CONTEXT decision #2: Mechanical state (Execution) != Strategic\nstate (Campaign).\
  \ Executions tell what broker positions exist;\nCampaigns tell what the trader is\
  \ DOING. ExecutionService transitions\nEMIT events that CampaignService consumes\
  \ as INPUT SIGNALS — but\nCampaignService DECIDES whether the Campaign transitions\
  \ in response.\nExecution events are signals, NOT state dictators.\n\nExecutionService.transition_to\
  \ delegates to lifecycle_base\n._atomic_transition (shared with CampaignService\
  \ and IdeaService).\nThe shared engine runs the entire transition inside a single\n\
  transaction.atomic() block:\n\n  SELECT FOR UPDATE row lock\n    -> in-Python idempotency\
  \ check\n    -> validate target_state in ALLOWED_TRANSITIONS[current_state]\n  \
  \  -> build typed ExecutionStateTransitionEvent Pydantic payload\n    -> INSERT\
  \ Event row\n    -> UPDATE entity state\n    -> schedule post-commit signal (transaction.on_commit)\n\
  \nNote: Execution has NO TradeJournal cache regeneration step — only\nCampaign triggers\
  \ cache regen (Decision 5).\n\nPer 55-00-IDENTITY-DECISIONS.md Decision 1: Execution.id\
  \ is a\ncanonical UUID; Execution.legacy_trade_id is a BIGINT back-reference\nto\
  \ api.Trade.id. Phase 55 keeps the trades hypertable untouched —\nno ALTER TABLE\
  \ on Trade.\n\nIdempotency: same (execution_id, target_state, source_envelope_id)\n\
  tuple returns the existing Event row (idempotent=True). Replay-safe.\n\nCLOSED is\
  \ terminal at the Execution level — re-entry creates a NEW\nExecution row inside\
  \ the same Campaign (CONTEXT decision #5,\nmulti-Execution Campaign rollup).\n"
location:
  source: VM100/backend/journal/services/execution_service.py
  shared_engine: VM100/backend/journal/services/lifecycle_base.py
api_structure: "ExecutionService.transition_to(\n    execution_id: UUID,\n    target_state:\
  \ ExecutionState,\n    reason: str,\n    actor: str,\n    metadata: dict | None\
  \ = None,\n    source: Literal[frontend|dagster|agent|script|adapter] = \"script\"\
  ,\n    source_envelope_id: UUID | None = None,\n) -> tuple[Execution, Event, idempotent:\
  \ bool]\n\nRaises:\n  InvalidTransitionError — target_state not in ALLOWED_TRANSITIONS[current_state]\n\
  \  pydantic.ValidationError — event payload fails Literal validation (programming\
  \ error)\n"
guarantees:
- Validate target_state in ALLOWED_TRANSITIONS[current_state] or raise InvalidTransitionError
- 'Atomic: Event row INSERT + state UPDATE in one transaction.atomic() block'
- Domain signal emitted post-commit only (transaction.on_commit) — NEVER on rollback
- Idempotent on (execution_id, target_state, source_envelope_id) tuple
- SELECT FOR UPDATE row lock — concurrent calls serialize cleanly
- Pydantic-typed event payload (ExecutionStateTransitionEvent) — Literal validation
  BEFORE INSERT
- ALLOWED_TRANSITIONS table is locked (3 states, 3 transitions); CLOSED terminal
- PENDING -> CLOSED handles broker rejection / cancel BEFORE fill
allowed_transitions_source: execution state_machine YAML (registry/state_machine/execution.yaml)
related_capabilities:
- execution
- execution_state_transition
- campaign_service
- idea_service
