description: >
  Typed emit helpers for all 10 Phase 48 refinement lifecycle events. Each
  helper validates payload shape against a typed Pydantic schema then calls
  phase56_client.emit_event with the hardcoded event_type + correlation_id
  + causality_scope='IDEA'.

  Sole-emitter invariant (CONTEXT § Decision 18): the orchestrator
  (refinement_orchestrator service + the HTTP entry endpoint) is the SOLE
  EMITTER of refinement lifecycle events. This module is the typed
  emission boundary; AST guard at test time forbids importing it from
  outside the authorized importer set (orchestrator package + endpoint).

  10 typed helpers:
    emit_refinement_loop_started
    emit_iteration_started
    emit_critic_verdict_received
    emit_hard_veto_triggered
    emit_identity_drift_detected
    emit_convergence_stall_detected
