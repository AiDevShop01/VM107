id: belief_store_service
type: service
status: real
shipped: 87
last_changed: "2026-06-16"
# Phase 47.6 Stage 3 (identity_uniqueness): ids are globally unique across
# types. The contract YAML at registry/contract/belief_store.yaml owns the
# canonical `belief_store` id (cited by agent_profile allowed_tools as
# `belief_store.query` / `belief_store.propose`). This service YAML carries
# the runtime deployment surface (env_vars, source_module, latency_budget)
# and takes the suffixed id `belief_store_service`. Bug fix shipped in
# Plan 87-14 — Plan 87-09 originally shipped both with id=belief_store
# which broke Phase 47.6 boot-time validation.
impact_on_decision: HIGH
hard_scoped: true
allowed_agent_profiles:
  - vm107.macro_regime_analyst
  - vm107.macro_regime_monitor

name: BeliefStore runtime
description: |
  In-process Python service. Reads/writes the Postgres `belief` table (owned
  by VM101 migration 0004_phase87_belief); caches reads in MongoDB collection
  `belief_query_cache` (TTL 60s). Fails-fast at construction if either
  BELIEF_STORE_POSTGRES_URL or BELIEF_STORE_MONGO_URL env var is missing.
owner_vm: vm107
owner: engineering

runtime: python_in_process
contract: belief_store
contracts:
  - belief_store
env_vars:
  - BELIEF_STORE_POSTGRES_URL
  - BELIEF_STORE_MONGO_URL
latency_budget_ms: 50
brain_absorbed:
  - B9
