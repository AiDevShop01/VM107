id: risk_normal
type: state_machine
status: real
shipped: 72
planned_phase: null
namespace: risk
scope: account
short_description: 'Risk state: Normal — drawdown and exposure within defined thresholds.'
long_description: >
  RISK_NORMAL is the baseline risk state. Drawdown is within the trader's defined daily
  drawdown limit (default: no more than 1% of account balance drawn down within session)
  and open exposure is within position-sizing rules. All forward-chain lifecycle transitions
  are permitted. The `risk_not_critical` guard passes trivially in NORMAL state.
location:
  source: VM100/backend/mission_control/state_engine/
  contracts:
    state_enum: fingpt_core.contracts.state_engine.RiskState
entry_triggers:
  - drawdown_below_threshold
  - account_reset
  - manual_override_requested
exit_triggers:
  - drawdown_above_elevated_threshold
  - exposure_above_elevated_threshold
tags:
  - phase-72
  - risk
hard_scoped: true
last_changed: 2026-05-29
impact_on_decision: HIGH
allowed_agent_profiles: []
deprecated: false
