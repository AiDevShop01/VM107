id: system_idle
type: state_machine
status: real
shipped: 72
planned_phase: null
namespace: cognitive_lifecycle
short_description: 'Engine bootstrap state and terminal rest state between trading sessions.'
long_description: >
  SYSTEM_IDLE is the start and terminal state of the cognitive lifecycle. The engine
  initializes here via engine_initialized + STATE_ENTERED(SYSTEM_IDLE) (cold start) and
  returns here after POST_MARKET_REVIEW completes. While idle, no active monitoring or
  opportunity detection workflows run. The trader is between sessions or offline.
  SYSTEM_IDLE maps to the CLOSE surface (last surface of each day), ensuring Mission
  Control renders in a settled, low-priority posture when the trader is not active.
location:
  source: VM100/backend/mission_control/state_engine/
  contracts:
    state_enum: fingpt_core.contracts.state_engine.PrimaryLifecycleState
entry_triggers:
  - engine_initialized
  - post_market_review_completed
  - manual_override_requested
exit_triggers:
  - market_arrival_detected
  - manual_override_requested
active_workflows:
  - SystemIdleMonitoringWorkflow
default_ai_behavioral_mode: ai_behavioral_reflective
allowed_ai_modes:
  - ai_behavioral_reflective
  - ai_behavioral_research
  - ai_behavioral_analytical
widget_priority_profile: system_idle_default
subscription_profile: close_default
surface_state_mapping: close
tags:
  - phase-72
  - cognitive_lifecycle
  - primary_operational
hard_scoped: true
last_changed: 2026-05-29
impact_on_decision: HIGH
allowed_agent_profiles: []
deprecated: false
