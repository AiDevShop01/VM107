id: cognitive_fatigued
type: state_machine
status: real
shipped: 72
planned_phase: null
namespace: cognitive
scope: user
short_description: 'Cognitive state: Fatigued — diminished attention, slower processing, elevated error risk.'
long_description: >
  FATIGUED reflects reduced cognitive capacity from session length, emotional strain, or
  physical fatigue. Decision quality degrades: the trader may miss setups, misread levels,
  or execute later than optimal. Inferred by behavioral_mentor_agent from behavioral signals:
  increasing response latency, decreasing plan adherence, more frequent hesitation patterns.
  The engine may surface soft warnings about session length. Cognitive carries across
  account switches — one human, same fatigue regardless of which account they switch to.
  Subject to hysteresis guard.
location:
  source: VM100/backend/mission_control/state_engine/
  contracts:
    state_enum: fingpt_core.contracts.state_engine.CognitiveState
entry_triggers:
  - cognitive_fatigued_inferred
exit_triggers:
  - cognitive_focused_inferred
  - cognitive_stressed_inferred
tags:
