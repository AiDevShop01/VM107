id: execution
type: state_machine
status: real
shipped: 72
planned_phase: null
namespace: cognitive_lifecycle
short_description: 'Order submitted or trade opened; engine awaiting fill confirmation.'
long_description: >
  EXECUTION is the cognitive lifecycle state entered when a trade order is placed
  (trade_opened / order_submitted). The engine shifts to SUPERVISORY mode: the focus
  narrows to order confirmation and fill receipt. Active position tracking and fill
  monitoring run. Exits to ACTIVE_SUPERVISION when the fill is confirmed (fill_received),
  or directly to EXIT_CLOSURE if the trade is immediately closed. Maps to the MID surface.
  Note: the mechanical broker-position lifecycle (PENDING/OPEN/CLOSED) is separately
  owned by ExecutionService (Phase 55). These are orthogonal concerns — cognitive EXECUTION
  state = "trader intent and focus during order placement"; mechanical EXECUTION = "broker
  position mechanical state".
location:
  source: VM100/backend/mission_control/state_engine/
  contracts:
    state_enum: fingpt_core.contracts.state_engine.PrimaryLifecycleState
entry_triggers:
  - trade_opened
  - order_submitted
  - manual_override_requested
exit_triggers:
  - fill_received
  - trade_closed
  - manual_override_requested
active_workflows:
  - OrderMonitoringWorkflow
  - FillConfirmationWorkflow
default_ai_behavioral_mode: ai_behavioral_supervisory
allowed_ai_modes:
  - ai_behavioral_supervisory
  - ai_behavioral_tactical
  - ai_behavioral_adaptive
widget_priority_profile: execution_default
subscription_profile: mid_default
surface_state_mapping: mid
tags:
  - phase-72
  - cognitive_lifecycle
  - primary_operational
hard_scoped: true
last_changed: 2026-05-29
impact_on_decision: HIGH
allowed_agent_profiles: []
deprecated: false
