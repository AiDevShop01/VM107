id: risk_warning
type: state_machine
status: real
shipped: 72
planned_phase: null
namespace: risk
scope: account
short_description: 'Risk state: Warning — drawdown significantly exceeds healthy range.'
long_description: >
  RISK_WARNING is the second warning tier. Drawdown or exposure has reached a level
  requiring active attention (e.g., 75% of daily drawdown limit consumed). The
  `risk_not_critical` guard fires with severity=warning on forward-chain transitions.
  Transitions are still advisory in Phase 72 — they complete with guard events emitted.
  RISK_WARNING is a signal to reduce position size and increase scrutiny. Phase 73
  may block new EVALUATION → EXECUTION transitions in this state.
location:
  source: VM100/backend/mission_control/state_engine/
  contracts:
    state_enum: fingpt_core.contracts.state_engine.RiskState
entry_triggers:
  - drawdown_above_warning_threshold
  - exposure_above_warning_threshold
exit_triggers:
  - drawdown_below_elevated_threshold
  - drawdown_above_critical_threshold
tags:
  - phase-72
  - risk
hard_scoped: true
last_changed: 2026-05-29
impact_on_decision: HIGH
allowed_agent_profiles: []
deprecated: false
