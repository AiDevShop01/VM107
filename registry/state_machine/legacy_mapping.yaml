id: legacy_status_mapping
type: state_machine
subtype: legacy_compatibility_map
status: real
shipped: 55
planned_phase: null
short_description: 'Bidirectional mapping between TradeJournal.STATUS_CHOICES (legacy
  6-state) and CampaignState (canonical 12-state). Locked in CONTEXT decision #8.

  '
long_description: "Phase 55 ships the canonical Idea / Campaign / Execution / Event\n\
  hierarchy alongside a TradeJournal Python adapter (compatibility\nfacade, CONTEXT\
  \ decision #8). This YAML is the machine-readable\nsource-of-truth for translating\
  \ between the two layers.\n\nForward direction (legacy_to_canonical, 6 -> canonical\
  \ 12):\n  Used by the Phase 55.7 backfill to set Campaign.state when\n  synthesizing\
  \ one Campaign per existing TradeJournal row. Locked\n  1:1 per CONTEXT decision\
  \ #8.\n\nInverse direction (canonical_to_legacy, 12 -> legacy 6):\n  Used by:\n\
  \    - Phase 55.4 lifecycle_base._regenerate_journal_cache\n      (Decision 5 +\
  \ ISSUE-8 fix): after CampaignService.transition_to\n      runs, the helper writes\
  \ the projected legacy status onto the\n      linked TradeJournal cache row inside\
  \ the SAME atomic block.\n    - Phase 55.5 TradeJournalAdapter read projection:\
  \ when the legacy\n      TradeJournal.status field is read, the adapter projects\
  \ through\n      this map.\n\nThe 6 canonical-only states (WATCHLIST, SETUP_FORMING,\
  \ EXECUTING,\nMANAGING, ARCHIVED, RE_EVALUATED) have NO legacy equivalent; for\n\
  cache regen + read projection they collapse to the nearest legacy\nprojection so\
  \ the legacy UI never sees an empty/unknown status.\nCollapse choices documented\
  \ inline below + in the Python module.\n\nDrift between this YAML and the Python\
  \ module is a bug. Phase 55\nships an automated test\n(VM100/backend/journal/tests/test_capability_registry_55.py\n\
  ::test_legacy_mapping_matches_python) that verifies they agree.\n"
location:
  source: VM100/backend/journal/adapters/legacy_status_mapping.py
mapping:
  legacy_to_canonical:
    DRAFT: IDEA_CREATED
    READY: READY
    EXECUTED: OPEN
    SYNCED: CLOSED
    CLOSED: ANALYZING
    REVIEWED: REVIEWED
  canonical_to_legacy:
    IDEA_CREATED: DRAFT
    WATCHLIST: DRAFT
    SETUP_FORMING: DRAFT
    READY: READY
    EXECUTING: READY
    OPEN: EXECUTED
    MANAGING: EXECUTED
    CLOSED: SYNCED
    ANALYZING: CLOSED
    REVIEWED: REVIEWED
    ARCHIVED: REVIEWED
    RE_EVALUATED: DRAFT
related_capabilities:
- campaign
- trade_journal_adapter
tags:
- phase-55
- transitional
- legacy
- compatibility_map
