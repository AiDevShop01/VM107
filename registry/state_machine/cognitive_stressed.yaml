short_description: 'Cognitive state: Stressed — elevated emotional pressure, fight-or-flight response active.'
long_description: >
  STRESSED reflects acute emotional pressure — typically triggered by a loss sequence,
  drawdown, or high-stakes position. The trader is in a stress response: narrowed attention,
  heightened impulsivity, reduced capacity for deliberate analysis. Revenge-trading risk is
  highest in this state. Inferred by behavioral_mentor_agent from: rapid sequential entries
  after losses, increasing trade frequency, decreasing setup quality scores, override of
  stop-loss placements. The engine surfaces strong advisory nudges toward session pause.
  Subject to hysteresis guard.
