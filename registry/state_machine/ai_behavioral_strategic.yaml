short_description: 'AI Behavioral mode: Strategic — big-picture orientation, bias setting, session framing.'
long_description: >
  STRATEGIC mode is used when the trader needs broad, macro-level AI assistance: session
  bias framing, overnight context loading, directional thesis construction. The AI focuses
  on higher-timeframe analysis, fundamental context, and strategic opportunity mapping.
  This mode is appropriate for pre-session and arrival states where the priority is
  orientation rather than immediate action. Compatible with lifecycle states where the
  trader is preparing rather than executing.
