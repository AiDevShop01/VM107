short_description: 'Cognitive state: Disciplined — consistent rule adherence, emotion-controlled execution.'
long_description: >
  DISCIPLINED reflects the trader's highest behavioral state: systematic rule adherence,
  emotion-controlled execution, and consistent application of their trading framework.
  Similar to FOCUSED but with an emphasis on the process-over-outcome orientation —
  the disciplined trader executes the plan regardless of recent P&L. Inferred by
  behavioral_mentor_agent from: high plan adherence score, consistent position sizing,
  pre-defined exit execution, low impulsive override count. Dwell hysteresis ensures
  DISCIPLINED is only assigned after sustained evidence. Subject to hysteresis guard.
