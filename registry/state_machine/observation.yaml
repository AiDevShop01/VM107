id: observation
type: state_machine
status: real
shipped: 72
planned_phase: null
namespace: cognitive_lifecycle
short_description: 'Market is open; trader is watching, monitoring liquidity and session flow.'
long_description: >
  OBSERVATION is the resting state during an active trading session. The trader is
  present and watching but no actionable opportunity has yet been identified. Session
  monitoring, liquidity observation, and passive opportunity scanning run continuously.
  Entered on market_session_opened (from PRE_MARKET) and re-entered after a trade
  closes (trade_closed return loop). Exits to DISCOVERY when an opportunity score
  threshold is exceeded, or to SYSTEM_IDLE if the session ends without a trade.
  Maps to the OPEN surface.
location:
  source: VM100/backend/mission_control/state_engine/
  contracts:
    state_enum: fingpt_core.contracts.state_engine.PrimaryLifecycleState
entry_triggers:
  - market_session_opened
  - trade_closed
  - manual_override_requested
exit_triggers:
  - opportunity_score_threshold_exceeded
  - evaluation_launched
  - market_session_closed
  - manual_override_requested
active_workflows:
  - SessionMonitoringWorkflow
  - LiquidityObservationWorkflow
  - OpportunityMonitoringWorkflow
default_ai_behavioral_mode: ai_behavioral_observational
allowed_ai_modes:
  - ai_behavioral_observational
  - ai_behavioral_tactical
  - ai_behavioral_analytical
  - ai_behavioral_research
widget_priority_profile: observation_default
subscription_profile: open_default
surface_state_mapping: open
tags:
  - phase-72
  - cognitive_lifecycle
  - primary_operational
hard_scoped: true
last_changed: 2026-05-29
impact_on_decision: HIGH
allowed_agent_profiles: []
deprecated: false
