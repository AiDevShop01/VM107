short_description: 'AI Behavioral mode: Neutral Reflective — immediate post-trade decompression, unbiased review.'
long_description: >
  NEUTRAL_REFLECTIVE mode is the immediate post-trade state. After a position closes —
  win or loss — the AI shifts into an emotionally neutral, factual review mode. No
  judgment, no performance pressure; just clear-eyed acknowledgment of what happened
  versus what was planned. This mode prevents the AI from amplifying post-trade emotion
  (overconfidence after a win, revenge-trading impulse after a loss). The decompression
  layer before REFLECTIVE mode's deeper analysis kicks in. Default mode for EXIT_CLOSURE;
  available in POST_MARKET_REVIEW for initial trade-by-trade review.
