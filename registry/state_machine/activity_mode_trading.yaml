id: activity_mode_trading
type: state_machine
status: real
shipped: 72
planned_phase: null
namespace: activity_mode
scope: account
short_description: 'Activity mode: Trading — active trade(s) open or in execution workflow.'
long_description: >
  TRADING is the Activity Mode state when the trader has at least one active position or
  is in the process of entering one (EXECUTION or ACTIVE_SUPERVISION or TRADE_MANAGEMENT
  primary lifecycle states). Indicates the trader's current primary activity is managing
  live market exposure. Transitions back to IDLE when the last position is closed. Note:
  Activity Mode TRADING is orthogonal to AI Behavioral TACTICAL — the former describes
  what the trader is doing, the latter describes how the AI is assisting. A trader can be
  in TRADING (Activity Mode) + ANALYTICAL (AI Behavioral) simultaneously when running a
  structured trade review mid-position.
location:
  source: VM100/backend/mission_control/state_engine/
  contracts:
    state_enum: fingpt_core.contracts.state_engine.ActivityModeState
entry_triggers:
  - trade_opened
  - fill_received
  - manual_override_requested
exit_triggers:
  - last_position_closed
  - manual_override_requested
tags:
  - phase-72
  - activity_mode
hard_scoped: true
last_changed: 2026-05-29
impact_on_decision: HIGH
allowed_agent_profiles: []
deprecated: false
