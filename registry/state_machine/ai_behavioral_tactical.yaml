short_description: 'AI Behavioral mode: Tactical — fast, decision-focused, setup-specific analysis.'
long_description: >
  TACTICAL mode is used when the trader needs rapid, focused AI assistance on a specific
  setup: entry confirmation, stop placement, near-term invalidation levels. The AI narrows
  its lens to the immediate opportunity — no big-picture context loading, maximum
  decisiveness. This is the "in the moment" mode, appropriate for DISCOVERY and early
  EVALUATION where speed and precision matter. Also available in EXECUTION for order
  refinement.
