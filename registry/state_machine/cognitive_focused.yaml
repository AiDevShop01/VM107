id: cognitive_focused
type: state_machine
status: real
shipped: 72
planned_phase: null
namespace: cognitive
scope: user
short_description: 'Cognitive state: Focused — peak attention, clear thinking, optimal decision-making.'
long_description: >
  FOCUSED is the optimal cognitive state. The trader has clear attention, disciplined
  adherence to plan, and healthy emotional regulation. Decision quality is highest in this
  state. Inferred by Phase 60 behavioral_mentor_agent from behavioral signals: consistent
  execution timing, plan adherence rate, low impulsive override frequency. The engine
  trusts FOCUSED traders with less friction and fewer advisory nudges. Subject to hysteresis
  guard (default 15min dwell before committing cognitive state change) to prevent flicker.
location:
  source: VM100/backend/mission_control/state_engine/
  contracts:
    state_enum: fingpt_core.contracts.state_engine.CognitiveState
entry_triggers:
  - cognitive_focused_inferred
  - cognitive_state_reset
exit_triggers:
  - cognitive_fatigued_inferred
  - cognitive_stressed_inferred
  - cognitive_overconfident_inferred
tags:
