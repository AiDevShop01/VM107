short_description: 'AI Behavioral mode: Analytical — structured evaluation, R:R assessment, data-driven.'
long_description: >
  ANALYTICAL mode provides structured, data-driven analysis support. The AI runs systematic
  evaluation frameworks: risk-to-reward calculations, statistical edge assessment, setup
  classification, confluence scoring. Less urgency than TACTICAL; more depth than
  OBSERVATIONAL. Used during EVALUATION for formal trade reviews, during OBSERVATION for
  opportunity pre-screening, and during post-trade analysis in EXIT_CLOSURE and
  POST_MARKET_REVIEW. The default mode for the EVALUATION lifecycle state.
