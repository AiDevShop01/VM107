short_description: 'Cognitive state: Overconfident — win-streak bias, elevated risk tolerance, confirmation bias.'
long_description: >
  OVERCONFIDENT reflects inflated confidence following a winning streak or strong performance
  period. The trader underestimates risk, overweights thesis confirmation, and may size up
  beyond their edge. Inferred by behavioral_mentor_agent from: increasing position sizes
  relative to historical norm, decreasing evaluation depth, faster trigger on marginal setups.
  The engine may surface warnings about risk normalization. Overconfidence is particularly
  dangerous because the trader feels optimal — detection relies on behavioral pattern
  deviation, not self-report. Subject to hysteresis guard.
