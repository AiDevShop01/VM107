id: campaign
type: state_machine
status: real
shipped: 55
planned_phase: null
short_description: '12-state Campaign lifecycle — primary workflow lifecycle owner
  of the Phase 55 hierarchy (Idea -> Campaign -> Execution -> Event).

  '
long_description: 'Campaign is the trader''s strategic intent layer (CONTEXT.md decision
  #2).

  Mechanical state (Execution) != Strategic state (Campaign). Campaigns

  tell what the trader is DOING; Executions tell what broker positions

  exist.


  All Campaign state mutations go through CampaignService.transition_to

  (the ONLY official entry point per CONTEXT decision #4). Frontend,

  Dagster, agents, and scripts MUST go through this service. Direct ORM

  state writes are blocked at the service layer (Pydantic typed payload

  validation) AND at the DB layer (CHECK constraints — defense-in-depth

  per Decision 5).


  Per CONTEXT decision #5, Campaign.state is a real, explicitly-stored

  column. NOT computed-on-read. NOT trigger-rolled-up from Execution

  states. CampaignService consumes Execution state-transition events as

  INPUT SIGNALS but DOES NOT auto-transition — discretionary trading

  requires intent preservation across mechanical state changes.


  RE_EVALUATED is a re-entry hub: a closed-then-reviewed campaign that

  the trader decides to re-attempt branches back to WATCHLIST or

  SETUP_FORMING (NOT IDEA_CREATED — the original thesis is preserved).

  ARCHIVED is terminal (no outgoing transitions); RE_EVALUATED is NOT

  terminal (it branches back into the active workflow).

  '
