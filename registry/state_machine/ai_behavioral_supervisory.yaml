short_description: 'AI Behavioral mode: Supervisory — real-time oversight of open positions.'
long_description: >
  SUPERVISORY mode activates when the trader has an active position and needs the AI to
  monitor for exit signals, invalidation events, and risk triggers. The AI watches price
  action against the original thesis, flags deviation, and surfaces time-sensitive alerts.
  This is the "guardian mode" — maximum alertness for position-threatening events.
  Compatible with lifecycle states where a position is live (EXECUTION, ACTIVE_SUPERVISION,
  TRADE_MANAGEMENT) and also available during EVALUATION for high-conviction pre-entry
  oversight.
