short_description: 'AI Behavioral mode: Reflective — end-of-session review, lessons, pattern analysis.'
long_description: >
  REFLECTIVE mode is used during post-session and idle states. The AI shifts into a
  review and learning orientation: surfacing patterns from the session, comparing results
  to the plan, identifying behavioral tendencies and improvement areas. No urgency or
  decision pressure — this is the consolidation and learning phase. Appropriate when the
  trader is journaling, reviewing their performance, or preparing for the next session.
  Compatible with SYSTEM_IDLE and POST_MARKET_REVIEW lifecycle states.
