short_description: 'Market session: NY Overlap — highest liquidity window (London + NY combined).'
long_description: >
  The New York Overlap covers the London-NY overlap hours (approximately 12:00–17:00 UTC).
  This is the highest-liquidity window of the trading day, with both major FX sessions
  simultaneously active. Institutional flows peak; spreads tighten. Together with
  session_london_open, this session satisfies the `market_open` guard on
  OBSERVATION → DISCOVERY. Session state computed per-request from /api/system/sessions.
