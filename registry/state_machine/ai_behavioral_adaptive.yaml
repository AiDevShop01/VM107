short_description: 'AI Behavioral mode: Adaptive — responsive to evolving position, dynamic adjustment support.'
long_description: >
  ADAPTIVE mode activates when an open position requires dynamic adjustment in response
  to evolving price action. The AI monitors against the original thesis and surfaces
  adjustment recommendations: trailing stop placement, partial close levels, re-entry
  opportunities on pull-backs. This mode bridges the gap between SUPERVISORY (watching)
  and TACTICAL (acting) — the AI is responsive but not alarmed, making incremental
  adjustments. Default mode for TRADE_MANAGEMENT; available in EXECUTION and
  ACTIVE_SUPERVISION.
