id: risk_elevated
type: state_machine
status: real
shipped: 72
planned_phase: null
namespace: risk
scope: account
short_description: 'Risk state: Elevated — drawdown approaching limit; caution advised.'
long_description: >
  RISK_ELEVATED is the first warning tier. Drawdown or open exposure has crossed the
  elevated threshold (e.g., 50% of daily drawdown limit consumed). The `risk_not_critical`
  guard still passes — forward-chain transitions are permitted but the guard fires with
  severity=warning to surface awareness. The AI behavioral mode may shift toward more
  conservative recommendations. Phase 73 may flip DISCOVERY → EVALUATION guard to
  blocking in this state.
location:
  source: VM100/backend/mission_control/state_engine/
  contracts:
    state_enum: fingpt_core.contracts.state_engine.RiskState
entry_triggers:
  - drawdown_above_elevated_threshold
  - exposure_above_elevated_threshold
exit_triggers:
  - drawdown_below_threshold
  - drawdown_above_warning_threshold
tags:
  - phase-72
  - risk
hard_scoped: true
last_changed: 2026-05-29
impact_on_decision: HIGH
allowed_agent_profiles: []
deprecated: false
