id: trade_management
type: state_machine
status: real
shipped: 72
planned_phase: null
namespace: cognitive_lifecycle
short_description: 'Position modified; trader in adaptive management mode adjusting risk parameters.'
long_description: >
  TRADE_MANAGEMENT is entered when the position is modified after the initial fill
  (position_modified — stop-loss move, partial close, target adjustment, trailing stop).
  The engine shifts to ADAPTIVE mode: the trader is responding to evolving price action
  and adjusting the trade plan. This is a longer-duration state than ACTIVE_SUPERVISION —
  the position is live but not demanding peak moment-to-moment attention; instead the
  trader is managing parameters. Exits to EXIT_CLOSURE when the position is fully closed
  (position_closed). Maps to the MID surface.
location:
  source: VM100/backend/mission_control/state_engine/
  contracts:
    state_enum: fingpt_core.contracts.state_engine.PrimaryLifecycleState
entry_triggers:
  - position_modified
  - manual_override_requested
exit_triggers:
  - position_closed
  - manual_override_requested
active_workflows:
  - TradeManagementWorkflow
  - AdaptiveStopWorkflow
  - PartialCloseWorkflow
default_ai_behavioral_mode: ai_behavioral_adaptive
allowed_ai_modes:
  - ai_behavioral_adaptive
  - ai_behavioral_supervisory
  - ai_behavioral_analytical
widget_priority_profile: trade_management_default
subscription_profile: mid_default
surface_state_mapping: mid
tags:
  - phase-72
  - cognitive_lifecycle
  - primary_operational
hard_scoped: true
last_changed: 2026-05-29
impact_on_decision: HIGH
allowed_agent_profiles: []
deprecated: false
