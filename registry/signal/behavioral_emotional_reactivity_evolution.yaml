last_changed: 2026-05-16

name: behavioral_emotional_reactivity_evolution
description: >
  BEHAVIORAL signal for the EMOTIONAL_REACTIVITY metric family (CTX-DEC-12 LOCKED).
  Produced weekly by the Dagster behavioral_evolution_asset from frozen
  CohortSnapshot + BehavioralEvolutionSeries rows for the EMOTIONAL_REACTIVITY family.
  Covers 3 locked metrics: revenge_trade_probability, risk_size_after_loss,
  trade_frequency_after_stopout.

  Measures longitudinal trends in reactive trading behavior following adverse events
  over trade cohorts. Trend slope and Bayesian posterior (bayesian_normal_normal_v1)
  assess whether reactive patterns are increasing or decreasing.

  truth_mode LOCKED to ADAPTIVE_OBSERVATION (CTX-DEC-17).
  origin_mode is HISTORICAL_BOOTSTRAP on first run, LIVE_FORWARD_ACCUMULATION thereafter.
  SHADOW_ONLY — never surfaced in apply UI (CTX-DEC-15).

  Phase 62 advisory hypothesis signal. NOT a trading instruction.
  CTX-DEC-12: metric labels describe OBSERVABLE BEHAVIOR only — psychological
  labels (fearfulness, confidence, discipline) are STRICTLY FORBIDDEN.
  The family name EMOTIONAL_REACTIVITY describes the behavioral pattern class,
  not any internal emotional state.

signal_category: BEHAVIORAL
phase: 62
version: "1.0.0"
scope: advisory

metric_family: EMOTIONAL_REACTIVITY
metrics:
  - name: revenge_trade_probability
    description: P(new trade within N minutes of stopout)
    statistical_method: bayesian_normal_normal_v1
    min_sample: 100
  - name: risk_size_after_loss
    description: Ratio of size on next trade vs baseline after a loss
    statistical_method: bayesian_normal_normal_v1
    min_sample: 100
  - name: trade_frequency_after_stopout
    description: Count of trades in 60min window after a stopout
    statistical_method: bayesian_normal_normal_v1
    min_sample: 100

source_asset: behavioral_evolution_asset
dagster_job: behavioral_evolution_job
cron: "40 23 * * 0"  # Sunday 23:40 UTC

citation_grammar: "[ref:behavioral_evolution:<cohort_snapshot_id>:EMOTIONAL_REACTIVITY:<metric_name>]"
resolvable_fields:
  - metric_value
  - trend_slope
  - trend_significance
  - effect_size
  - n_effective
  - fragmentation_score
  - evidence_density_label
  - sample_size
  - required_sample_size
  - status

