last_changed: 2026-05-16

name: behavioral_rule_deviation_evolution
description: >
  BEHAVIORAL signal for the RULE_DEVIATION metric family (CTX-DEC-12 LOCKED).
  Produced weekly by the Dagster behavioral_evolution_asset from frozen
  CohortSnapshot + BehavioralEvolutionSeries rows for the RULE_DEVIATION family.
  Covers 3 locked metrics: checklist_bypass_rate, unapproved_override_rate,
  setup_quality_violation_rate.

  Measures longitudinal trends in rule-adherence behavior over trade cohorts.
  Trend slope and Bayesian posterior (normal-normal conjugate, bayesian_normal_normal_v1)
  assess whether rule-deviation rates are increasing or decreasing.

  truth_mode LOCKED to ADAPTIVE_OBSERVATION (CTX-DEC-17).
  origin_mode is HISTORICAL_BOOTSTRAP on first run, LIVE_FORWARD_ACCUMULATION thereafter.
  SHADOW_ONLY — never surfaced in apply UI (CTX-DEC-15).

  Phase 62 advisory hypothesis signal. NOT a trading instruction.
  CTX-DEC-12: metric labels describe OBSERVABLE BEHAVIOR only — psychological
  labels (fearfulness, confidence, discipline) are STRICTLY FORBIDDEN.

signal_category: BEHAVIORAL
phase: 62
version: "1.0.0"
scope: advisory

metric_family: RULE_DEVIATION
metrics:
  - name: checklist_bypass_rate
    description: Fraction of trades with at least one unchecked checklist item
    statistical_method: bayesian_normal_normal_v1
    min_sample: 100
  - name: unapproved_override_rate
    description: Fraction of trades where a hard_reject was overridden
    statistical_method: bayesian_normal_normal_v1
    min_sample: 100
  - name: setup_quality_violation_rate
    description: Fraction of trades scoring below A+ that were entered anyway
    statistical_method: bayesian_normal_normal_v1
    min_sample: 100

source_asset: behavioral_evolution_asset
dagster_job: behavioral_evolution_job
cron: "40 23 * * 0"  # Sunday 23:40 UTC

citation_grammar: "[ref:behavioral_evolution:<cohort_snapshot_id>:RULE_DEVIATION:<metric_name>]"
resolvable_fields:
  - metric_value
  - trend_slope
  - trend_significance
  - effect_size
  - n_effective
  - fragmentation_score
  - evidence_density_label
  - sample_size
  - required_sample_size
  - status

related_capabilities:
  - get_behavioral_evolution_tool
  - behavioral_hesitation_evolution
  - behavioral_premature_exit_evolution
  - behavioral_emotional_reactivity_evolution
  - drift_counterfactual_delta

