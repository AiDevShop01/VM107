name: drift_winrate_calibration
description: >
  BEHAVIORAL drift signal for per-cohort winrate calibration observations.
  Derived from DriftReport rows filtered to BEHAVIORAL signal_category.
  Measures whether observed winrate systematically deviates from the
  historical baseline within the frozen CohortSnapshot window.

  truth_mode LOCKED to ADAPTIVE_OBSERVATION (CTX-DEC-17).
  SHADOW_ONLY — never surfaced in apply UI (CTX-DEC-15).
  In Phase 62.1, this signal is populated by filtering drift_report rows
  where signal_category=BEHAVIORAL. Phase 62.2 (Behavioral Evolution Layer)
  will introduce dedicated behavioral metric series.

  Phase 62 advisory hypothesis signal. NOT a trading instruction.

