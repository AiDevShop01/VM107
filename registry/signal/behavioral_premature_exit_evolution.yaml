name: behavioral_premature_exit_evolution
description: 'BEHAVIORAL signal for the PREMATURE_EXIT metric family (CTX-DEC-12 LOCKED).
  Produced weekly by the Dagster behavioral_evolution_asset from frozen CohortSnapshot
  + BehavioralEvolutionSeries rows for the PREMATURE_EXIT family. Covers 3 locked
  metrics: exit_before_counterfactual_delta, MFE_left_on_table, BE_before_structural_invalidation.

  Measures longitudinal trends in premature exit behavior over trade cohorts. Trend
  slope and Bayesian posterior (normal-normal conjugate, bayesian_normal_normal_v1)
  assess whether premature exit behavior is increasing or decreasing.

  truth_mode LOCKED to ADAPTIVE_OBSERVATION (CTX-DEC-17). origin_mode is HISTORICAL_BOOTSTRAP
  on first run, LIVE_FORWARD_ACCUMULATION thereafter. SHADOW_ONLY — never surfaced
  in apply UI (CTX-DEC-15).

  Phase 62 advisory hypothesis signal. NOT a trading instruction. CTX-DEC-12: metric
  labels describe OBSERVABLE BEHAVIOR only — psychological labels (fearfulness, confidence,
  discipline) are STRICTLY FORBIDDEN.

  '
