id: vm107_indicator_enrichment_agent
type: agent
phase: 88.1
trigger: event_driven
input_contract:
  indicator_id: string
  curator_layer: object
output_contract: contract_indicator_enrichment
status: real
shipped: 88.1-08
profile_path: VM107/agents/indicator_enrichment_agent/agent.py
description: >
  VM107 agent that generates IndicatorEnrichment output for a given economic indicator.
  Enforces Pydantic write-time gate (extra='forbid', retry-once-then-fail per Phase 38).
  Triggered by: new release, regime change, relationship drift, 7-day elapsed, manual refresh.
  Implemented in Phase 88.1 Plan 08. Layer 2 of the 3-layer AI Description architecture.
fallback_hierarchy:
  - ai_success: render AI enrichment
  - ai_fail_validation: render curator Layer 1
  - curator_missing: render Insufficient Metadata state
  - system_error: render Error state
regeneration_triggers:
  - new_release
  - regime_change
  - relationship_drift
  - seven_day_elapsed
  - manual_refresh
seed_indicators:
  - CPIAUCSL
  - CPILFESL
  - GDPC1
  - ISM
  - PAYEMS
  - UNRATE
  - M2SL
  - WALCL
  - FEDFUNDS
  - DGS10
  - VIXCLS
  - OIL
# Required by CapabilityRegistry stage-2 schema validator. HIGH because
# indicator enrichment feeds the IndicatorPage that drives macro-analyst
# decisions — failure to enrich materially changes recommendation quality.
impact_on_decision: HIGH
