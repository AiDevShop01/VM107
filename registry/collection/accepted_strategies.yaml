short_description: 'Promoted operational research assets (CONTEXT § Decision 11).
  Once a refinement loop terminates with ACCEPTED, an immutable WORM document is
  written here. Strategies are first-class operational cognition, not transient
  pipeline state.'
long_description: 'accepted_strategies is the canonical truth substrate for
  strategies that survived a refinement loop and earned promotion to operational
  status. Doc carries accepted_strategy_id, root_hypothesis_id, strategy_family,
  refinement_loop_id, final {strategy_spec, code_module, backtest_result,
  critic_verdict} ids, the registry_snapshot_hash at acceptance, the full
  iteration_artifact_ids trajectory, accepted_at, accepted_by (orchestrator
  service version), and acceptance_reason. WORM: no editing, no mutation, no
  "updating accepted strategy" — a new refinement loop accepted under the same
  hypothesis writes a new row with a fresh accepted_strategy_id (versioning via
  Phase 45 Q9 semver). Registry fan-out to VM107/registry/strategy/<id>.yaml is
  Plan 48-08a''s job.

  '
