description: >-
  Phase 88 — Revision chain API. Returns the ordered chain of every vintage
  of a single release (Initial → Revision 1 → Revision N) with
  delta_from_previous + days_after_release. Walk computes deltas in Python
  from a SQL query ORDERed by vintage_date ASC. Empty chain (no rows for the
  release_date) returns 200 + chain=[] — the indicator exists; the date just
  has no vintage data. Single-entry chain (initial release only) returns
  length 1 with delta_from_previous=null. Used by Phase 89 contradiction
  detector + the VM100 Revision View animation.
capability_type: read_facade
vm: vm102
methods:
  - name: get_revision_chain
    http_path: /api/v2/indicator-revisions/{id}
    http_method: GET
    parameters:
      - {name: id,           type: string, required: true,  description: "FRED indicator code, e.g. PAYEMS"}
      - {name: release_date, type: string, required: true,  description: "ISO date YYYY-MM-DD; the release date whose revision chain to fetch"}
    return_shape: "RevisionChainResponse"
location:
  source: VM102/backend/api/v2/indicator_revisions.py
  endpoint: /api/v2/indicator-revisions/{id}
  contracts:
    request: "params(id, release_date)"
    response: "RevisionChainResponse"
