id: vm102_indicator_revision_chain
type: vm102_api
phase: 88
method: GET
path: /api/v2/indicator-revisions/<id>
query_schema:
  release_date: {type: string, required: true, format: "ISO date YYYY-MM-DD"}
response_schema_ref: schemas/revision_chain_response.json
owner: engineering
latency_budget_ms: 500
envelope_contract: phase_70_5
status: real
shipped: 88
