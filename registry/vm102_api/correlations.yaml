description: >-
  Phase 86 — Rolling Pearson correlation time-series between a FRED macro indicator
  and a target asset (gold, usd, spx, treasuries, copper, nasdaq, eur, jpy).
  Returns a date-series of correlation coefficients over a configurable rolling window.
  Wrapped in Phase 70.5 ToolResultEnvelope. Used by CorrelationLaboratory panel (Plan 86-04).
capability_type: read_facade
vm: vm102
methods:
  - name: get_correlations
    http_path: /api/v2/analytics/indicator/{id}/correlations
    http_method: GET
    parameters:
      - {name: id,     type: string, required: true,  description: "FRED indicator code, e.g. CPIAUCSL"}
      - {name: asset,  type: string, required: true,  description: "Asset id from asset_universe (gold, usd, spx, ...)"}
      - {name: window, type: int,    required: false, default: 200, description: "Rolling window in months (50|100|200|500)"}
    return_shape: "CorrelationsResponse"
location:
  source: VM102/backend/api/v2/routers/macro_analytics.py
  endpoint: /api/v2/analytics/indicator/{id}/correlations
  contracts:
    request: "params(id, asset, window)"
