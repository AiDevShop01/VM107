id: vm102_correlations
type: vm102_api
phase: 86
method: GET
path: /api/v2/analytics/indicator/<id>/correlations
query_schema:
  asset:  {type: string, required: true}
  window: {type: int,    required: false, default: 200, allowed: [50, 100, 200, 500]}
response_schema_ref: schemas/correlations_response.json
