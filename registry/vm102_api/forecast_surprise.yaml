id: vm102_forecast_surprise
type: vm102_api
phase: 90
method: GET
path: /api/v2/forecast/surprise/<id>
query_schema: {}
response_schema_ref: schemas/forecast_surprise_response.json
error_codes:
  - UnknownIndicator      # HTTP 404 — indicator not in tier_classification.yaml
  - TierThreeNoForecast   # HTTP 400 — Tier-3 indicator (use scenario analysis)
  - ForecastComputeError  # HTTP 500 — load failure / model crash / contract validation
owner: engineering
latency_budget_ms: 5000
envelope_contract: phase_70_5
wraps_primitive: vm102_forecast_layer2_surprise   # SurpriseForecaster: AutoARIMA + consensus_history.yaml
status: real
shipped: 90
last_changed: "2026-06-23"
description: >-
  Phase 90 Layer 2 Surprise forecast — beat / miss / in_line direction
  prediction for the next release of indicator_id based on AutoARIMA
  point estimate vs analyst consensus. Consensus source: manually
  maintained VM102/backend/config/curator/forecast/consensus_history.yaml
  (Plan 05 decision = option-a, seeded from SPF / FRED MICH / IMF public
  projections; paid Bloomberg / Consensus Economics deferred to BACKLOG
  until budget allows). LD-90-1 LOCK: producer_kind="statistical" in
  the inner forecast_envelope — LLMs may NEVER emit ForecastResult.
  Response shape:
    {
      "direction": "beat" | "miss" | "in_line" | "unknown",
      "predicted_surprise": float | null,
      "consensus": float | null,
      "model_point": float,
      "historical_accuracy": float,
      "forecast_envelope": { ... ForecastResult-shape ... }
    }
  forecast_envelope.layer="surprise"; forecast_envelope.direction is
  mapped to {up, down, flat} (beat→up, miss→down, in_line→flat) so the
  envelope satisfies the strict ForecastResult Literal narrowing.
capability_type: read_facade
vm: vm102
methods:
  - name: get_surprise_forecast
    http_path: /api/v2/forecast/surprise/<id>
    http_method: GET
    parameters:
      - name: indicator_id
        type: string
        in: path
        required: true
    return_shape: "SurpriseForecastResponse"
location:
  source: VM102/backend/api/v2/forecast/surprise.py
  endpoint: /api/v2/forecast/surprise/<id>
  contracts:
    request: "no body"
    response: "SurpriseForecastResponse"
contracts:
  response_contract: VM102.backend.api.v2.forecast.surprise.SurpriseForecastResponse
consumed_by:
  - vm107.macro_surprise_forecaster        # Plan 05 Task 1 agent_profile (stub — full wiring is Plan 06)
  - vm107.macro_forecast_narrator           # READ-only; narrator emits ExplanationResult per LD-90-1
  - vm100.frontend.indicator_page.section_11_forecast_widget
related_capabilities:
  - vm102_forecast_result                   # contract entry (Plan 01)
  - vm102_forecast_indicator                # Layer 1 statistical sibling (Plan 02)
  - vm102_forecast_regime                   # Layer 3 regime sibling (Plan 04)
hard_scoped: false
impact_on_decision: HIGH
allowed_agent_profiles:
  - vm107.macro_surprise_forecaster
  - vm107.macro_forecast_narrator
deprecated: false
tags:
  - phase-90
  - macro
  - surprise
  - forecast
  - layer-2
  - consensus
  - vm102
  - read-facade
  - ld-90-1-no-llm-producer
  - ld-90-3-distribution-mandatory

# Phase 70.5 envelope-provenance fields
typical_confidence: 0.60        # Layer 2 is conditional on consensus accuracy
expected_freshness_seconds: 86400   # consensus YAML updated per release (daily check)
is_deterministic: false         # AutoARIMA selection has minor non-determinism
version: "1.0.0"
