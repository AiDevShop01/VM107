  - vm102_forecast_indicator                # Layer 1 statistical sibling (Plan 02)
  - vm102_forecast_regime                   # Layer 3 regime sibling (Plan 04)
  - vm102_forecast_surprise                 # Layer 2 surprise sibling (Plan 05 Task 1)
hard_scoped: false
