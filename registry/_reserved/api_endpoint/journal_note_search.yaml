name: "Diary semantic search endpoint"
description: |
  GET /api/journal/notes/search?q=<query> — semantic search across locked
  JournalNote rows backed by the Qdrant `journal_notes` collection.

  Phase 69 Plan 69-11a shipped the stub returning empty list (frontend
  unblock). Phase 69 Plan 69-13 replaced the stub with a real Qdrant query:
  embed query via VM101 -> Qdrant.search with user_id metadata filter ->
  return [{note_id, chunk_idx, score, snippet}, ...]. Graceful-degrade to
  [] on embed failure or Qdrant unreachable.

  Frontend NotesSurface adds a search bar that consumes this endpoint via
  the notes_client.searchNotes chokepoint (300ms debounce).

  Reservation rationale: 'api_endpoint' is not in the locked CapabilityType
  enum. Lives under `_reserved/` per the same convention as the sensor
  sibling. The registry loader skips _reserved paths.

