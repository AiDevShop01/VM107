name: "Diary semantic search endpoint"
description: |
  GET /api/journal/notes/search?q=<query> — semantic search across locked
  JournalNote rows backed by the Qdrant `journal_notes` collection.

  - Phase 69 Plan 69-11a: stub endpoint that returns an empty result list
    (lets the frontend wire UP front of UI without a dependency cycle).
  - Phase 69 Plan 69-13: real implementation — chunks + embeds locked
    notes, upserts to Qdrant, returns top-k matches with citation grammar
    `[ref:journal_note:<note_id>:<chunk_id>]`.

  Reservation rationale: 'api_endpoint' is not in the locked
  CapabilityType enum, so this entry lives under `_reserved/` per the
  same convention as the sensor sibling. The loader skips _reserved
  paths so the registry validator does not flag this scaffold.

