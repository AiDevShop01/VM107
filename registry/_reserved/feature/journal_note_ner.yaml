name: "NER for diary entity extraction"
description: |
  Run NER over locked JournalNote chunks and upsert
  (`(:JournalNote)-[:MENTIONS]->(Instrument | Concept | Person | Event)`)
  into Neo4j. Provider TBD via a 30-min spike in Phase 69 Plan 13
  (decision Q6 in 69-00-DECISIONS.md: REUSE-OR-SPACY — reuse the
  trade_narratives NER pipeline first; spaCy `en-core-web-sm` is the
  fallback if the reuse spike runs over 2h).

  Reservation rationale: 'feature' IS a valid CapabilityType, but the
  capability is not yet implementable (the underlying NER service ships
  in 69-13). Scaffolded under _reserved/ in pending state per the
  convention used for the sensor / api_endpoint siblings, so the
  registry validator does not reject `status: pending` (the locked
  CapabilityStatus enum has stub|experimental|real|deprecated but not
  pending). 69-13 will move this file to `registry/feature/` with
  `status: real` once the NER spike resolves.

