name: "NER for diary entity extraction"
description: |
  Extract entities from locked JournalNote chunks and upsert
  `(:JournalNote)-[:MENTIONS]->(Instrument | Concept | Person | Event)`
  into Neo4j via the `journal_note_entities` Dagster asset.

  Q6 NER provider decision (69-00-DECISIONS.md LOCKED: REUSE-OR-SPACY):

  Resolution path taken in Plan 69-13:
    1. REUSE checked: no callable NER existed in Dagster
       (`trade_narratives.py` not present in `assets/knowledge/`;
       `VM107/tools/persist_narrative*` are LLM persistence, not NER).
    2. spaCy fallback path: implemented as two-tier with zero new hard deps:
       a. PRIMARY (lazy): `import spacy` + `en_core_web_sm`. If both present,
          use spaCy PERSON / ORG / GPE / EVENT / MONEY / PRODUCT labels.
       b. FALLBACK: pure-Python regex — FX pairs (EUR/USD pattern),
          curated trading-ticker allow-list, hand-curated trading-concept
          vocabulary. Person/Event extraction only when spaCy is available.

  Rationale for not making spaCy a hard runtime dep: project memory
  `feedback_docker_rebuild_dep_cascade.md` flags adding spaCy +
  en_core_web_sm download as a high-risk Docker rebuild (4 deps need
  pinning together; en_core_web_sm adds ~50MB to the image). The Q6
  spirit ("cheap, no API cost") is satisfied by the pure-Python regex
  fallback, with a forward-compat path: dropping spaCy + en_core_web_sm
  into the image at any later point automatically upgrades extraction
  quality without contract changes.

