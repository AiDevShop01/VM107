name: "JournalNote lock-to-ingest sensor"
description: |
  Polls VM100 internal `/api/journal/notes/_internal/pending_ingest` every
  30 seconds and emits one RunRequest per locked note for
  `journal_note_ingest_job` (3 assets: chunks -> Qdrant, entities -> Neo4j,
  documents -> MongoDB).

  Built in Phase 69 Plan 13. Sensor body lives at
  `Dagster/fingpt_orchestration/src/fingpt_orchestration/sensors/journal_note_lock_sensor.py`.

  Reservation rationale: 'sensor' is not in the locked CapabilityType enum
  (16 values: tool/signal/pattern/feature/data_domain/knowledge/strategy/
  skill/agent_profile/service/event_type/state_machine/behavioral_pattern/
  counterfactual_scenario/replay_template/collection). The capability
  registry loader skips `_reserved/` paths (`core/registry/loader.py`
  line 37), so this YAML is a namespace claim that the validator will
  not reject. Promote when CapabilityType gains a SENSOR member or this
  entry is re-classified as a `service` and moved to `registry/service/`.

