name: "JournalNote lock-to-ingest sensor"
description: |
  Polls `JournalNote.is_locked=True AND pipeline_status.*='pending'` and
  emits a RunRequest for `journal_note_ingest_job`. Built in Phase 69
  Plan 13 (sensor body lives in
  `Dagster/.../fingpt_orchestration/sensors/journal_note_lock_sensor.py`).

  Reservation rationale: Phase 47.6 LD-7 says every new capability must
  have a registry entry on disk at creation time. The 'sensor' capability
  type is not yet in the locked CapabilityType enum (16 values, see
  `fingpt_core/contracts/capability_registry/__init__.py`), so this entry
  lives under `_reserved/` until either the enum gains a SENSOR member
  (Phase 47.x follow-up) or the entry is re-classified as a `service` and
  moved to `registry/service/` by 69-13.

  The capability_registry loader explicitly skips `_reserved/` paths
  (`core/registry/loader.py::load_all_yamls` line 37), so this YAML is a
  namespace claim that the validator will NOT reject.

