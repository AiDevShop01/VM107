status: real
shipped: 92
last_changed: "2026-06-29"
name: graph_search_tool
description: >-
  Parameterised Cypher templates for Neo4j knowledge-graph traversal.
  Originally shipped in Phase 92 (find_predecessors / find_successors /
  find_related / find_path / find_methods_using /
  find_validated_relationships) and amended by Phase 96 Plan 11 to add
  find_country_subgraph for the Country Knowledge Graph view tab
  (REQ-96-9).
capability_type: tool
vm: vm107
phase: 92
template_version: 1.0.0
tool_path: VM107/tools/graph/graph_search_tool.py
request_contract: GraphSearchRequest
response_contract: GraphSearchResponse
contracts:
  request: tools.graph.graph_search_tool.GraphSearchRequest
  response: tools.graph.graph_search_tool.GraphSearchResponse
backing_capabilities:
  - neo4j_knowledge_graph
consumed_by:
  - vm107.country_dna_generator
  - vm100.world.country_subgraph_resolver
related_capabilities:
  - country_knowledge_graph
hard_scoped: false
impact_on_decision: MEDIUM
allowed_agent_profiles:
  - vm107.country_dna_generator
  - vm107.macro_review_agent
  - vm107.macro_historical_analyst
deprecated: false
typical_confidence: 0.80
expected_freshness_seconds: 86400
