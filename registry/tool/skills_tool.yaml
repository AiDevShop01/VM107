status: real
description: >-
  Loads and manages agent skills at runtime (list, load, unload) from the
  filesystem skills registry. Backs the *_analyzer/_reader/_writer behavioral,
  trade-auditor and weekly-review sub-profiles plus strategy_refinement_critic.
category: system
version: "1.0.0"
producer: vm107
phase: 137
location:
  source: VM107/tools/skills_tool.py
tags:
  - skills
  - system
  - runtime
  - restore
hard_scoped: false
# §E-CRIT2.B RESTORE grantees (the 10 profiles that grant skills_tool).
