# Phase 137 P5 Plan 05 (§E-CRIT2.B RESTORE) — register skills_tool. The module
# (tools/skills_tool.py, class SkillsTool) is baked into the running image but had
# no registry/tool/*.yaml, so its 10 profile grants were advertising-invisible.
# Registration-only (D-07 RESTORE); the module is NOT edited.

id: skills_tool
name: skills_tool
