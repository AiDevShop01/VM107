description: 'Aggregate read tool: reads the latest TradeAnalyticsSnapshot for a given
  execution_id and returns the overall score + 6 category score breakdown in a structured
  TradeQualityScoreResult contract. This is NOT a compute tool — it reads the pre-computed
  snapshot row via VM100 internal endpoint GET /api/journal/internal/analytics-snapshot/{execution_id}.
  Returns the most recent snapshot regardless of scoring_ruleset_version.

  Use this when you need the overall trade quality summary without triggering a re-analysis
  run. For the full snapshot detail (breakdowns + narratives), call each individual
  category tool instead.

  '
