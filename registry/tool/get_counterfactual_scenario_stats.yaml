id: get_counterfactual_scenario_stats_tool
type: tool
status: real
shipped: 62
last_changed: 2026-05-16
name: get_counterfactual_scenario_stats
description: 'Returns persisted CounterfactualAggregateSnapshot for a (scenario, cohort)
  pair. Calls VM100 GET /api/journal/internal/adaptive/counterfactual-aggregate/{scenario_id}/{cohort_snapshot_id}.
  NEVER recomputes live — reads frozen Postgres rows only (CTX-DEC-16).

  CTX-DEC-14 defense-in-depth: returns None immediately if COUNTERFACTUAL_AGGREGATE
  is NOT in the caller''s adaptive_signal_categories frozenset.

  Returns None on 404 (no CF aggregate computed yet — normal before first weekly run).
  Returns None on transport error (graceful degradation).

  truth_mode=ADAPTIVE_OBSERVATION on returned snapshot (CTX-DEC-17). SHADOW_ONLY framing
  — never surfaced in apply UI (CTX-DEC-15). Phase 39 typed-API lock: never direct
  DB access from VM107.

  '
capability_type: adaptive_cf_aggregate_lookup
signal_category: COUNTERFACTUAL_AGGREGATE
vm100_endpoint_path: /api/journal/internal/adaptive/counterfactual-aggregate/{scenario_id}/{cohort_snapshot_id}
http_method: GET
parameters:
- name: scenario_id
  type: str
  required: true
  description: Scenario identifier (e.g. counterfactual.stop.atr_1_5)
- name: cohort_snapshot_id
  type: str (UUID)
  required: true
  description: UUID string of the frozen CohortSnapshot
- name: adaptive_signal_categories
  type: frozenset
  required: true
  description: 'Frozenset of AdaptiveSignalCategory values resolved from ScopeContext.
    If COUNTERFACTUAL_AGGREGATE not present, returns None without calling VM100.

    '
return_type: dict | None
return_on_error: null
error_modes:
- code: vm100_unavailable
  http_status: null
  description: Transport error — returns None
- code: vm100_404
  http_status: 404
  description: No CF aggregate computed yet — returns None
- code: vm100_http_error
  http_status: 4xx/5xx
  description: HTTP status error — returns None
- code: scope_pruned
  http_status: null
  description: COUNTERFACTUAL_AGGREGATE not in adaptive_signal_categories — returns
    None
contracts:
  response: fingpt_core.contracts.adaptive.counterfactual_aggregate.CounterfactualAggregateSnapshot
    | None
  error: null
capabilities:
- adaptive_cf_aggregate_read
related_capabilities:
