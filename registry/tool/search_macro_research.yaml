# Phase 92 Plan 05 — Capability Registry tool YAML for search_macro_research.
# Per 92-RESEARCH.md §"Pattern 5: Capability Registry YAML for New Tool"
# (lines 373-417). Stage 2 schema (Phase 47.6) requires impact_on_decision.

id: search_macro_research
type: tool
status: real
shipped: 92
name: search_macro_research
description: |
  Semantic search across macro research documents (Tier 1 official + Tier 3
  academic). Joins Qdrant `knowledge_base_v2` chunks with Neo4j
  (:ResearchDocument)-[:DISCUSSES_INDICATOR] edges to return per-indicator
  filtered, cited results. Used by macro_investigator (Phase 89 LD-92-8
  consolidation) + 3 Plan-5 research-intelligence agents (summarisation /
  citation / contrarian).
category: knowledge-retrieval
version: "1.0.0"
producer: vm107
phase: 92
location:
  source: VM107/tools/search_macro_research.py
  endpoint:
    search: VM101/api/v1/research/search
    graph: VM101/api/v1/research/graph/by-indicator
  contracts:
    request: fingpt_core.contracts.research.SearchMacroResearchRequest
    response: fingpt_core.contracts.research.SearchMacroResearchResponse
related_capabilities:
  - search_knowledge
  - vm102.indicator_history
tags:
  - macro
  - research
  - rag
  - phase-92
  - wave-5
hard_scoped: false
allowed_agent_profiles:
  - vm107.macro_investigator
  - vm107.research_summarisation_agent
  - vm107.research_citation_agent
  - vm107.research_contrarian_agent
  - vm107.research_discovery_agent
  # E-HIGH4 (P5 137-05): classification was the only research sibling missing this
  # grant; add the advertising surface to pair with its allowed_tools grant.
  - vm107.research_classification_agent
  # Phase 137-07 SC-3: reciprocal-advertisement of the 12 domain analysts that already
  # grant search_macro_research in their allowed_tools (Pitfall 2). Additive only.
  - vm107.commodities_domain_analyst
  - vm107.consumer_domain_analyst
  - vm107.credit_domain_analyst
  - vm107.external_sector_domain_analyst
  - vm107.financial_conditions_domain_analyst
  - vm107.fiscal_domain_analyst
  - vm107.growth_domain_analyst
  - vm107.housing_domain_analyst
  - vm107.inflation_domain_analyst
  - vm107.labour_domain_analyst
  - vm107.manufacturing_domain_analyst
  - vm107.monetary_policy_domain_analyst
last_changed: "2026-06-26"

# Phase 47.6 LD-3 capability registry fields (Stage 2 schema required)
impact_on_decision: HIGH
deprecated: false

# Phase 70.5 envelope-provenance fields (required by Plan-5 sweep)
typical_confidence: 0.80
expected_freshness_seconds: 3600   # RSS poll cadence is the freshness floor
is_deterministic: false             # LLM-mediated retrieval + Qdrant ANN

# Env vars referenced by tool implementation
env_vars:
  - name: VM101_RESEARCH_SEARCH_URL
    purpose: "Full URL of VM101 POST /api/v1/research/search"
    required: true
    fallback_allowed: false

# Capability owner
owner: engineering
