id: get_behavioral_drift_summary_tool
type: tool
status: real
shipped: 62
last_changed: 2026-05-16
name: get_behavioral_drift_summary
description: 'Returns BEHAVIORAL-tagged DriftReport rows for a frozen cohort snapshot.
  Calls VM100 GET /api/journal/internal/adaptive/drift-report/{cohort_snapshot_id}
  and filters returned rows to signal_category=BEHAVIORAL. NEVER recomputes live —
  reads frozen Postgres rows only (CTX-DEC-16).

  CTX-DEC-14 defense-in-depth: returns [] immediately if BEHAVIORAL is NOT in the
  caller''s adaptive_signal_categories frozenset.

  Phase 62.2 note: In Phase 62.2 (Behavioral Evolution Layer), dedicated behavioral
  metric series rows will be produced. For Phase 62.1, this tool filters the unified
  drift_report endpoint by signal_category=BEHAVIORAL.

  truth_mode=ADAPTIVE_OBSERVATION on all returned rows (CTX-DEC-17). SHADOW_ONLY framing
  — never surfaced in apply UI (CTX-DEC-15). Phase 39 typed-API lock: never direct
  DB access from VM107.

  '
capability_type: adaptive_behavioral_drift_lookup
signal_category: BEHAVIORAL
vm100_endpoint_path: /api/journal/internal/adaptive/drift-report/{cohort_snapshot_id}
http_method: GET
parameters:
- name: cohort_snapshot_id
  type: str (UUID)
  required: true
  description: UUID string of the frozen CohortSnapshot
- name: adaptive_signal_categories
  type: frozenset
  required: true
  description: 'Frozenset of AdaptiveSignalCategory values resolved from ScopeContext.
    If BEHAVIORAL not present, returns [] without calling VM100.

    '
return_type: list[dict]
return_on_error: []
error_modes:
- code: vm100_unavailable
  http_status: null
  description: Transport error — returns []
- code: vm100_404
  http_status: 404
  description: No DriftReport computed yet — returns []
- code: vm100_http_error
  http_status: 4xx/5xx
  description: HTTP status error — returns []
- code: scope_pruned
  http_status: null
  description: BEHAVIORAL not in adaptive_signal_categories — returns []
- code: no_behavioral_rows
  http_status: null
  description: DriftReport exists but contains no BEHAVIORAL rows — returns []
contracts:
  response: list[fingpt_core.contracts.adaptive.drift_report.DriftReportRow]
  error: []
capabilities:
- adaptive_behavioral_drift_read
related_capabilities:
- drift_winrate_calibration
- get_drift_report_tool
- get_counterfactual_scenario_stats_tool
