description: 'V1 deterministic vectorless similarity analysis for a given Execution.
  Calls VM100 /api/journal/internal/snapshots/by-features to retrieve historical snapshot
  candidates (last 90 days, same instrument or strategy), then ranks by weighted feature
  comparison in pure Python. Features: setup type, regime classification, liquidity
  context, ATR regime, session, outcome quality, execution quality bucket, behavioral
  markers. Returns top-N similar trades (default N=10, max N=50) with similarity scores
  and matched feature lists.

  V1 is intentionally vectorless: NO Qdrant, NO embeddings. Phase 60+ may add embedding-assisted
  reranking when behavioral cognition workflows justify it.

  '
category: analytics
