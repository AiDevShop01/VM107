id: vm107.reflection_prompt
type: tool
status: real
shipped: 67
last_changed: "2026-05-25"
name: vm107.reflection_prompt
description: >-
  CLOSE-state reflection prompt emitter — 5-stage progressive enrichment
  pipeline assembling 4 reflection prompts per session via deterministic
  candidate scoring, multi-domain evidence convergence eligibility,
  score-then-diversify hybrid selection, and coherence pass over the
  4-prompt SET. LLM enrichment is additive-only (NEVER replaces the
  deterministic prompt) and gated by the shared NoveltyEngine (Phase 66
  lock). Both selected AND rejected candidates are persisted; rejected
  rows feed Phase 62 tuning. evidence_chain[] uses structured
  {kind, ref, weight} items per RESEARCH recommendation.
capability_type: reflection_prompt_emitter
vm: vm107
vm107_endpoint_path: /api/v1/emitters/reflection_prompts
http_method: GET
parameters:
  - name: account_id
    type: integer
    required: true
    description: Account ID for which to assemble the reflection prompt set.
  - name: session_date
    type: string
    required: true
    description: Session date (YYYY-MM-DD); pipeline scopes to UTC midnight bounds.
return_type: dict
return_shape: ReflectionPromptSetContract
return_on_error: empty_envelope
error_modes:
  - code: empty_envelope
    http_status: 200
    description: >-
      Upstream evidence unavailable (no trades OR no support layers) —
      returns ReflectionPromptSetContract with empty selected_prompts +
      empty rejected_candidates + coherence_score=0.0. Never 4xx/5xx for
      missing-data state.
tier_behavior:
  full: All 4 stages report healthy → 4 prompts selected with LLM enrichment when novelty crosses
  partial: One assembler upstream degraded → reduced prompt count (≤4) + rejected_candidates still recorded
  degraded: No observations OR no support layers → empty set, eligibility filter blocks output
contracts:
  response_contract: VM107.emitters.contracts.reflection_prompt.ReflectionPromptSetContract
consumed_by:
  - vm100.mission_control.clients.vm107_reflection_prompt_client
  - vm100.mission_control.close_journal_prompts
  - vm100.mcp.mission_control.close.journal_prompts
dependencies:
  novelty_engine:
    type: shared_service
    id: vm107.services.novelty_engine
  vm100_trade_outcomes:
