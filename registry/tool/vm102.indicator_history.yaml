id: vm102.indicator_history
type: tool
status: real
shipped: 85
last_changed: "2026-06-13"
name: vm102.indicator_history
description: >
  Phase 85 — Historical FRED indicator series with recession/rate-hike/QE regime
  overlays. Returns a time-series of actual release values + optional overlay bands
  (recession shading, Fed hike/cut periods, QE window). Used by the HistoricalChart
  component on /macro/indicator/[id] and by vm107.macro_release_analyst to compute
  surprise context relative to recent history.
capability_type: read_facade
vm: vm102
methods:
  - name: get_history
    http_path: /api/v2/indicator/{id}/history
    http_method: GET
    parameters:
      - { name: id, type: string, required: true, description: "FRED indicator code, e.g. CPIAUCSL" }
      - { name: range, type: string, required: false, default: "5Y", description: "Time range: 1Y, 2Y, 5Y, 10Y, MAX" }
      - { name: overlays, type: string, required: false, default: "recession,rate_hike,qe", description: "Comma-separated overlay types" }
    return_shape: "HistoryResponse"
location:
  source: VM107/tools/proxies/vm102_indicator_history.py
  endpoint: VM102/api/v2/indicator/{id}/history
  contracts:
    request: "params(id, range, overlays)"
    response: "HistoryResponse"
contracts:
  response_contract: VM102.backend.contracts.indicator.HistoryResponse
consumed_by:
  - vm107.macro_release_analyst
related_capabilities:
  - vm102.indicator_releases
  - vm102.indicator_regime
  - vm102.indicator_distribution
hard_scoped: false
impact_on_decision: HIGH
# P5 137-04 (E-CRIT1/D-02): explicit grant to the profiles that already list this tool in
# their allowed_tools (both surfaces now agree) — so it does not go dark under the 137-06
# empty-aap deny flip. Dotted agent_profile ids resolve correctly (proven live in 137-02/03);
# the earlier "base-id 'vm107' not standalone" caveat no longer blocks dotted-id grants.
allowed_agent_profiles:
  - vm107.macro_investigator
  - vm107.macro_asset_exposure_analyst
  - vm107.macro_release_analyst
deprecated: false
tags:
  - phase-85
  - macro
  - indicator
  - history
  - fred
  - vm102
  - read-facade

# --- Phase 70.5 envelope-provenance fields ---
typical_confidence: 0.95   # Reasoning: deterministic DB read of historical FRED data; high fidelity to source
expected_freshness_seconds: 3600   # Reasoning: FRED indicator history updated at most every release cycle (hours to days); 1h cache is safe
is_deterministic: true   # Reasoning: same (id, range) at a given DB snapshot always returns same series
version: "1.0.0"   # Reasoning: Phase 85 initial release
