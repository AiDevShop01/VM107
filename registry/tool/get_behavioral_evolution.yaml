id: get_behavioral_evolution_tool
type: tool
status: shipped
shipped: 62
last_changed: 2026-05-16

name: get_behavioral_evolution
description: >
  Returns persisted BehavioralEvolutionSeries rows for an account + frozen cohort snapshot.
  Calls VM100 GET /api/journal/internal/adaptive/behavioral-evolution/{account_id}/{cohort_snapshot_id}.
  NEVER recomputes live — reads frozen Postgres rows only (CTX-DEC-16).

  CTX-DEC-14 defense-in-depth: returns [] immediately if BEHAVIORAL is NOT in
  the caller's adaptive_signal_categories frozenset. The MentorPipelineOrchestrator
  ALSO prunes tools BEFORE planning — this is additional per-tool enforcement.

  Returns empty list [] on 404 (no BehavioralEvolutionSeries computed yet — normal
  before the first weekly run or before N≥100 cohort accumulation). Returns [] on
  transport error (graceful degradation).

  truth_mode=ADAPTIVE_OBSERVATION on all returned rows (CTX-DEC-17).
  SHADOW_ONLY framing — never surfaced in apply UI (CTX-DEC-15).
  Phase 39 typed-API lock: Dagster and VM107 call VM100 APIs; never direct DB access.

  CTX-DEC-12: 4 LOCKED behavioral metric families only — returned rows have
  metric_family in {HESITATION, PREMATURE_EXIT, EMOTIONAL_REACTIVITY, RULE_DEVIATION}.
  NO psychological labels in returned field names.

capability_type: adaptive_behavioral_evolution_lookup

signal_category: BEHAVIORAL
vm100_endpoint_path: /api/journal/internal/adaptive/behavioral-evolution/{account_id}/{cohort_snapshot_id}
http_method: GET
parameters:
  - name: account_id
    type: str (UUID)
    required: true
    description: UUID string of the trader account
  - name: cohort_snapshot_id
    type: str (UUID)
    required: true
    description: UUID string of the frozen CohortSnapshot
  - name: adaptive_signal_categories
    type: frozenset
    required: true
    description: >
      Frozenset of AdaptiveSignalCategory values resolved from ScopeContext.
      If BEHAVIORAL not present, returns [] without calling VM100.

return_type: list[dict]  # BehavioralEvolutionSeries-shaped dicts
return_on_error: []  # empty list — never raises (graceful degradation)
error_modes:
  - code: vm100_unavailable
    http_status: null
    description: Transport error (ConnectError, TimeoutException) — returns []
  - code: vm100_404
    http_status: 404
    description: No BehavioralEvolutionSeries computed yet — returns []
  - code: vm100_http_error
    http_status: 4xx/5xx
    description: HTTP status error — returns []
  - code: scope_pruned
    http_status: null
    description: BEHAVIORAL not in adaptive_signal_categories — returns [] without HTTP call

contracts:
  response: list[fingpt_core.contracts.adaptive.behavioral_evolution.BehavioralEvolutionSeries]
  error: []  # empty list on all failure modes

capabilities:
  - adaptive_behavioral_evolution_read

related_capabilities:
  - behavioral_hesitation_evolution
  - behavioral_premature_exit_evolution
  - behavioral_emotional_reactivity_evolution
  - behavioral_rule_deviation_evolution
  - get_drift_report_tool
  - get_behavioral_drift_summary_tool

