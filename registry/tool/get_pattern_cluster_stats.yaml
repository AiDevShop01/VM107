id: get_pattern_cluster_stats_tool
type: tool
status: shipped
shipped: 62
last_changed: 2026-05-16

name: get_pattern_cluster_stats
description: >
  Returns aggregate statistics for a specific cluster from a PatternClusterSnapshot.
  Calls VM100 GET /api/journal/internal/adaptive/pattern-cluster/{cluster_snapshot_id}.
  NEVER recomputes live — reads frozen Postgres rows only (CTX-DEC-16).

  CTX-DEC-14 defense-in-depth: returns [] immediately if PATTERN is NOT in
  the caller's adaptive_signal_categories frozenset.

  Returns empty list [] on 404 or transport error (graceful degradation).

  truth_mode=ADAPTIVE_OBSERVATION on returned rows (CTX-DEC-17).
  SHADOW_ONLY framing (CTX-DEC-15).
  Phase 39 typed-API lock.

  CTX-DEC-13: cluster stats reflect structured vector clustering only.
  Cluster labels are deterministic centroid-hash descriptors (Pitfall 7).

capability_type: adaptive_pattern_cluster_stats_lookup

signal_category: PATTERN
vm100_endpoint_path: /api/journal/internal/adaptive/pattern-cluster/{cluster_snapshot_id}
http_method: GET
parameters:
  - name: cluster_snapshot_id
    type: str (UUID)
    required: true
    description: UUID string of the PatternClusterSnapshot to retrieve
  - name: adaptive_signal_categories
    type: frozenset
    required: true
    description: >
      Frozenset of AdaptiveSignalCategory values resolved from ScopeContext.
      If PATTERN not present, returns [] without calling VM100.

return_type: dict | None  # PatternClusterSnapshot fields or None on error
return_on_error: None
error_modes:
  - code: vm100_unavailable
    http_status: null
    description: Transport error — returns None
  - code: vm100_404
    http_status: 404
    description: Cluster snapshot not found — returns None
  - code: scope_pruned
    http_status: null
    description: PATTERN not in adaptive_signal_categories — returns None

capabilities:
  - adaptive_pattern_cluster_stats_read

related_capabilities:
  - pattern_cluster_signal
  - get_pattern_cluster_membership_tool
  - get_behavioral_evolution_tool

