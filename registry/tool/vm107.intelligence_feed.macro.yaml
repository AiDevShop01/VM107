# --- Phase 70.5 envelope-provenance fields ---
typical_confidence: 0.75   # Reasoning: LLM enrichment (non-deterministic) adds uncertainty vs pure ingestion; deterministic base always produced
expected_freshness_seconds: 60   # Reasoning: OPEN cadence emitter; 60s covers one emit cycle
is_deterministic: false   # Reasoning: LLM enrichment when novelty threshold crossed introduces non-determinism; deterministic fallback available
version: "2.0.0"   # Reasoning: major bump — pull model (Phase 65 demo) to push model (Phase 83 emitter); Phase 83 ships fully real composer+emitter
