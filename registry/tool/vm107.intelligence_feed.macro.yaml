id: vm107.intelligence_feed.macro
type: tool
status: real
shipped: "83"
last_changed: "2026-06-04"
name: vm107.intelligence_feed.macro
description: >-
  VM107 MACRO intelligence feed composer + emitter. Aggregates macro-context items
  for the Mission Control intelligence feed. Phase 83 ships the fully real
  composer + emitter wired to the LLM model-router (Phase 43 Agent Hands),
  NoveltyEngine V1 (Plan 08), and snapshot-persistent storage (MacroEmitterSnapshot
  Postgres model + Redis hot-path). Phase 65 shipped the [DEMO] placeholder;
  Phase 83 rewrites it — version bumped to 2.0.0 (major: pull model to push model).

  Architecture (Phase 83):
  - intelligence_feed_macro_composer.py: HTTP-client-based (closes RISK-06),
    LLM-router-wired enrichment, NoveltyEngine V1 gating (Decision E1 deterministic scorer).
  - macro_emitter.py: Push model on OPEN cadence (60s), writes MacroEmitterSnapshot
    to Postgres + Redis cache (macro_emitter:latest:{state}).
  - vm107-macro-emitter sibling Docker service (Plan 10 compose entry).
  - Snapshot-persistent: survives emitter restart via Postgres fallback (Plan 11 aggregator).

  Sources: economic calendar events (EconomicEvent → vm100 calendar endpoint),
  active news catalysts, regime summary across watched instruments, session timing.
  Each item is an IntelligenceFeedItem with category=macro. NoveltyEngine gates
  LLM narrative enrichment per item — duplicate macro items are suppressed.
  Returns ordered list by relevance_score DESC. Maximum 10 items per call.
  Separate from DISCOVERIES composer (MACRO = forward-looking; DISCOVERIES = backward).

  Phase 83 Decisions: D1 (HTTP client), F1 (ModelRouter), G1 (push/emitter),
  G2 (snapshot persistence), H1 (last-known-good degradation), H2 (kill-switch demo).
capability_type: intelligence_feed_macro_composer
vm: vm107
vm107_endpoint_path: /api/v1/intelligence_feed/macro
http_method: GET
parameters:
- name: state
  type: string
  required: true
  description: >-
    Trading state — one of: pre / open / active_supervision / mid / close / review.
    State gates which categories are surfaced (e.g. CLOSE state suppresses
    forward-looking OPEN items).
- name: account
  type: integer
  required: false
  description: >-
    Account ID — if provided, filters to instruments on the account watchlist.
    If omitted, returns global macro context.
return_type: list
return_shape: "list[IntelligenceFeedItem] (category='macro')"
return_on_error: empty_list
error_modes:
- code: empty_list
  http_status: 200
  description: >-
    No macro items available — returns empty list. Never 4xx/5xx for empty
    feed state.
- code: last_known_good
  http_status: 200
  description: >-
    Composer failure (H1 degradation path) — returns last-known-good snapshot
    from Redis or Postgres. _demo=False, degraded=True in the envelope.
- code: demo_fallback
  http_status: 200
  description: >-
    H2 kill-switch only: _demo=True when payload.source == 'vm107.macro_emitter.demo_fallback'.
    Indicates admin manually activated the kill-switch. All other degradation paths
    return _demo=False (Pitfall 12 compliance).
max_items: 10
item_ordering: relevance_score DESC
item_category: macro
location:
  source: VM107/emitters/intelligence_feed_macro_composer.py + VM107/emitters/macro_emitter.py
  endpoint: VM107/api/v1/intelligence_feed/macro
  contracts:
    request: params(state)
    response: list[IntelligenceFeedItem] (category=macro)
contracts:
  response_contract: VM107.contracts.intelligence_feed.IntelligenceFeedItem
consumed_by:
- vm100.ws.mission_control
- vm100.mission_control.intelligence_feed_composer
- vm100.aggregator.macro_panel
dependencies:
  - vm100.analytics_calendar
related_capabilities:
- vm107.intelligence_feed.discoveries
- vm107.narratives.global
- vm102.regime_current
- vm100.analytics_calendar
- vm101.fred_calendar
- vm107.novelty_engine
forward_compat:
  macro_alert: >-
    candidate plan 66-24 — push MACRO_EVENT interrupt to narrative emitter
    when high-impact item crosses 30m threshold
  macro_history: >-
    candidate plan 66-25 — macro feed history for timeline review
