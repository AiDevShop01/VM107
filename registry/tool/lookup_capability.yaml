id: lookup_capability
type: tool
status: real
shipped: 47.6
last_changed: 2026-05-17

short_description: Meta-tool — capability registry navigation
long_description: |
  Returns a typed CapabilitySummary for a known id, or a filtered list across
  the registry. Read-only, soft-scoped on all profiles. NO semantic search.
  Use list() only for explicit cognitive moves (user asks "what can you do?",
  planner enumerating a category). Use lookup(id) when uncertain about a known
  capability. Stub/experimental capabilities are discoverable but NOT invokable
  per Phase 47.6 LD-6c.

location:
  source: VM107/tools/lookup_capability.py
  contracts:
    request: fingpt_core.contracts.capability_registry.summary.CapabilitySummary
    response: fingpt_core.contracts.capability_registry.summary.CapabilitySummary

api_structure: |
  lookup(id: str, discovery_reason: str=None) -> LookupResult
  list(*, type=None, status=None, tags=None, allowed_profile=None,
       impact=None, discovery_reason=None) -> ListResult

