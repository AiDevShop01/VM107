id: vm107.morning_brief
type: tool
status: real
shipped: 67
last_changed: "2026-05-25"
name: vm107.morning_brief
description: 'Pre-market AI briefing assembled from market + macro + behavioral context.
  Deterministic base summary (headline + body + top_catalysts + risk_alerts) ALWAYS
  produced; LLM enrichment additive only when novelty engine threshold is crossed.
  Mirrors Phase 66 global_narrative_emitter pattern verbatim (5-step pipeline:
  health-clear → context assembly → tier classification → deterministic base →
  novelty score → optional LLM → typed contract). Shared NoveltyEngine + shared
  SourceHealthRegistry instances enforce cross-emitter coherence. Confidence tier
  degrades FULL/PARTIAL/DEGRADED as upstream sources go missing; _demo flips True
  on DEGRADED.'
capability_type: morning_brief_emitter
vm: vm107
vm107_endpoint_path: /api/v1/emitters/morning_brief
http_method: GET
parameters:
- name: account_id
  type: integer
  required: true
  description: 'Account ID for which to assemble the morning brief context.'
return_type: dict
return_shape: MorningBriefContract
return_on_error: demo_envelope
error_modes:
- code: demo_envelope
  http_status: 200
  description: 'Upstream context sources unavailable — returns deterministic base
    with _demo=true + confidence_tier=DEGRADED + missing_sources populated. Never
    4xx/5xx for degraded state.'
tier_behavior:
  full: all sources healthy → confidence_score 0.95 + LLM enrichment when novelty crosses
  partial: 1 source missing → confidence_score 0.65 + reduced LLM budget
  degraded: 2+ sources missing → deterministic base only, _demo=true
location:
  source: VM107/tools/proxies/vm107_morning_brief.py
  endpoint: VM107/api/v1/emitters/morning_brief
  contracts:
    request: params(account_id)
    response: MorningBriefContract (headline, body, top_catalysts, risk_alerts, confidence_tier)
contracts:
  response_contract: VM107.emitters.contracts.morning_brief.MorningBriefContract
consumed_by:
- vm100.mission_control.clients.vm107_morning_brief_client
- vm100.ws.mission_control
- vm100.mission_control.pre_state_briefing
