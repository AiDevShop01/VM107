id: vm107.intelligence_feed.discoveries
type: tool
status: real
shipped: 66
last_changed: "2026-05-23"
name: vm107.intelligence_feed.discoveries
description: 'VM107 DISCOVERIES intelligence feed composer. Surfaces behavioral and
  pattern discoveries from the trader''s recent trade history for the Mission Control
  intelligence feed. Sources: cross-trade behavioral patterns (Phase 54), behavioral
  edges for execution (Phase 54 extension), Phase 60 replay narratives when available.
  Each item is an IntelligenceFeedItem with category=discoveries. Novelty engine
  strictly gates LLM enrichment — DISCOVERIES items are only shown when they represent
  genuinely new insight not surfaced in recent sessions. Scope: last N=10 trades +
  current open positions (NOT session-bounded). Separate from MACRO composer by
  design — DISCOVERIES are backward-looking (what was found) vs MACRO which is
  forward-looking (what is coming).'
capability_type: intelligence_feed_discoveries_composer
vm: vm107
vm107_endpoint_path: /api/v1/intelligence_feed/discoveries
http_method: GET
parameters:
- name: state
  type: string
  required: true
  description: 'Trading state — one of: pre / open / active_supervision / mid / close
    / review. State gates surfacing priority (e.g. ACTIVE_SUPERVISION surfaces edge
    warnings at higher priority).'
- name: account
  type: integer
  required: true
  description: 'Account ID — required for discoveries (behavioral data is account-scoped).'
return_type: list
return_shape: 'list[IntelligenceFeedItem] (category=''discoveries'')'
return_on_error: empty_list
error_modes:
- code: empty_list
  http_status: 200
  description: 'No discovery items — returns empty list. This is the normal state for
    new accounts or clean recent history. Never 4xx/5xx.'
max_items: 10
item_ordering: relevance_score DESC
item_category: discoveries
novelty_gate: strict
trade_scope: 'last N=10 trades + current open positions (NOT session-bounded)'
contracts:
  response_contract: VM107.contracts.intelligence_feed.IntelligenceFeedItem
consumed_by:
- vm100.ws.mission_control
- vm100.mission_control.intelligence_feed_composer
dependencies:
  novelty_engine:
    type: shared_service
    id: vm107.services.novelty_engine
  cross_trade_patterns_service:
    type: phase_capability
    id: phase_54.cross_trade_patterns
  behavioral_edges_for_execution:
    type: tool
    id: vm100.behavioral_edges.for_execution
  phase_60_narratives:
    type: phase_capability
    id: phase_60.replay_narratives
related_capabilities:
- vm107.intelligence_feed.macro
- vm107.narratives.global
- vm100.behavioral_edges.for_execution
forward_compat:
  discovery_alert: 'candidate plan 66-26 — push DISCOVERIES interrupt when high-severity
    behavioral edge detected mid-session'
  discovery_history: 'candidate plan 66-27 — discoveries feed history for periodic
    review'
phase: 66
tags:
- phase-66
- mission-control
- intelligence-feed
- discoveries
- composer
- novelty-strict
- backward-looking
hard_scoped: true
impact_on_decision: HIGH
allowed_agent_profiles:
- agent_zero
deprecated: false
