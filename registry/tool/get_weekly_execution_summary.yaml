id: get_weekly_execution_summary
type: tool
category: reader
version: 1.0.0
introduced_phase: 60-11b
description: 'Batch-read all Execution rows + analytics_snapshot for a canonical week
  window (week_start, week_end, timezone) from VM100 Postgres. Returns a structured
  dict of executions with instrument, timestamps, result_r, and snapshot_id for each
  closed execution in the week. Scoped to a single account; X-Agent-Scope enforced
  by VM100 endpoint (Pitfall 8 LOCKED). week_start/week_end are canonical anchored
  dates — NOT relative offsets — enabling replay reproducibility (CONTEXT.md §10 LOCKED).

  '
endpoint_pattern: GET {VM100_INTERNAL_BASE_URL}/api/journal/internal/executions/week-summary
http_method: GET
retry_profile: FAST_FAIL
hard_scoped: true
scope_enforcement: account_id_equality_check
allowed_agent_profiles:
- weekly_review_agent._analyzer
- weekly_review_agent._reader
denied_agent_profiles:
- weekly_review_agent._writer
- trade_auditor_agent._analyzer
- trade_auditor_agent._reader
- behavioral_mentor_agent._analyzer
- behavioral_mentor_agent._reader
request_fields:
  account_id:
    type: str
    required: true
    description: Account to query — must match scope.account_id
  week_start:
    type: date
    required: true
    description: Start of the canonical week window — anchored date, NOT timedelta
  week_end:
    type: date
    required: true
    description: End of the canonical week window — anchored date, NOT timedelta
  timezone:
    type: str
    required: false
    default: UTC
    description: IANA timezone string (e.g. 'UTC', 'America/New_York')
  scope_context:
    type: ScopeContext
    required: true
    description: ScopeContext injected by MentorPipelineOrchestrator — never self-supplied
response_fields:
  account_id:
    type: str
  week_start:
    type: date
  week_end:
    type: date
  executions:
    type: list[WeeklyExecutionItem]
    item_fields:
      execution_id: str
      instrument: str
      opened_at: str | None
      closed_at: str | None
      result_r: float | None
      snapshot_id: str | None
data_sources:
- Postgres journal.execution table (Phase 55)
- Postgres journal.trade_analytics_snapshot table (Phase 57)
- Postgres journal.trade_outcomes table (for result_r)
phase_lock:
- 'Phase 39: VM107 never queries Postgres directly — VM100 endpoint is the boundary'
- 'CONTEXT.md §10: week_start/week_end are canonical anchored dates, not relative
  offsets'
- 'Directive #4: VM100_INTERNAL_BASE_URL read in __init__, never at module scope'
- 'Pitfall 8: scope enforcement happens at VM100 endpoint BEFORE any DB access'
status: real
impact_on_decision: HIGH
deprecated: false
tags: []

# --- Phase 70.5 envelope-provenance fields ---
typical_confidence: 0.85   # Reasoning: deterministic DB aggregation over closed trades for a calendar week; no LLM path
expected_freshness_seconds: 300   # Reasoning: weekly summary data changes only on new trade closes; 300s is conservative for periodic summary
is_deterministic: true   # Reasoning: same account + week always yields identical aggregate; pure SQL aggregation
version: "1.0.0"   # Reasoning: preserve existing; initial release
