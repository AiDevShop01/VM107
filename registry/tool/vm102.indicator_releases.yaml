id: vm102.indicator_releases
type: tool
status: real
shipped: 85
last_changed: "2026-06-13"
name: vm102.indicator_releases
description: >
  Phase 85 — Latest release records for a FRED indicator: actual, forecast,
  previous, and surprise (actual - forecast). Returns the most recent N releases
  ordered by release_date DESC. Used by vm107.macro_release_analyst as the primary
  data source for release event analysis (What Happened narrative). Also powers the
  HeroCard release value display on /macro/indicator/[id].
capability_type: read_facade
vm: vm102
methods:
  - name: get_releases
    http_path: /api/v2/indicator/{id}/releases
    http_method: GET
    parameters:
      - { name: id, type: string, required: true, description: "FRED indicator code, e.g. CPIAUCSL" }
      - { name: limit, type: int, required: false, default: 12, description: "Number of recent releases to return (max 60)" }
    return_shape: "ReleasesResponse"
location:
  source: VM107/tools/proxies/vm102_indicator_releases.py
  endpoint: VM102/api/v2/indicator/{id}/releases
  contracts:
    request: "params(id, limit)"
    response: "ReleasesResponse"
contracts:
  response_contract: VM102.backend.contracts.indicator.ReleasesResponse
consumed_by:
  - vm107.macro_release_analyst
related_capabilities:
  - vm102.indicator_history
  - vm102.indicator_distribution
hard_scoped: false
impact_on_decision: HIGH
# P5 137-04 (E-CRIT1/D-02): explicit grant to the profile that already lists this tool in
# its allowed_tools (both surfaces agree) — survives the 137-06 empty-aap deny flip.
# NOTE: the only allowed_tools lister of this releases tool is vm107.macro_release_analyst
# (release/forecast analyst) — single-owner, not broadcast.
allowed_agent_profiles:
  - vm107.macro_release_analyst
deprecated: false
tags:
  - phase-85
  - macro
  - indicator
  - releases
  - fred
  - vm102
  - read-facade

# --- Phase 70.5 envelope-provenance fields ---
typical_confidence: 0.98   # Reasoning: direct Postgres read of structured release data ingested from FRED; near-authoritative
expected_freshness_seconds: 60   # Reasoning: release data is written immediately on ingest; 60s covers ingestion pipeline lag
is_deterministic: true   # Reasoning: same (id, limit) returns same rows at a given DB state
version: "1.0.0"   # Reasoning: Phase 85 initial release
