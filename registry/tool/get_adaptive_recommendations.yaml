id: get_adaptive_recommendations_tool
type: tool
status: shipped
shipped: 62
last_changed: 2026-05-16

name: get_adaptive_recommendations
description: >
  Returns AdaptiveRecommendation rows for a given cohort_snapshot_id from VM100.
  Calls VM100 GET /api/journal/internal/adaptive/recommendations/{cohort_snapshot_id}.
  NEVER recomputes live — reads frozen Postgres rows only (CTX-DEC-16).

  CTX-DEC-14 defense-in-depth: returns [] immediately if ADAPTIVE_RECOMMENDATION is
  NOT in the caller's adaptive_signal_categories frozenset. The MentorPipelineOrchestrator
  ALSO prunes tools BEFORE planning — this is additional per-tool enforcement.

  RG-11 + CTX-DEC-15: Enforces SHADOW_ONLY envelope at tool layer.
  Raises ToolError if VM100 response is missing _shadow_only=True or has it as False.
  This is load-bearing defense-in-depth — VM100 MUST assert the flag in every response.

  Returns empty list [] on 404 (cohort has no recommendations yet — normal before
  the first weekly run or before N>=75 significance threshold is met).
  Returns [] on transport error (graceful degradation).

  truth_mode=ADAPTIVE_OBSERVATION on returned rows (CTX-DEC-17).
  SHADOW_ONLY framing — never surfaced in apply UI (CTX-DEC-15).
  Phase 39 typed-API lock: VM107 calls VM100 APIs; never direct DB access.

  CTX-DEC-5: Returned rows reflect recommended_* tier only. applied_* fields are
  always null (enforced by DB CHECK and service layer) — schema-only in V1.

capability_type: adaptive_recommendation_lookup

signal_category: ADAPTIVE_RECOMMENDATION
vm100_endpoint_path: /api/journal/internal/adaptive/recommendations/{cohort_snapshot_id}
http_method: GET
parameters:
  - name: cohort_snapshot_id
    type: str (UUID)
    required: true
    description: UUID string of the cohort snapshot to retrieve recommendations for
  - name: adaptive_signal_categories
    type: frozenset
    required: true
    description: >
      Frozenset of AdaptiveSignalCategory values resolved from ScopeContext.
      If ADAPTIVE_RECOMMENDATION not present, returns [] without calling VM100.

return_type: list[dict]  # {recommendation_id, recommended_threshold, recommended_by_model, ...}
return_on_error: []  # empty list — never raises (except ToolError for missing envelope flag)
error_modes:
  - code: shadow_only_missing
    http_status: 200
    description: VM100 response missing _shadow_only=True — raises ToolError (RG-11)
  - code: vm100_unavailable
    http_status: null
    description: Transport error — returns []
  - code: vm100_404
    http_status: 404
    description: No recommendations for this cohort snapshot yet — returns []
  - code: scope_pruned
    http_status: null
    description: ADAPTIVE_RECOMMENDATION not in adaptive_signal_categories — returns [] without HTTP call
  - code: env_missing
    http_status: null
    description: VM100_INTERNAL_BASE_URL not set — raises KeyError (env-driven fail-fast)

capabilities:
  - adaptive_recommendation_read

related_capabilities:
  - adaptive_recommendation_signal
  - get_regime_adaptation_candidates_tool
  - get_drift_report_tool
  - get_behavioral_evolution_tool
  - get_pattern_cluster_stats_tool

