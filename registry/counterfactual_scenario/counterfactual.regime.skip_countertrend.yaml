  or SHORT-vs-UP conflict; SIDEWAYS does not fire the gate. Trend computed STRICTLY
  from pre-entry bars (Phase 61 Law #3 enforced). Non-participation artifacts have
  divergence_type=PRE_ENTRY and hypothetical_r=0.

  Law #6 phrasing discipline: APPROVED: "Under counterfactual regime gate [ref:counterfactual:counterfactual.regime.skip_countertrend:policy_outcome_class],
