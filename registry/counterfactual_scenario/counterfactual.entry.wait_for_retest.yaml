id: counterfactual.entry.wait_for_retest
type: counterfactual_scenario
status: shipped
shipped: 61
scenario_tier: canonical
mentor_visible: true
weekly_review_eligible: true
policy_contract_class: fingpt_pipelines.counterfactual.policies.entry_wait_for_retest.EntryWaitForRetestPolicy
uses_future_information: false
scenario_version: "1.0.0"
parameters:
  retest_tolerance_atr_fraction: 0.25  # tolerance = 0.25 * pre_entry_ATR; e.g. ~0.0010 for EURUSD M15
  atr_lookback: 14
  max_wait_bars: 20  # if retest doesn't occur within 20 bars, missed_window
description: >
  Waits for price to retest the entry zone (within tolerance) after an initial
  move-away from the canonical entry price. If the retest signal fires within
  max_wait_bars bars, the alt-entry triggers; R-unit geometry is preserved from
  the original pre-entry stop discipline. If the retest never fires within the
  window, policy_outcome_class='missed_window'; hypothetical_r=0.

  Phase 61 Law #3 enforced via BarsView: signal detection reads
  bars[original_entry_bar : current_T + 1] only at each evaluation frame T.
  Future bars never accessed.

  Law #6 phrasing discipline:
    APPROVED: "Under counterfactual alt-entry policy
    [ref:counterfactual:counterfactual.entry.wait_for_retest:policy_outcome_class],
    the alt-entry signal fired at replay frame T+3, where the trade would have
    entered at a different price and re-threaded SL/TP geometry."
    BANNED: "You should have waited for a retest."
    BANNED: "Patient entries would have improved your average R."

  Divergence type: PRE_ENTRY — alt-entry diverges before the canonical entry bar.
phase: 61
tags: [phase-61, entry, canonical, alt_entry, signal_driven, tier_4, retest]
hard_scoped: true
divergence_type: PRE_ENTRY
