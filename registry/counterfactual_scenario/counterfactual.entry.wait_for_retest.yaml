  \ policy_outcome_class='missed_window'; hypothetical_r=0.\nPhase 61 Law #3 enforced\
  \ via BarsView: signal detection reads bars[original_entry_bar : current_T + 1]\
  \ only at each evaluation frame T. Future bars never accessed.\nLaw #6 phrasing\
  \ discipline:\n  APPROVED: \"Under counterfactual alt-entry policy\n  [ref:counterfactual:counterfactual.entry.wait_for_retest:policy_outcome_class],\n\
  \  the alt-entry signal fired at replay frame T+3, where the trade would have\n\
  \  entered at a different price and re-threaded SL/TP geometry.\"\n  BANNED: \"\
  You should have waited for a retest.\"\n  BANNED: \"Patient entries would have improved\
  \ your average R.\"\n\nDivergence type: PRE_ENTRY — alt-entry diverges before the\
  \ canonical entry bar.\n"
