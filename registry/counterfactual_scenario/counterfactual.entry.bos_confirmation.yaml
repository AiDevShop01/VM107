description: "Waits for a break-of-structure (BOS) confirmation before alt-entering.\
  \ BOS is defined as the first bar whose close exceeds the pre-entry swing high (LONG)\
  \ or falls below the pre-entry swing low (SHORT), using swing_lookback bars before\
  \ the canonical entry for reference.\nIf the BOS signal fires within max_wait_bars,\
  \ the alt-entry triggers at the BOS confirmation bar; R-unit geometry is preserved.\
  \ If BOS never fires within the window, policy_outcome_class='missed_window'; hypothetical_r=0.\n\
  Phase 61 Law #3 enforced via BarsView: signal detection reads bars[original_entry_bar\
  \ - swing_lookback : current_T + 1] only. Future bars never accessed.\nLaw #6 phrasing\
  \ discipline:\n  APPROVED: \"Under counterfactual alt-entry policy\n  [ref:counterfactual:counterfactual.entry.bos_confirmation:divergence_frame_id],\n\
  \  the BOS confirmation signal fired at replay frame T+5, and the trade would\n\
  \  have entered at a different price frame.\"\n  BANNED: \"You should have waited\
  \ for BOS confirmation.\"\n  BANNED: \"Confirmed entries structurally outperform\
  \ impulsive entries.\"\n\nDivergence type: PRE_ENTRY — alt-entry diverges before\
  \ the canonical entry bar.\n"
