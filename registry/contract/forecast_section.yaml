description: |
  Phase 94 §K — ForecastSection envelope carrying consensus + dispersion
  + horizon for major indicators. Per ForecastEntry: indicator_id /
  horizon (e.g., 'Q4-2026', '12m') / consensus / dispersion (std-dev or
  IQR of forecaster spread) / n_forecasters / as_of timestamp.

  Driven by an external forecast feed (refreshed daily); surfaces an
  IntelligenceCard when stale > 30 days. Wired into the snapshot by
  vm100.macro_situation_aggregator (94-07).

