description: |
  Phase 95 §C — Domain section contract for one of the 12 canonical macro
  domains (Growth · Inflation · Labour · Housing · Credit · Monetary Policy ·
  Fiscal · External Sector · Manufacturing · Consumer · Financial Conditions ·
  Commodities).  Inherits the Phase 94 BaseSection envelope (snapshot_id,
  version, generated_at, status, provenance, …) and adds the typed Domain
  payload (identity / computed health metrics / narrative / relationships).

  Single source of truth for the canonical 12 lives in
  contracts/economic_intelligence/domain_catalog.yaml. Frontend route registry
  (Plan 13), backend domain_payload resolver (Plan 11), Capability Registry,
  and Neo4j schema seed (Plan 10) all read from that file — Pitfall 5 lock.

  Produced by the 12 vm107.<slug>_domain_analyst specialists (Plan 12) via the
  vm102.macro.domains.DomainEngine (Plan 11). Consumed by the VM100 macro
  situation API (Plan 11 wiring) and the frontend Domain card / Domain page
  (Plan 13).

inherits: base_section_contract
worm: false  # snapshot-time output, not append-only

# Fields per the Pydantic model (mirrored here for human-readable lookup).
fields:
  core:
    - domain_id
    - slug
    - title
    - summary
    - importance
    - primary_pillars
    - primary_analyst
  computed:
    - health_score
    - trend_score
    - breadth_score
    - headline
    - risk_level
    - current_state
  narrative:
    - drivers
    - constraints
    - tailwinds
    - headwinds
  relationships:
    - top_indicators
    - related_domains
    - related_themes
    - latest_releases

# Section envelope fields (inherited from BaseSection):
