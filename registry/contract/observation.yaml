id: observation_contract
type: contract
status: real
shipped: 74
planned_phase: null
last_changed: "2026-06-11"
# Stage 2 schema requires `impact_on_decision`. Observations are platform-
# wide telemetry primitives feeding the user's dashboards; classification
# MEDIUM (they inform decisions but rarely trigger one directly).
impact_on_decision: MEDIUM

name: Observation
description: |
  Platform-wide Observation primitive (Phase 74). Every telemetry alert,
  cost anomaly, behavioural signal, supervisory observation, and pipeline
  degradation is expressed as an Observation.
  Architecture: Observation → Routing → Channel → Presentation.
  Append-only (WORM) — escalation = new Observation with same correlation_id.
owner_vm: fingpt_core

contract_version: "1.0"
source_module: fingpt_core.contracts.observation.Observation

fields:
  - observation_id
  - category
  - severity
  - body
  - generated_at
  - source_vm
  - trigger_event_id
  - correlation_id
  - trading_impact
  - conversation_type
  - _demo

worm: true

tags:
  - phase-74
  - observation
  - cross-vm
  - worm
deprecated: false
