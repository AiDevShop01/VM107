description: |
  Phase 94 §F — PillarsSection envelope carrying exactly 4 Pillar objects
  (Growth / Inflation / Liquidity / RiskAppetite).  Each Pillar is a
  full State Vector {level (0-100), momentum (1m/3m/12m), breadth (0-1),
  confidence (0-1), state (6-state PillarState), contributors (indicator
  IDs), sparkline_90d, provenance}.

  Produced by the deterministic vm102.pillar_engine service; consumed by
  the 4 specialist analyst agents (94-05), the executive_summary
  synthesizer (94-06), the theme_monitor (94-05), and the VM100 backend
  aggregator (94-07).  READY status requires non-empty contributors on
  every Pillar (validated at model construction via
  PillarsSection._ready_requires_non_empty_contributors).

inherits: base_section_contract
