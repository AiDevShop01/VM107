description: >
  Emitted by the refinement_orchestrator at the START of each refinement
  iteration (iteration 0 included) — BEFORE Strategy / Code / Build /
  Backtest / Critic dispatch. Carries the loop_id, current iteration_number,
  root_hypothesis_id, and frozen registry_snapshot_hash so consumers can
  index into the per-iteration artifact set deterministically.
