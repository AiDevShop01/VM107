short_description: 'Lifecycle transition event emitted on every Idea state change
  (4-state machine).

  '
long_description: 'Idea state transitions emit one IDEA_STATE_TRANSITION Event row
  +

  schedule one idea_state_changed domain signal (post-commit only,

  via transaction.on_commit). Two emissions per transition is the

  CONTEXT decision #6 invariant — the Event row is the audit trail,

  the signal is the orchestration trigger.


  The Pydantic payload (IdeaStateTransitionEvent) constrains

  from_state / to_state to the 4-value IdeaState Literal. Pydantic

  rejects Campaign or Execution state values at validation —

  registry consumers can rely on the strict schema for replay,

  reasoning, and migration tooling.


  Phase 55 ships ONLY lifecycle-transition event types. Full event

  taxonomy (idea events, checklist events, market structure events,

  AI events, system events, etc.) is deferred to Phase 56 which

  builds the full event infrastructure on top of the slot Phase 55

  defines.


  Mandatory payload metadata on every transition: from_state,

  to_state, reason, actor, source. Gold for replay, AI reasoning,

  debugging, mentorship, behavioral analysis (CONTEXT decision #4).

  '
