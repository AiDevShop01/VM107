payload_fields:
  loop_id: UUID of the refinement loop (correlation_id)
  task_id: Async task id from the /pipeline/refine endpoint
  root_hypothesis_id: Immutable anchor hypothesis (Phase 48 § Decision 6)
  strategy_family: StrategyFamily enum value frozen at iter 0
  registry_snapshot_hash: Frozen CapabilityRegistry snapshot hash for the loop
