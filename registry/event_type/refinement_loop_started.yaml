description: >
  Emitted by the refinement_orchestrator at the VERY START of a bounded
  refinement loop — AFTER initial state freeze (loop_registry_snapshot_hash
  set), BEFORE iteration 0. First event in the lifecycle for the loop;
  pairing terminal events are loop_terminated, strategy_accepted, or
  strategy_rejected. Carries the loop_id, originating task_id, root
  Hypothesis id, strategy_family, and frozen registry snapshot hash.
