id: discovery_alert
type: event_type
status: real
shipped: 91
last_changed: "2026-06-25"
capability_type: event_type
phase: 91
schema_version: "1.0"

# Phase 91 Wave 3 — AI discovery alert routing surface (LD-91-8 separate
# pipeline).
#
# MEDIUM impact_on_decision — discovery alerts are informational/exploratory
# (LD-91-8: "These alerts cannot be threshold-driven" — the agent computes
# the anomaly; UAE just routes via subscription DSL). LD-91-8 always-emit-
# info pattern: every accepted EdgeProposal becomes an info-severity envelope
# so user subscriptions with custom thresholds (e.g. agent_confidence > 0.7)
# get a chance to match.

impact_on_decision: MEDIUM
hard_scoped: false
deprecated: false

name: discovery_alert
description: |
  Emitted by vm107.macro_relationship_discovery (and future Phase 92
  research-discovery agents) via alert_emit_hook on every accepted
  EdgeProposal. Wraps an alert_candidate_created envelope
  (alert_type='discovery') with b13_internal_severity='info' → 'Info'
  user-facing severity. Subject keys: subject_type='edge_proposal',
  subject_id = proposal_id. event_id =
  sha256(producer|discovery|proposal_id)[:16].
  Always-emit-info pattern per LD-91-8 — user subscriptions filter via
  condition_yaml DSL on payload fields (agent_confidence, source_*).

owner_vm: vm107
owner: engineering

payload_schema:
  envelope:
    event_type: "alert_candidate_created"
    alert_type: "discovery"
    severity: "Info"
    b13_internal_severity: "info"
  payload:
    discovery_text: str
    agent_confidence: float (0..1)
    source_indicators: list[str]
    source_assets: list[str]
    edge_proposal_id: str (UUID)

producers:
  - vm107.macro_relationship_discovery
  # Future Phase 92 research-discovery agents will be added here.
consumers:
  - phase91.universal_alert_engine

related_capabilities:
  - alert_candidate_created
  - correlation_break_alert
  - vm107.macro_relationship_discovery

tags:
  - event-type
  - macro
  - phase-91
  - wave-3
  - alert-candidate
  - discovery
  - ai-generated
