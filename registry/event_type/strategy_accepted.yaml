id: strategy_accepted
type: event_type
status: real
shipped: 48
last_changed: 2026-05-18
name: strategy_accepted
version: 1.0.0
phase: 48
category: lifecycle
producer: VM107
description: >
  Terminal lifecycle event emitted by the refinement_orchestrator when a
  StrategySpec is PROMOTED into the accepted_strategies WORM collection
  (Critic ACCEPT + acceptance_floor PASS + all hard vetoes clear). Carries
  the accepted_strategy_id, root_hypothesis_id, final_iteration, and the
  on-disk path of the auto-generated registry strategy/<id>.yaml. Pairing
  event is refinement_loop_started; co-terminates with loop_terminated.
causality_scope_default: IDEA  # V1: refinement_loop scope folded under IDEA with correlation_id=loop_id (avoids Phase 56 schema migration). Future: extend Phase 56 enum if cross-loop event archaeology becomes painful.
payload_schema: core.contracts.events.refinement.StrategyAcceptedPayload
payload_fields:
  loop_id: UUID of the refinement loop (correlation_id)
  accepted_strategy_id: UUID of the StrategySpec promoted to accepted_strategies
  root_hypothesis_id: Immutable anchor hypothesis
  final_iteration: Iteration number on which the accept fired
  registry_yaml_path: Path to the auto-generated registry/strategy/<id>.yaml
consumers:
  - phase_56_event_store
related_capabilities:
  - refinement_orchestrator
related_events:
  - refinement_loop_started
  - critic_verdict_received
  - loop_terminated
tags:
  - phase-48
  - lifecycle
  - refinement_loop
impact_on_decision: HIGH
allowed_agent_profiles: []
deprecated: false
hard_scoped: false
