id: correlation_break_alert
type: event_type
status: real
shipped: 91
last_changed: "2026-06-25"
capability_type: event_type
phase: 91
schema_version: "1.0"

# Phase 91 Wave 3 — correlation breakdown alert routing surface.
#
# STUB producer: vm107.macro_relationship_discovery via alert_emit_hook.
# Phase 86 has not shipped a dedicated correlation-breakdown agent yet —
# interim emit point lives inside the discovery agent's correlation analysis
# branch (when a pair's 30d correlation drops > 0.5 absolute, emit
# correlation_break_alert AND discovery_alert dual-fire). When Phase 86
# ships its dedicated agent, swap this producer and remove the dual-fire
# logic from macro_relationship_discovery's alert_emit_hook.

impact_on_decision: HIGH
hard_scoped: false
deprecated: false

name: correlation_break_alert
description: |
  Emitted by vm107.macro_relationship_discovery (Phase 86 stub) when an
  asset-pair 30d correlation breaks down. Wraps an alert_candidate_created
  envelope (alert_type='correlation') with b13_internal_severity='warning'
  → 'Important' user-facing severity. Subject keys:
  subject_type='asset_pair', subject_id = asset_pair (e.g. 'DXY-Gold').
  event_id = sha256(producer|correlation|asset_pair|curr|prev)[:16].

owner_vm: vm107
owner: engineering

payload_schema:
  envelope:
    event_type: "alert_candidate_created"
    alert_type: "correlation"
    severity: "Important"
    b13_internal_severity: "warning"
  payload:
    correlation_30d: float
    prev_correlation_30d: float | null
    n_observations: int | null
    asset_pair: str (e.g. 'DXY-Gold')
    delta_abs: float | null

producers:
  - vm107.macro_relationship_discovery   # STUB — Phase 86 will replace
consumers:
  - phase91.universal_alert_engine

related_capabilities:
  - alert_candidate_created
  - discovery_alert
  - vm107.macro_relationship_discovery

tags:
  - event-type
  - macro
  - phase-91
  - wave-3
  - alert-candidate
  - correlation
  - phase-86-stub
