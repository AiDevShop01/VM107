description: 'Emitted by MentorPipelineOrchestrator when any stage fails terminally
  — reader_failed, analyzer_failed, or writer_failed (after all retries are exhausted).
  Carries the failing stage, error_message, error_type. No narrative is persisted
  when this event is emitted. Pairing event is mentor_pipeline_started. Dagster sensor
  observes this event to decide whether to re-queue the execution after a delay.

  '
