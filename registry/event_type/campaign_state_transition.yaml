short_description: 'Lifecycle transition event emitted on every Campaign state change
  (12-state machine).

  '
long_description: 'Campaign state transitions emit one CAMPAIGN_STATE_TRANSITION Event

  row + schedule one campaign_state_changed domain signal (post-commit

  only, via transaction.on_commit). Two emissions per transition is the

  CONTEXT decision #6 invariant — the Event row is the audit trail, the

  signal is the orchestration trigger.


  The Pydantic payload (CampaignStateTransitionEvent) constrains

  from_state / to_state to the 12-value CampaignState Literal. Pydantic

  rejects Idea or Execution state values at validation — registry

  consumers can rely on the strict schema for replay, reasoning, and

  migration tooling.


  Phase 55 ships ONLY lifecycle-transition event types. Full event

  taxonomy (campaign events, market structure events, AI events, system

  events, etc.) is deferred to Phase 56 which builds the full event

  infrastructure on top of the slot Phase 55 defines.


  Per Plan 55-04 ISSUE-10 fix: the Event.payload column is built via

  CampaignStateTransitionEvent(**kwargs).model_dump(mode=''json'') — NOT

  a raw dict. Pydantic validates state Literals BEFORE the row is

  written; ValidationError surfaces immediately as a 5xx (programming

  error), NOT silent corruption of the audit trail. Replay reads can

  call model_validate(event.payload) to round-trip cleanly.


  Per Plan 55-05 Pattern 18: when a transition is routed through the

  TradeJournalAdapter (legacy facade), source=''adapter'' is recorded

  in the payload. Direct service callers from Dagster / agents /

  frontend record their own source label. The source label

  distinguishes facade-routed transitions from direct service callers

  in the audit trail.


  Idempotency: the (campaign_id, target_state, source_envelope_id)

  tuple is enforced unique at the DB layer via the partial

  UniqueConstraint event_idempotency_unique_source_envelope (Plan

  55-02). Replay returns the existing Event row; no duplicates.

  '
