id: strategy_rejected
type: event_type
status: real
shipped: 48
last_changed: 2026-05-18
name: strategy_rejected
version: 1.0.0
phase: 48
category: lifecycle
producer: VM107
description: >
  Terminal lifecycle event emitted by the refinement_orchestrator when a
  StrategySpec is ARCHIVED into the rejected_strategies WORM collection
  (Critic REJECT, HARD_VETO, IDENTITY_DRIFT, CONVERGENCE_STALL,
  BUDGET_EXCEEDED, MAX_ITERATIONS, or BUILD_FAILURE). Failed search
  trajectories are knowledge assets — both ACCEPT and REJECT are
  first-class lifecycle endings. Carries the rejected_strategy_id,
  root_hypothesis_id, termination_reason, and final_iteration.
causality_scope_default: IDEA  # V1: refinement_loop scope folded under IDEA with correlation_id=loop_id (avoids Phase 56 schema migration). Future: extend Phase 56 enum if cross-loop event archaeology becomes painful.
payload_schema: core.contracts.events.refinement.StrategyRejectedPayload
payload_fields:
  loop_id: UUID of the refinement loop (correlation_id)
  rejected_strategy_id: UUID of the StrategySpec archived to rejected_strategies
  root_hypothesis_id: Immutable anchor hypothesis
  termination_reason: TerminationReason enum value driving the rejection
  final_iteration: Iteration number on which the reject fired
consumers:
  - phase_56_event_store
related_capabilities:
  - refinement_orchestrator
related_events:
  - refinement_loop_started
  - critic_verdict_received
  - hard_veto_triggered
  - identity_drift_detected
  - convergence_stall_detected
  - budget_exceeded
  - loop_terminated
tags:
  - phase-48
  - lifecycle
  - refinement_loop
impact_on_decision: HIGH
