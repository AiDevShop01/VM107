id: reader_started
type: event_type
status: shipped
shipped: 60
last_changed: 2026-05-12
name: reader_started
version: "1.0.0"
phase: 60
category: cognition
producer: VM107

description: >
  Emitted by MentorPipelineOrchestrator immediately BEFORE call_subordinate
  to the _reader sub-profile. Marks the boundary where the orchestrator
  delegates context retrieval to the reader tier. Carries execution_id,
  profile, correlation_id. Pairing event is reader_completed or reader_failed.

payload_schema: fingpt_core.contracts.events.cognition.reader_started.ReaderStartedPayload

payload_fields:
  execution_id: "UUID of the trade execution (null for weekly_review_agent)"
  profile: "Top-level agent profile name"
  correlation_id: "Links all events in this pipeline run"

consumers:
  - phase_56_event_store
  - dagster_orchestration

related_capabilities:
  - mentor_pipeline_orchestrator

related_events:
  - mentor_pipeline_started
  - reader_completed
  - reader_failed

tags: [phase-60, cognition, lifecycle, reader_tier]
