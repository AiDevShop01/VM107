id: counterfactual_generated_event
type: event_type
status: shipped
shipped: 61
planned_phase: null
last_changed: 2026-05-16

name: counterfactual_generated
description: >
  Emitted when a counterfactual artifact is generated for the first time (GeneratedReason.AUTO
  or ON_DEMAND path). Produced by CounterfactualPersister.persist() inside a single
  transaction.atomic() block that ALSO writes counterfactual_artifact row (Pattern 51).
  Sequence number allocated via nextval('execution_event_seq') inside the same atomic block
  (no allocation gap). Downstream consumers subscribe to this event to learn that a
  counterfactual artifact is ready for mentor-tier consumption. UI surface is NONE by
  default (shadow-mode rollout, RG-7).

event_type: counterfactual_generated
category: counterfactual
producer: dagster
causality_scope: EXECUTION
replayable: true
phase: 61

payload_schema: CounterfactualGeneratedEvent
payload_fields:
  counterfactual_id: "UUID of the newly created CounterfactualArtifact row"
  execution_id: "UUID of the closed Execution this counterfactual branches from"
  scenario_id: "Registry ID of the scenario (e.g. counterfactual.stop.atr_1_0)"
  scenario_version: "SemVer version string of the scenario"
  truth_mode: "Always 'COUNTERFACTUAL' (Law #4 — hardcoded, never configurable)"

required_payload_fields:
  - counterfactual_id
  - execution_id
  - scenario_id
  - scenario_version
  - truth_mode

idempotency_key:
  fields: [execution_id, scenario_id, scenario_version]
  note: >
    Idempotency enforced via UNIQUE(execution_id, scenario_id, scenario_version) DB constraint.
    Re-fire with same three-part key raises IntegrityError at the persister level (Law #7).
    source_envelope_id is uuid5(NAMESPACE_OID, "{eid}:{scenario_id}:{scenario_version}").

sequence_namespace: execution_event_seq

emitted_by:
  - counterfactual_persister  # VM100/backend/journal/services/counterfactual/counterfactual_persister.py

trigger:
  mechanism: >
    CounterfactualPersister.persist(generated_reason='AUTO') is called by the
    Dagster counterfactual artifact sensor polling replay_artifact rows whose
    generated_at >= PHASE_61_DEPLOY_TS (RG-6 forward-only constraint). Canonical
    scenarios (ScenarioTier.CANONICAL) are precomputed eagerly by Dagster sensor.
    Experimental scenarios (ScenarioTier.EXPERIMENTAL) are computed lazily by VM107
    tools on-demand.

related_events:
  - replay_artifact_generated  # upstream: replay artifact must exist before counterfactual
  - counterfactual_regenerated  # MANUAL_REGEN variant

capabilities:
  - counterfactual_signal
  - citation_evidence

related_capabilities:
  - counterfactual_persister
  - counterfactual_artifact_sensor

aliases: []
tags: [phase-61, counterfactual, event, dagster-produced, pattern-51, worm-guarded, shadow-mode]
hard_scoped: true
