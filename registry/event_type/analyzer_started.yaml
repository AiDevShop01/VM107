description: >
  Emitted by MentorPipelineOrchestrator immediately BEFORE call_subordinate
  to the _analyzer sub-profile. Marks the boundary where the orchestrator
  passes validated ReaderOutput (converted to AnalyzerInput) to the analyzer
  tier. The reader tier has already succeeded and been validated at this point.
  Pairing event is analyzer_completed or analyzer_failed.

