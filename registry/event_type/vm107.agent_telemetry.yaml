name: vm107.agent_telemetry
description: 'Hybrid agent telemetry stream — REAL_ACTIVITY and HEARTBEAT_IDLE event
  types published to Redis channel vm107.agent_telemetry. 14 locked agent IDs.
  REAL_ACTIVITY fires whenever an agent completes meaningful work (emitter call,
  tool use, pattern match, inference). HEARTBEAT_IDLE fires only when ALL conditions
  met: active operational state AND no real activity for >60s AND agent is expected
  online for the current state. Heartbeats NEVER count toward productivity metrics.
  The hybrid design prevents both silent failures (no heartbeat = agent stuck) and
  metric inflation (heartbeats excluded from productivity counters). Agent IDs are
  locked — new agents require a Phase 47.6 registry YAML before being added here.'
