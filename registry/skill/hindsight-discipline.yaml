trigger_patterns:
- counterfactual
- alternative exit
- what if
- could have
- would have
- hypothetical
- if you had
- hindsight
- '[ref:counterfactual'
enforcement:
  mode: constitutional
  violation_patterns:
  - certainty claim about counterfactual outcome without truth_mode framing
  - ranking of alternative scenarios by outcome
  - optimization claim derived from counterfactual simulation
  - ASSERTION with future-facing recommendation derived from counterfactual
