name: hindsight-discipline
description: 'Constitutional skill enforcing epistemic discipline when referencing
  or interpreting counterfactual scenario outcomes. Prevents agents from treating
  hypothetical alternative exits as omniscient ground truth, phrasing analysis as
  certainty claims, or ranking alternative scenarios as optimization targets. Phase
  61''s primary guard against hindsight contamination in agent output.

  '
