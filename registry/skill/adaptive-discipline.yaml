name: adaptive-discipline
description: 'Constitutional skill enforcing epistemic discipline when referencing
  or interpreting adaptive intelligence outputs. Prevents agents from treating adaptive
  hypothesis signals as canonical trading truth, from implying recommendations are
  actionable without human authorization, or from phrasing drift observations as certainty
  claims. Phase 62''s primary guard against adaptive contamination in mentor prose.

  Tone constraint: use "the evidence suggests possible drift", NEVER "the strategy
  is now fixed" or "drift has been corrected" (CONTEXT.md <specifics> quote, CTX-DEC-1).
  Citation constraint: cite adaptive artifacts via [ref:drift_report:...], [ref:behavioral_evolution:...],
  [ref:pattern_cluster:...], [ref:adaptive_recommendation:...], [ref:counterfactual_aggregate:...].
  Forbidden: NEVER cite other mentor prose as an adaptive source; NEVER imply adaptive
  recommendations are production truth; ALWAYS surface SHADOW_ONLY framing when adaptive
  recommendation is cited.

  '
scope: constitutional
version: 1.0.0
phase: 62
skill_md_path: VM107/skills/adaptive-discipline/SKILL.md
applies_to_profiles:
- behavioral_mentor_agent
