id: mission.chart_adapter
type: widget
status: partial
shipped: 73.1
planned_phase: 73
last_changed: "2026-06-01"

name: Mission Chart Adapter
category: Charting
description: |
  Engine-agnostic charting facade for VM100 frontend. Routes
  kind="candles" to TradingView Advanced Charts (lands in 73.1-01) and
  every other kind to Apache ECharts (lands in 73.1-02). Surface code
  consumes `<ChartAdapter />` exclusively and never imports either
  engine directly — engine swap is a one-file change.

  Plan 73.1-00 ships the facade, the JSDoc-typed normalized series
  schema (CandlePoint / LinePoint / Marker / Overlay / Pane /
  Annotation), the `normalize.js` payload converters (VM102 OHLC →
  CandlePoint[], journal entries → Marker[], opportunity-score
  snapshot → tooltip metadata), the `CHARTS_ENGINE_V2` feature flag
  (default OFF), and removes the dead `recharts` dependency.
  Status is `partial` until 73.1-01 + 73.1-02 land — until then the
  adapter renders an inert "Loading chart engine…" skeleton when
  the flag is ON.

owner_vm: VM100
primary_workflow: mission_control
priority_level: P1

supported_states: [pre, open, mid, close]
supported_devices: [desktop]
data_freshness_type: real_time

primary_data_contracts:
  - vm102.contracts.ohlc.OhlcBar
  - mission_control.contracts.journal.JournalEntry
  - mission_control.contracts.opportunity.OpportunityScoreSnapshot

# Hard dependencies are registry IDs. The two engine adapters land in
# 73.1-01 and 73.1-02 — neither has a registry entry yet, so they
# live under `dependency_details` (soft) for now and will graduate to
# `dependencies` once their YAMLs land.
dependencies: []
dependency_details:
  - kind: engine_adapter
    ref: trading_view_advanced_adapter  # 73.1-01
  - kind: engine_adapter
    ref: echarts_adapter  # 73.1-02
  - kind: api
    ref: vm102.primitives.ohlc_read  # Datafeed bar source
  - kind: api
    ref: vm100.mission_control.journal_read  # Marker source

events_consumed: [selection_changed, journal_note_created]
events_emitted: [chart_ready, chart_data_changed, chart_dispose]

ai_capabilities: []
permissions: [jwt_required, account_scoped]

caching_strategy:
  layer: none
  ttl_seconds: 0
  invalidate_on: []

error_states:
  - engine_chunk_load_failed
  - invalid_chart_kind
  - feature_flag_disabled

phase_demo_flag: false

location:
  source: VM100/frontend/components/charts/ChartAdapter.jsx
  contracts:
    - vm102.contracts.ohlc.OhlcBar
    - mission_control.contracts.journal.JournalEntry
    - mission_control.contracts.opportunity.OpportunityScoreSnapshot

emitted_by: null

related_capabilities:
  - mission.workflow_action_bar
  - mission.active_trade_supervision
  - mission.opportunity_lifecycle_pill

tags: [phase-73.1, mission_control, charting, facade, engine_v2]
hard_scoped: true
impact_on_decision: HIGH
allowed_agent_profiles: []
deprecated: false

# ─── Forward-compat fields (Phases 71 / 74 / 76 / 47.6) ───
evidence_drawer:
  supported: false
conversation_modes: []
notification_channels_consumed: []
freshness_class: [REAL_TIME]
