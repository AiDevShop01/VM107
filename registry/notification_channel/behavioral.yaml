id: behavioral
type: notification_channel
status: real
shipped: 74
planned_phase: null
last_changed: "2026-06-13"
# Stage 2 schema requires `impact_on_decision`. Behavioral signals inform
# discipline and risk decisions; classification MEDIUM (they surface patterns,
# rarely trigger a direct trade decision by themselves).
impact_on_decision: MEDIUM

display_name: Behavioral
badge_color: blue-500
description: |
  Behavioral pattern and mentor signals — fatigue, discipline drift,
  overtrading, overconfidence (session-level) and risk blowout patterns,
  repeated rule violations (critical-level).
  Suppressed during ACTIVE_SUPERVISION / EXECUTION / TRADE_MANAGEMENT
  for P2/P3/P4. P1 (critical-level) bypasses suppression with a
  structured warning log. Session-level surfaces at CLOSE /
  POST_MARKET_REVIEW / RESEARCH lifecycle states.
  Behavioral CRITICAL requires acknowledgement.

# Anti-noise batching matrix (CONTEXT.md §16/17)
batchable_by_priority:
  P1: false
  P2: true
  P3: true
  P4: true

batch_window_seconds_by_priority:
  P1: null
  P2: null   # batch if >= 3 observations, not time-based
  P3: 300    # 5 min
  P4: 900    # 15 min

dismissibility_default: dismissible

# Behavioral CRITICAL (P1) requires acknowledgement (CONTEXT.md §15)
dismissibility_by_priority:
  P1: acknowledge_required
  P2: dismissible
  P3: fully_dismissible
  P4: fully_dismissible

# Suppressed during live-trade lifecycle states (CONTEXT.md §17)
lifecycle_state_guard:
  - ACTIVE_SUPERVISION
  - EXECUTION
  - TRADE_MANAGEMENT

# P1 bypasses (critical-level — risk blowout etc.)
# P2/P3/P4 suppressed during live-trade states
guard_action_by_priority:
  P1: warn_and_deliver
  P2: suppress
  P3: suppress
  P4: suppress

# Behavioral does not bypass Quiet
quiet_preset_bypass_priorities: []

default_delivery:
  - in_app
  - history

auto_escalate_to_p1_triggers: []
default_priority: null

tags:
  - phase-74
  - notification-channel
  - live-trade-suppressed
deprecated: false
