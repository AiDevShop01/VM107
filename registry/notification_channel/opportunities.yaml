id: opportunities
type: notification_channel
status: real
shipped: 74
planned_phase: null
last_changed: "2026-06-13"
# Stage 2 schema requires `impact_on_decision`. Opportunity signals surface
# scored setups that may lead to trade entry — HIGH impact.
impact_on_decision: HIGH

display_name: Opportunities
badge_color: emerald-500
description: |
  Trading opportunity signals — scored opportunities, setup alerts, and
  opportunity lifecycle changes (discovered / confirmed / invalidated).
  Fully dismissible; no lifecycle-state suppression.

# Anti-noise batching matrix (CONTEXT.md §16)
batchable_by_priority:
  P1: false
  P2: true
  P3: true
  P4: true

batch_window_seconds_by_priority:
  P1: null
  P2: 30
  P3: 60
  P4: 60

dismissibility_default: fully_dismissible

dismissibility_by_priority:
  P1: fully_dismissible
  P2: fully_dismissible
  P3: fully_dismissible
  P4: fully_dismissible

# No lifecycle suppression for opportunities
lifecycle_state_guard: []
guard_action_by_priority: {}

# Opportunities do not bypass Quiet (Risk and System P1 are the exceptions)
quiet_preset_bypass_priorities: []

default_delivery:
  - in_app
  - history

auto_escalate_to_p1_triggers: []
default_priority: null

tags:
  - phase-74
  - notification-channel
deprecated: false
