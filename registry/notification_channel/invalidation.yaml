id: invalidation
type: notification_channel
status: real
shipped: 74
planned_phase: null
last_changed: "2026-06-13"
# Stage 2 schema requires `impact_on_decision`. Invalidation signals alert
# that a thesis is no longer valid — HIGH impact because they directly affect
# trade continuation decisions.
impact_on_decision: HIGH

display_name: Invalidation
badge_color: orange-500
description: |
  Idea and opportunity invalidation events — thesis breaks, invalidation
  conditions met, scenario collapses. Dismissible; tighter batch windows
  than Opportunities to surface invalidations quickly.

# Anti-noise batching matrix (CONTEXT.md §16)
batchable_by_priority:
  P1: false
  P2: true
  P3: true
  P4: true

batch_window_seconds_by_priority:
  P1: null
  P2: 15
  P3: 30
  P4: 60

dismissibility_default: dismissible

dismissibility_by_priority:
  P1: dismissible
  P2: dismissible
  P3: fully_dismissible
  P4: fully_dismissible

lifecycle_state_guard: []
guard_action_by_priority: {}

quiet_preset_bypass_priorities: []

default_delivery:
  - in_app
  - history

auto_escalate_to_p1_triggers: []
default_priority: null

tags:
  - phase-74
  - notification-channel
deprecated: false
