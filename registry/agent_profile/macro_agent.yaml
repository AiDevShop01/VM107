id: macro_agent
type: agent_profile
status: real
shipped: 71
last_changed: 2026-05-29
name: macro_agent
description: >
  Phase 71 dedicated conversational profile for the macro_chat conversation
  mode. Anchored to current regime (vm102.regime_current), upcoming economic
  event window (vm100.analytics_calendar), and the macro intelligence feed
  (vm107.intelligence_feed.macro). Account-scoped; read-only context surface;
  no subordinate delegation, no code execution, no trade execution. The chat
  handler (api/v1/trades/ai/chat.py) routes macro_chat -> this profile.
version: 1.0.0
phase: 71
parent_profile: null
hard_scoped: true
sub_profiles: []
allowed_tools:
  - vm102.regime_current
  - vm100.analytics_calendar
  - vm107.intelligence_feed.macro
  - lookup_capability
denied_tools:
  - call_subordinate
  - code_execution_tool
constitutional_skills:
  - citation-discipline
optional_skills:
  - narrative-structure
memory_scope:
  account_scope: required
  execution_scope: NONE
  cross_trade_visibility: ACCOUNT_SCOPED
  narrative_visibility: NONE
max_iterations: 4
max_cost_usd: 0.40
template_version: 1.0.0
template_version_changelog:
  - version: 1.0.0
    date: '2026-05-29'
    change: 'Phase 71 Wave 2 — initial release as dedicated macro_chat host profile'
tags:
  - agent-profile
  - macro
  - conversation-mode-host
  - phase-71
  - wave-2
impact_on_decision: HIGH
allowed_agent_profiles: []
deprecated: false

# P167C (167-06) — additive governance block; existing scalars above are UNCHANGED (D-05).
# Grammar frozen in Documentation/Agent Zero/agent-catalogue/AGENT-CONTRACT-BLOCK-SCHEMA.md
agent_contract:
  contract_version: 1
  catalogue_ref: orchestration/macro-agent.md
  status: built                              # Agent-Zero conversational persona (prompt-hosted; no typed 5/8/9)
  authority: recommend                       # no propose/compute tools granted — read-only conversational surface
  trigger_normalized: [user-invoked]         # no shipped `trigger` scalar — authored fresh per 04 §A (macro_chat host)
  memory_rw:
    reads: [vm102_regime_current, vm100_analytics_calendar, vm107_intelligence_feed_macro]
    writes: []                               # conversational turns; no persistent write
  collaboration:
    invoked_by: [chat_handler:macro_chat]
    may_invoke: []
    may_challenge: []
  failure_behavior:
    insufficient_evidence: "thin context -> say so and answer conservatively, don't fabricate a macro read"
    stale_data: "a stale regime/feed is surfaced as stale, not presented as current"
    conflict: "conflicting anchors surfaced as tension, not smoothed into one view"
    tool_failure: "a context-tool outage -> answer from the remaining anchors, named; no silent confident reply"
  evaluation:
    correctness_kpi: "citation-discipline held = 1.0 (every macro assertion attributes its anchor); account-scope integrity = 1.0"
    cost_slo: max_cost_usd
    latency_slo: "n/a — no latency_budget_ms on this profile"
    honesty: "fabrication_rate=0; degradation_surfaced=1.0"
