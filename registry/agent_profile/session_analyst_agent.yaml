  - phase-103.4
impact_on_decision: MEDIUM
allowed_agent_profiles: []
deprecated: false

# P167C (167-07) — additive governance block; existing scalars above are UNCHANGED (D-05).
# Grammar frozen in Documentation/Agent Zero/agent-catalogue/AGENT-CONTRACT-BLOCK-SCHEMA.md
agent_contract:
  contract_version: 1
  catalogue_ref: markets/session-analyst-agent.md
  status: built                              # least-privilege SIW session-consumer profile (Phase 103.4)
  authority: recommend                       # session read tools only, no propose/execute — narration/report over session state
  trigger_normalized: [reactive]             # no shipped `trigger` scalar — authored fresh per 04 §A (request-scoped SIW consumer)
  memory_rw:
    reads: [session_analyst, probability_agent, data_quality_agent]  # session read tools only (hard_scoped)
    writes: [session_analysis_report]        # via report_writer; no persistent memory (memory_scope NONE)
  collaboration:
    invoked_by: [siw_ai_consumer_read_path]
    may_invoke: [session_analyst, probability_agent, data_quality_agent, report_writer]  # its four scoped tools, not agents
    may_challenge: []
  failure_behavior:
    insufficient_evidence: "thin session data -> narrow the analysis and say so; never fabricate a session read"
    stale_data: "a stale/incomplete session surfaced as stale, not presented as current"
    conflict: "conflicting session signals surfaced as tension, not blended into one read"
    tool_failure: "a session read-tool outage -> analyse from the remaining named tools; no silent confident report"
  evaluation:
    correctness_kpi: "tool-scope integrity = 1.0 (zero reach outside the four ship-now session tools — the V5 mitigation); citation-discipline = 1.0; data-quality surfaced = 1.0"
    cost_slo: max_cost_usd
    latency_slo: "n/a — no latency_budget_ms on this profile"
    honesty: "fabrication_rate=0; degradation_surfaced=1.0"
