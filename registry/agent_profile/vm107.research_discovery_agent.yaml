# Phase 92 Plan 05 — Capability Registry profile for the DiscoveryAgent.
# Stage 2 schema (Phase 47.6 LD-3) compliant.

id: vm107.research_discovery_agent
type: agent_profile
status: real
shipped: 92
last_changed: "2026-06-25"
name: vm107.research_discovery_agent
version: "1.0.0"
phase: 92
description: >-
  Phase 92 Plan 05 — runs cross-doc analysis (weekly batch, or on-demand
  per indicator) to surface novel patterns: ≥3 docs across ≥2 sources
  supporting the same key_finding constitute a `research_discovery_candidate`
  event that routes to Phase 91 Universal Alert Engine. Writes to MongoDB
  `research_intelligence_discoveries` and emits via Phase 91 routing convention.

# Phase 47.6 LD-3 capability registry fields
capability_type: agent
vm: vm107
# HIGH — discoveries raise alerts via Phase 91 UAE; the bar is higher than
# summarisation because false positives cost analyst attention.
impact_on_decision: HIGH
hard_scoped: true
deprecated: false
parent_profile: null
sub_profiles: []
template_version: 1.0.0
template_version_changelog:
  - version: 1.0.0
    date: "2026-06-25"
    change: "Phase 92 Plan 05 — initial release"

# Discovery agent is batch — weekly Dagster job + ad-hoc per-indicator runs.
trigger: dagster_sensor

allowed_tools:
  - search_knowledge
  - search_macro_research
  - lookup_capability
  - response
  # D-06 (P5 137-06): unified memory+knowledge RAG — paired aap in registry/tool/combined_rag.yaml
  - vm107.tool.combined_rag

optional_tools:
  - lookup_reasoning_artifact

denied_tools:
  - call_subordinate
  - code_execution_tool
  - trade_execution_tool
  - filesystem_write
  - belief_store.propose

constitutional_skills: []

memory_scope:
  account_scope: NONE
  execution_scope: NONE
  cross_trade_visibility: NONE
  narrative_visibility: NONE

max_iterations: 3
max_cost_usd: 0.10
latency_budget_ms: 30000

# Phase 70.5 envelope provenance
typical_confidence: 0.70
expected_freshness_seconds: 604800  # weekly batch — discoveries refresh slowly
is_deterministic: false
cot_trail: phase_70_5_worm
cot_trail_max_events: 20

brain_absorbed: []

# Phase 91 routing — produces research_discovery_candidate events consumed by UAE.
emits_events:
  - research_discovery_candidate

owner: engineering
profile_path: null

tags:
  - agent-profile
  - knowledge
  - research
  - phase-92
  - wave-5
  - discovery
  - phase-91-emitter

# P167C (167-06) — additive governance block; existing scalars above are UNCHANGED (D-05).
# Grammar frozen in Documentation/Agent Zero/agent-catalogue/AGENT-CONTRACT-BLOCK-SCHEMA.md
agent_contract:
  contract_version: 1
  catalogue_ref: research/research-discovery-agent.md
  status: built                              # resolves to the shared agents/research/ bundle — NOT skeleton
  authority: recommend                       # belief_store.propose DENIED — candidate via Phase 91 UAE, not a belief
  trigger_normalized: [scheduled]            # alias of shipped `trigger: dagster_sensor` (weekly batch + ad-hoc) (04 §A)
  memory_rw:
    reads: [research_corpus_classified, research_intelligence_discoveries, qdrant_knowledge]
    writes: [research_discovery_candidate_event, research_intelligence_discoveries]
  collaboration:
    invoked_by: [dagster:research_discovery_weekly, ad_hoc_per_indicator]
    may_invoke: []
    may_challenge: []
  failure_behavior:
    insufficient_evidence: "no finding clears >=3-docs/>=2-sources -> emit zero candidates; never lower the bar"
    stale_data: "docs outside the batch window excluded; a fully-stale corpus aborts the sweep, flagged"
    conflict: "a finding contradicted across sources is surfaced as contested, not blended"
    tool_failure: "a search/RAG tool down fails loud and names the tool; never a silent []"
  evaluation:
    correctness_kpi: "candidate precision >= 0.60 (analyst-confirmed novel); multi-source rule held = 1.0"
    cost_slo: max_cost_usd
    latency_slo: latency_budget_ms
    honesty: "fabrication_rate=0; degradation_surfaced=1.0"
