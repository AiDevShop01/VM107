name: vm107.research_contrarian_agent
version: "1.0.0"
phase: 92
description: >-
  Phase 92 Plan 05 — identifies cases where a research document claims a
  contrarian view vs the consensus on its linked indicator (e.g. "Higher
  CPI did NOT correlate with gold appreciation in 2022"). Writes to MongoDB
  `research_intelligence_contrarian` with claim + evidence chunks + confidence.
  Powers Plan 6 §15 Contrarian Views card and informs Phase 89 macro_investigator.

# Phase 47.6 LD-3 capability registry fields
capability_type: agent
