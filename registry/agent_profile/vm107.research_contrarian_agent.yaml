# P167C (167-06) — additive governance block; existing scalars above are UNCHANGED (D-05).
# Grammar frozen in Documentation/Agent Zero/agent-catalogue/AGENT-CONTRACT-BLOCK-SCHEMA.md
agent_contract:
  contract_version: 1
  catalogue_ref: research/research-contrarian-agent.md
  status: built                              # resolves to the shared agents/research/ bundle — NOT skeleton
  authority: recommend                       # belief_store.propose DENIED — a documented counter-claim, not a belief
  trigger_normalized: [event-driven]         # alias of shipped `trigger: dagster_sensor` (per-doc contrarian-scan RPC) (04 §A)
  memory_rw:
    reads: [research_document_classified, indicator_consensus, qdrant_knowledge]
    writes: [research_intelligence_contrarian]
  collaboration:
    invoked_by: [dagster:research_contrarian_sensor]
    may_invoke: []
    may_challenge: [indicator_consensus]     # surfaces a documented counter-claim for review; does not adjudicate
  failure_behavior:
    insufficient_evidence: "no defensible contrarian signal -> emit zero findings; never manufacture one"
    stale_data: "a stale consensus snapshot is refreshed; a fully-stale input aborts, flagged"
    conflict: "genuinely mixed evidence surfaced as contested, not forced into a contrarian verdict"
    tool_failure: "a search/RAG outage -> cannot compare to consensus -> abstain, named; no silent finding"
  evaluation:
    correctness_kpi: "contrarian precision >= 0.65 (analyst-confirmed counter-consensus); evidence-grounding = 1.0"
    cost_slo: max_cost_usd
    latency_slo: latency_budget_ms
    honesty: "fabrication_rate=0; degradation_surfaced=1.0"
