# On-demand (event-driven) — invoked by domain_analyst_subscriber on
# MACRO_RELEASE events whose payload.affected_domains contains "monetary_policy".
trigger: on_demand
schedule_cron: null
sibling_service: domain_analyst_subscriber

trigger_events:
  - macro_release   # filtered by affected_domains contains "monetary_policy" in subscriber

# Tool allow-list — narrative-only analyst; no compute / no write / no LLM tool calls.
allowed_tools:
  - lookup_capability
  - vm107.tool.get_domain_health
  - search_macro_research

