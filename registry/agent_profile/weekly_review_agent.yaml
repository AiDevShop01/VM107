id: weekly_review_agent
type: agent_profile
status: real
shipped: 60
last_changed: 2026-05-29  # Phase 72-09: added COGNITIVE_LIFECYCLE to adaptive_signal_categories
name: weekly_review_agent
description: 'Week-rollup synthesis agent. Account-scoped within a canonical week
  window (week_start, week_end, timezone). Analyzer plays auditor + risk + portfolio
  + mentor roles INTERNALLY per Directive #7 (Phase 46 deferral — no 4-specialist
  split). NEVER reads prior auditor or mentor narratives (narrative_visibility=NONE).
  MentorPipelineOrchestrator drives stage order: reader → analyzer → writer. Fires
  via weekly_review_schedule (Sunday 23:59 UTC cron).

  '
version: 1.0.0
phase: 60
parent_profile: null
hard_scoped: true
sub_profiles:
- weekly_review_agent._reader
- weekly_review_agent._analyzer
- weekly_review_agent._writer
allowed_tools: []
denied_tools:
- call_subordinate
- code_execution_tool
- trade_execution_tool
constitutional_skills:
- citation-discipline
- hindsight-discipline
- adaptive-discipline
optional_skills:
- critique-discipline
- narrative-structure
- pattern-recognition
- strategy-chat
memory_scope:
  account_scope: required
  execution_scope: NONE
  cross_trade_visibility: ACCOUNT_SCOPED
  narrative_visibility: NONE
  adaptive_signal_categories:
  - BEHAVIORAL
  - STRATEGIC
  - REGIME
  - PATTERN
  - ADAPTIVE_RECOMMENDATION
  - COUNTERFACTUAL_AGGREGATE
  - COGNITIVE_LIFECYCLE
max_iterations: 5
max_cost_usd: 0.75
input_contract: fingpt_core.contracts.narrative.reader_io.ReaderInput
output_contract: fingpt_core.contracts.narrative.envelope.NarrativeEnvelope
template_version: 1.0.0
template_version_changelog:
- version: 1.0.0
  date: '2026-05-12'
  change: 'Initial Phase 60 Wave 4 release — NESTED 3-tier week-rollup profile with
    4-lens unified analyzer (Directive #7)'
- version: 1.1.0
  date: '2026-05-16'
  change: 'Phase 62-03: add adaptive_signal_categories=[BEHAVIORAL,STRATEGIC,REGIME,PATTERN,ADAPTIVE_RECOMMENDATION,COUNTERFACTUAL_AGGREGATE]
    to memory_scope; add adaptive-discipline to constitutional_skills (CTX-DEC-14)'
- version: 1.2.0
  date: '2026-05-29'
  change: 'Phase 71-03: add strategy-chat to optional_skills so this profile can
    host the strategy_chat conversation mode (CONTEXT Decision 4).'
- version: 1.3.0
  date: '2026-05-29'
  change: 'Phase 72-09: add COGNITIVE_LIFECYCLE to adaptive_signal_categories —
    enables weekly synthesizer to propose ai_mode_suggestion events and consume
    engine state stream once Phase 72-10 lands the channel (CONTEXT.md Claude''s
    Discretion item).'
tags:
- agent-profile
- weekly-review
- week-window
- account-scoped
- 4-lens
- directive-7
- phase-60
- phase-72
- wave-4
impact_on_decision: HIGH
allowed_agent_profiles: []
deprecated: false

# P167C (167-07) — additive governance block; existing scalars above are UNCHANGED (D-05).
# Grammar frozen in Documentation/Agent Zero/agent-catalogue/AGENT-CONTRACT-BLOCK-SCHEMA.md
# PARENT contract — the ._reader/._analyzer/._writer sub-profiles INHERIT this (canon() strips the
# ._role suffix; they are stage roles, not separately-catalogued agents — no orphan entries).
agent_contract:
  contract_version: 1
  catalogue_ref: trading/weekly-review-agent.md
  status: built                              # week-rollup 4-lens synthesis parent, Directive #7 (Phase 60 Wave 4)
  authority: recommend                       # allowed_tools empty + trade/code/subordinate denied — narration only
  trigger_normalized: [scheduled]            # no shipped `trigger` scalar — authored fresh per 04 §A (weekly_review_schedule Sun 23:59 UTC cron)
  memory_rw:
    reads: [phase56_events, phase57_analytics, phase58_behavioral_patterns, adaptive_signals]  # account-scoped week window; NEVER prior narratives
    writes: [narrative_envelope_week_rollup]
  collaboration:
    invoked_by: [weekly_review_schedule, MentorPipelineOrchestrator]
    may_invoke: [weekly_review_agent._reader, weekly_review_agent._analyzer, weekly_review_agent._writer]  # nested stage roles inherit this contract; the 4 lenses are internal to the analyzer
    may_challenge: []
  failure_behavior:
    insufficient_evidence: "a thin/partial week -> narrow the review and say so; never fabricate a week theme"
    stale_data: "stale weekly analytics/signals surfaced as stale, not presented as current"
    conflict: "conflicting lens reads surfaced as tension, not smoothed into one verdict"
    tool_failure: "an evidence/signal-source outage -> review from the remaining named sources; no silent confident synthesis"
  evaluation:
    correctness_kpi: "citation-discipline held = 1.0 (every week claim cites evidence); account-scope integrity = 1.0; narrative-isolation = 1.0"
    cost_slo: max_cost_usd
    latency_slo: "n/a — no latency_budget_ms on this profile"
    honesty: "fabrication_rate=0; degradation_surfaced=1.0"
