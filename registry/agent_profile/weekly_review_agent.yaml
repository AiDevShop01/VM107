name: weekly_review_agent
description: >
  Week-rollup synthesis agent. Account-scoped within a canonical week window
  (week_start, week_end, timezone). Analyzer plays auditor + risk + portfolio +
  mentor roles INTERNALLY per Directive #7 (Phase 46 deferral — no 4-specialist
  split). NEVER reads prior auditor or mentor narratives (narrative_visibility=NONE).
  MentorPipelineOrchestrator drives stage order: reader → analyzer → writer.
  Fires via weekly_review_schedule (Sunday 23:59 UTC cron).
