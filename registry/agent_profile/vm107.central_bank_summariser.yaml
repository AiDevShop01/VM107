name: vm107.central_bank_summariser

description: >-
  Phase 94 Wave 3b — Central Bank Summariser. Per §K.1 this agent triggers
  ONLY on EventType.CENTRAL_BANK events. Any other event family is a no-op
  (cache untouched, returns None). Reads the event payload (rate decision,
  stance, balance sheet, statement summary) and emits a CentralBankSection.
  Wave 3b uses template-based composition; 94-07 may swap in LLM completion
  behind the same contract surface.

# Phase 47.6 LD-3 capability registry fields
capability_type: agent
vm: vm107
impact_on_decision: HIGH
hard_scoped: true
deprecated: false
phase: 94
parent_profile: null
sub_profiles: []
template_version: 1.0.0
template_version_changelog:
  - version: 1.0.0
    date: "2026-06-27"
    change: "Phase 94 Plan 06 — initial release (CENTRAL_BANK only)"

# Event-driven — ships as docker-compose sibling service.
trigger: event_driven
schedule_cron: null
sibling_service: central_bank_subscriber

# §K.1 — ONLY CENTRAL_BANK events trigger this summariser.
trigger_events:
  - central_bank
