id: vm107.central_bank_summariser
type: agent_profile
status: real
shipped: 94
last_changed: "2026-06-27"
name: vm107.central_bank_summariser

description: >-
  Phase 94 Wave 3b — Central Bank Summariser. Per §K.1 this agent triggers
  ONLY on EventType.CENTRAL_BANK events. Any other event family is a no-op
  (cache untouched, returns None). Reads the event payload (rate decision,
  stance, balance sheet, statement summary) and emits a CentralBankSection.
  Wave 3b uses template-based composition; 94-07 may swap in LLM completion
  behind the same contract surface.

# Phase 47.6 LD-3 capability registry fields
capability_type: agent
vm: vm107
impact_on_decision: HIGH
hard_scoped: true
deprecated: false
phase: 94
parent_profile: null
sub_profiles: []
template_version: 1.0.0
template_version_changelog:
  - version: 1.0.0
    date: "2026-06-27"
    change: "Phase 94 Plan 06 — initial release (CENTRAL_BANK only)"

# Event-driven — ships as docker-compose sibling service.
trigger: event_driven
schedule_cron: null
sibling_service: central_bank_subscriber

# §K.1 — ONLY CENTRAL_BANK events trigger this summariser.
trigger_events:
  - central_bank
event_importance_floor: LOW

allowed_tools:
  - lookup_capability

denied_tools:
  - belief_store.propose
  - vm102_forecast_result_emit
  - vm102_pillar_compute
  - trade_execution_tool
  - code_execution_tool
  - filesystem_write
  - call_subordinate

memory_scope:
  account_scope: NONE
  execution_scope: NONE
  cross_trade_visibility: NONE
  narrative_visibility: NONE

max_iterations: 1
max_cost_usd: 0.0
latency_budget_ms: 1500

constitutional_skills:
  - citation-discipline
  - narrative-only-explain

typical_confidence: 0.85
expected_freshness_seconds: 1800   # Central bank events ~ rare; 30-min window
is_deterministic: true
version: "1.0.0"

emits:
  - central_bank_section

consumed_capabilities:
  - event_bus

cross_vm_contract: vm107.central_bank_summariser.on_event

b5_self_eval: false
b1_artifact_required: false

owner: engineering
profile_path: VM107/agents/central_bank_summariser/profile.yaml

tags:
  - agent-profile
  - macro
  - phase-94
  - wave-3
  - central-bank
  - event-driven
  - narrative-only
  - economic-intelligence

# P167C (167-05) — additive governance block; existing scalars above are UNCHANGED (D-05).
# Grammar frozen in Documentation/Agent Zero/agent-catalogue/AGENT-CONTRACT-BLOCK-SCHEMA.md
agent_contract:
  contract_version: 1
  catalogue_ref: macro/central-bank-summariser.md
  status: built
  authority: recommend                       # belief_store.propose + forecast/pillar tools DENIED; narrative-only
  trigger_normalized: [event-driven]         # alias of shipped `trigger: event_driven` (CENTRAL_BANK events only, §K.1) (04 §A)
  memory_rw:
    reads: [central_bank_event_payload]
    writes: [central_bank_section]
  collaboration:
    invoked_by: [central_bank_subscriber]
    may_invoke: []
    may_challenge: []
  failure_behavior:
    insufficient_evidence: "thin payload -> emit fields present with a limitation; never fabricate a stance"
    stale_data: "beyond 1800s freshness -> mark stale on the section"
    conflict: "decision-vs-statement tension -> present both, never reconcile away"
    tool_failure: "non-CENTRAL_BANK event -> no-op returns None (by design); capability miss degrades metadata only"
  evaluation:
    correctness_kpi: "event-scope integrity = 1.0 (0 non-CENTRAL_BANK events processed, §K.1); grounded rate = 1.0"
    cost_slo: max_cost_usd
    latency_slo: latency_budget_ms
    honesty: "fabrication_rate=0; degradation_surfaced=1.0"
