id: vm107.macro_contradiction_detector
type: agent_profile
status: real
shipped: 89
last_changed: "2026-06-21"
name: vm107.macro_contradiction_detector
description: >-
  Phase 89 Wave 3 — event-driven contradiction detector. Fires on every Phase 85
  release-completed event AFTER reaction_settled_at elapses (Decision 3 — default
  T+30min for intraday). Computes per-asset divergence = |actual - predicted| /
  sigma_historical; grades severity per B13 contract (info/warning/blocking).
  Blocking severity disables confident emit on the affected indicator even on user
  re-ask (Decision 7 — refuse_stands). Alert candidates flow to Phase 91 UAE per
  Decision 13 (severity translation: info→Info, warning→Important, blocking→Critical).

# Phase 47.6 LD-3 capability registry fields
capability_type: agent
vm: vm107
impact_on_decision: HIGH
hard_scoped: true
deprecated: false
phase: 89
parent_profile: null
sub_profiles: []
template_version: 1.0.0
template_version_changelog:
  - version: 1.0.0
    date: "2026-06-21"
    change: "Phase 89 Plan 03 — initial release as event-driven contradiction detector"

# Event-driven trigger (Phase 85 macro.release_events channel)
trigger: event_driven
event_subscription:
  topic: macro.release_events       # Phase 83 channel; same as existing Phase 85 listener
  filter: "reaction_settled_at <= now"        # Decision 3, Pitfall 6

# Tool allow-list (Phase 47.6 register-on-ship lock)
allowed_tools:
  - vm102.indicator_event_study
  - vm105.neo4j_macro_graph_walker            # confounder query
  - belief_store.query
  - belief_store.propose                      # contradicting_count increment
  - phase71.evidence_drawer.write
  - lookup_capability
  - phase91.alert_candidate_emit              # Decision 13

# B5 self-eval: NOT a user-facing prose agent — no rubric needed
b5_self_eval: false
b1_artifact_required: true
b13_contract_id: contract.b13_contradiction_engine

# Brain absorptions
brain_absorbed:
  - B1
  - B13

# NOT a long-running listener service — event-driven via Phase 85 listener dispatch
# The Phase 85 sibling service (vm107-macro-release-event-listener) triggers this
# agent via _dispatch_agent_sync after reaction_settled_at elapses.
sibling_service: null

# Per-indicator reaction window (Decision 3)
reaction_window_minutes:
  default: 30                                 # T+30min for intraday
  per_indicator:
    GDP: 1440                                 # GDP: T+1d (slow-burn)
    GDPC1: 1440
    CPIAUCSL: 30
    PAYEMS: 30
    UNRATE: 30
    FEDFUNDS: 30

# Iteration / cost limits
max_iterations: 4
latency_budget_ms: 10000
cost_budget_per_invocation:
  chat_model_usd: 0.10
  utility_model_usd: 0.0

# Phase 70.5 envelope-provenance fields
typical_confidence: 0.70
expected_freshness_seconds: 1800    # T+30min reaction window
is_deterministic: true              # sigma computation is deterministic
version: "1.0.0"

owner: engineering

tags:
  - agent-profile
  - macro
  - phase-89
  - wave-3
  - event-driven
  - contradiction-detector
  - b13

# P167C (167-07) — additive governance block; existing scalars above are UNCHANGED (D-05).
# Grammar frozen in Documentation/Agent Zero/agent-catalogue/AGENT-CONTRACT-BLOCK-SCHEMA.md
# SKELETON (migration-map §C): registered profile, agent module not built — disposition: wire to the
# existing core/contradiction/ engine. Additive-only; never deleted (09 §5).
agent_contract:
  contract_version: 1
  catalogue_ref: critics/macro-contradiction-detector.md
  status: skeleton                           # registered profile, no agent module — wire to core/contradiction/
  authority: reject                          # critic veto — blocking severity disables confident emit (Decision 7); belief_store.propose granted (contradicting_count++)
  trigger_normalized: [event-driven]         # aliases shipped `trigger: event_driven` per 04 §A
  memory_rw:
    reads: [belief_store, indicator_event_study]                    # prior beliefs + actual-vs-predicted
    writes: [belief_store_contradicting_count, evidence_drawer, alert_candidate]  # propose increment + B1 drawer + phase91 UAE
  collaboration:
    invoked_by: [phase85_release_event_listener]  # _dispatch_agent_sync after reaction_settled_at
    may_invoke: []                           # a critic does not fan out to producers
    may_challenge: [affected_indicator_confident_emit]  # blocking severity vetoes macro reads/forecasts on that indicator
  failure_behavior:
    insufficient_evidence: "missing event-study for the release -> no grade; surface the gap, never a default info-grade"
    stale_data: "a release older than the reaction window surfaced as stale, not graded as live"
    conflict: "the contradiction IS the output — blocking severity disables confident emit (refuse_stands, Decision 7)"
    tool_failure: "an event-study/graph outage -> fail loud, name the tool, escalate; never a silent blind grade"
  evaluation:
    correctness_kpi: "blocking-recall = 1.0 (every true blocking contradiction disables confident emit); false-block rate <= 0.05; refuse_stands held = 1.0"
    cost_slo: cost_budget_per_invocation
    latency_slo: latency_budget_ms
    honesty: "fabrication_rate=0; degradation_surfaced=1.0"
