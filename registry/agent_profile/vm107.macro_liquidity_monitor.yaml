# P167C (167-05) — additive governance block; existing scalars above are UNCHANGED (D-05).
# Grammar frozen in Documentation/Agent Zero/agent-catalogue/AGENT-CONTRACT-BLOCK-SCHEMA.md
agent_contract:
  contract_version: 1
  catalogue_ref: macro/macro-liquidity-monitor.md
  status: built                              # P173-04 (D-08): typed LiquidityScore contract wraps the deterministic scorer; honest-null preserved
  authority: recommend                       # no belief_store.propose granted; surfaces alert candidates
  trigger_normalized: [reactive]             # alias of shipped `trigger: on_demand` (04 §A)
  memory_rw:
    reads: [phase86_substrate_signals, prior_liquidity_score]
    writes: [alert_candidate_created_envelope]
  collaboration:
    invoked_by: [phase91_alert_intake]
    may_invoke: []
    may_challenge: []
  failure_behavior:
    insufficient_evidence: "incomplete substrate -> None -> emit nothing (honest silence)"
    stale_data: "beyond 300s freshness -> discount/abstain, surface staleness"
    conflict: "substrate signals disagree -> no tier crossing forced; surface the split"
    tool_failure: "emit-shim failure -> log, no partial emit; substrate read miss -> abstain"
  evaluation:
    correctness_kpi: "no-fabricated-score rate = 1.0 (None substrate -> silence); tier-accuracy = 1.0"
    cost_slo: max_cost_usd
    latency_slo: latency_budget_ms
    honesty: "fabrication_rate=0; degradation_surfaced=1.0"
