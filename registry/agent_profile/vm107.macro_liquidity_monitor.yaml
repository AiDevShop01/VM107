id: vm107.macro_liquidity_monitor
type: agent_profile
status: experimental
shipped: 91
last_changed: "2026-06-25"
name: vm107.macro_liquidity_monitor

description: >-
  Phase 91 Wave 3 NEW agent — computes a 0..100 global_liquidity_score from
  Phase 86 substrate (credit spread widening, funding stress index, DXY 24h
  spike) and emits alert_candidate_created envelopes (alert_type='liquidity')
  via core/alerts/phase91_emit.emit_alert_candidate to the Phase 91 Universal
  Alert Engine when score crosses 30 (Important) or 20 (Critical) or drops
  > 15 points vs prev. Status experimental until Phase 86 substrate fully
  ships — compute_liquidity_score returns None for incomplete substrate
  and the agent silently emits nothing.

# Phase 47.6 LD-3 capability registry fields
capability_type: agent
vm: vm107
impact_on_decision: HIGH
hard_scoped: true
deprecated: false
phase: 91
parent_profile: null
sub_profiles: []
template_version: 1.0.0
template_version_changelog:
