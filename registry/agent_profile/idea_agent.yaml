# P167C (167-06) — additive governance block; existing scalars above are UNCHANGED (D-05).
# Grammar frozen in Documentation/Agent Zero/agent-catalogue/AGENT-CONTRACT-BLOCK-SCHEMA.md
agent_contract:
  contract_version: 1
  catalogue_ref: research/idea-agent.md
  status: partial                            # D-10 terminal (P173, AZE-10 SC-2): intentional prompt-shaped persona; typed Hypothesis contract deferred to a future research-pipeline phase (migration-map §A)
  authority: recommend                       # belief_store.propose not granted — a candidate idea, not a belief
  trigger_normalized: [user-invoked]         # no shipped `trigger` scalar — authored fresh per 04 §A (human-initiated)
  memory_rw:
    reads: [human_input, qdrant_knowledge, document_query]
    writes: [hypothesis_returned_to_caller]  # prompt-shaped; no persistent store in Phase 37
  collaboration:
    invoked_by: [user]
    may_invoke: []
    may_challenge: []
  failure_behavior:
    insufficient_evidence: "input too thin to shape a hypothesis -> ask for more, don't fabricate a thesis"
    stale_data: "stale grounding is refreshed; a fully-stale context is flagged, not silently used"
    conflict: "contradictory input surfaced as ambiguous, not forced into one hypothesis"
    tool_failure: "a retrieval outage -> degrade to input-only shaping, named; no silent empty output"
  evaluation:
    correctness_kpi: "hypothesis well-formedness >= 0.90 (defensible subject+direction+rationale; measured post typed-Hypothesis upgrade)"
    cost_slo: max_cost_usd
    latency_slo: "n/a — no latency_budget_ms on this profile"
    honesty: "fabrication_rate=0; degradation_surfaced=1.0"
