name: vm107.macro_ask_router

description: >-
  Phase 94 Wave 3b — MacroAskRouter (PURE CLASSIFIER per §J). The router is
  a classifier — it NEVER answers and NEVER imports an LLM client (static-
  grep guard in tests/test_router_never_answers.py). It returns an execution
  plan describing required_agents / execution_order / expected_latency
  given a user query and optional dashboard context. The hybrid
  ConversationPlanner uses heuristic keyword → specialist mapping, falls
  back to capability-registry discovery (so new specialists are picked up
  without code change), and finally to an INJECTED llm_classifier callable
  for free-text queries. The chief_economist_synthesizer (also 94-06)
  composes the natural-language response from specialist outputs.

