id: research_chat_agent
type: agent_profile
status: real
shipped: 71
last_changed: 2026-05-29
name: research_chat_agent
description: >
  Phase 71 dedicated conversational profile for the research_chat
  conversation mode. Anchored to behavioral pattern clusters, cross-trade
  patterns, similarity analysis, and backtest results. Account-scoped;
  read-only context surface; no subordinate delegation, no code execution,
  no trade execution. run_backtest is only invoked when its registry status
  is real (system prompt enforces the gate). The chat handler
  (api/v1/trades/ai/chat.py) routes research_chat -> this profile.
version: 1.0.0
phase: 71
parent_profile: null
hard_scoped: true
sub_profiles: []
allowed_tools:
  # E-HIGH3 (P5 137-05): core research tooling — advertised==authorized on both
  # surfaces (search_knowledge registered in 137-05 Task 1; response aap grant below).
  - search_knowledge
  - response
  # Legacy grants (restore-vs-prune recorded in 137-05-SUMMARY; NOT widened here —
  # additive-only D-07). run_backtest/lookup_capability are domain-appropriate.
  # P6 (138-03): the 2 wrong-domain grants get_cross_trade_behavioral_patterns
  # (behavioral_mentor-only) and similarity_analysis_tool (agent_zero-only) were
  # PRUNED for least-privilege — the underlying tool files stay LIVE for their
  # real domains; only these grant lines were removed.
  - run_backtest
  - lookup_capability
  # D-06 (P5 137-06): unified memory+knowledge RAG — paired aap in registry/tool/combined_rag.yaml
  - vm107.tool.combined_rag
denied_tools:
  - call_subordinate
  - code_execution_tool
constitutional_skills:
  - citation-discipline
optional_skills:
  - narrative-structure
memory_scope:
  account_scope: required
  execution_scope: NONE
  cross_trade_visibility: ACCOUNT_SCOPED
  narrative_visibility: NONE
max_iterations: 4
max_cost_usd: 0.40
template_version: 1.0.0
template_version_changelog:
  - version: 1.0.0
    date: '2026-05-29'
    change: 'Phase 71 Wave 2 — initial release as dedicated research_chat host profile'
tags:
  - agent-profile
  - research
  - conversation-mode-host
  - phase-71
  - wave-2
impact_on_decision: HIGH
allowed_agent_profiles: []
deprecated: false

# P167C (167-06) — additive governance block; existing scalars above are UNCHANGED (D-05).
# Grammar frozen in Documentation/Agent Zero/agent-catalogue/AGENT-CONTRACT-BLOCK-SCHEMA.md
agent_contract:
  contract_version: 1
  catalogue_ref: orchestration/research-chat-agent.md
  status: built                              # Agent-Zero conversational persona (prompt-hosted; no typed 5/8/9)
  authority: recommend                       # no propose/compute tools granted — read-only conversational surface
  trigger_normalized: [user-invoked]         # no shipped `trigger` scalar — authored fresh per 04 §A (research_chat host)
  memory_rw:
    reads: [qdrant_knowledge, combined_rag, run_backtest_when_real]
    writes: []                               # conversational turns; no persistent write
  collaboration:
    invoked_by: [chat_handler:research_chat]
    may_invoke: []
    may_challenge: []
  failure_behavior:
    insufficient_evidence: "thin context -> say so and answer conservatively, don't fabricate a pattern"
    stale_data: "a stale cluster/backtest is surfaced as stale, not presented as current"
    conflict: "conflicting patterns surfaced as tension, not smoothed into one view"
    tool_failure: "run_backtest unavailable (not real) -> answer from knowledge only, named; no faked backtest"
  evaluation:
    correctness_kpi: "backtest-gate held = 1.0 (no run_backtest while status != real); citation-discipline held = 1.0"
    cost_slo: max_cost_usd
    latency_slo: "n/a — no latency_budget_ms on this profile"
    honesty: "fabrication_rate=0; degradation_surfaced=1.0"
