id: vm107.research_summarisation_agent
type: agent_profile
status: real
shipped: 92
last_changed: "2026-06-25"
name: vm107.research_summarisation_agent
version: "1.0.0"
phase: 92
description: >-
  Phase 92 Plan 05 — summarises a graphed ResearchDocument into a 3-bullet
  executive summary + key_findings list. Per-indicator output drives Plan 6
  §15 Research Hub "Key Findings" card. Reads doc body + linked indicators,
  writes to MongoDB `research_intelligence_summaries`.

# Phase 47.6 LD-3 capability registry fields
capability_type: agent
vm: vm107
# HIGH — output is the primary signal Plan 6 surfaces as Key Findings cards;
# Phase 89 macro_investigator quotes from it when answering indicator-scoped Qs.
impact_on_decision: HIGH
hard_scoped: true
deprecated: false
parent_profile: null
sub_profiles: []
template_version: 1.0.0
template_version_changelog:
  - version: 1.0.0
    date: "2026-06-25"
    change: "Phase 92 Plan 05 — initial release"

trigger: dagster_sensor

allowed_tools:
  - search_knowledge
  - search_macro_research
  - lookup_capability
  - response
  # D-06 (P5 137-06): unified memory+knowledge RAG — paired aap in registry/tool/combined_rag.yaml
  - vm107.tool.combined_rag

