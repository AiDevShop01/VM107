name: vm107.timeline

description: >-
  Phase 94 Wave 3b — Timeline agent (APPEND-ONLY per §K.4). Subscribes to
  every EventType on the Phase 94 EventBus and appends an entry to the
  per-country log on each fire — never regenerated wholesale. Window
  filtering (last 24h, last 7d) lives in the Wave 4 serializer; the agent
  itself stores everything. Deterministic, no LLM, no score mutation.

