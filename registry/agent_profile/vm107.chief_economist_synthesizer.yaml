name: vm107.chief_economist_synthesizer

description: >-
  Phase 94 Wave 3b — Chief Economist Synthesizer (Router+Synthesizer §J).
  Composes a natural-language user-facing response from a list of typed
  SpecialistResponse envelopes following the §I locked response structure:
  Answer → Evidence → Supporting Indicators → Research → Confidence →
  Alternative Views → Next Questions. Confidence aggregation is CITATION-
  WEIGHTED (per §J locked decision), not arithmetic mean — specialists with
  more grounding citations carry more weight. Degrades gracefully — if a
  specialist returns confidence <= 0 (error sentinel) the synthesizer still
  produces an answer with explicit limitation notes. Per-paragraph
  attribution markers (HTML-comment form) feed the Phase 71 Evidence Drawer.

