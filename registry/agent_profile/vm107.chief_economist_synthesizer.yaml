# P167C (167-03) — additive governance block; existing scalars above are UNCHANGED (D-05).
# Grammar frozen in Documentation/Agent Zero/agent-catalogue/AGENT-CONTRACT-BLOCK-SCHEMA.md
agent_contract:
  contract_version: 1
  catalogue_ref: orchestration/chief-economist-synthesizer.md
  status: built
  authority: recommend                       # composition function; ceiling grounded to runtime (belief_store.propose denied)
  trigger_normalized: [reactive, user-invoked]   # alias of shipped `trigger: on_demand` (04 §A) — raw scalar kept in place
  memory_rw:
    reads: []                                # composes from in-request SpecialistResponse[]; supporting context via combined_rag
    writes: []                               # no persistent writes
  collaboration:
    invoked_by: [MacroAskExecutor]
    may_invoke: []
    may_challenge: []
  failure_behavior:
    insufficient_evidence: "compose from what exists; enumerate gaps; low overall confidence; never fabricate"
    stale_data: "inherit + surface each envelope's staleness; age composed confidence down"
    conflict: "present both sides in Alternative Views with severities; never average away"
    tool_failure: "n/a for analysis (pure composer); a RAG/lookup miss degrades supporting-context only, named honestly"
  evaluation:
    correctness_kpi: "no-invented-conclusions rate = 1.0; narrative-grounded-in-evidence rate >= 0.98"
    cost_slo: max_cost_usd
    latency_slo: latency_budget_ms
    honesty: "fabrication_rate=0; degradation_surfaced=1.0"
