name: vm107.macro_story_tracker
description: >-
  Phase 87 Wave 4b — hourly background agent maintaining evolving macro
  "story" objects (e.g. "inflation persistence trend emerging"). Polls the
  last 6h of releases via the VM101 typed economic_event API (Phase 47.2
  lock; no parquet reads), pulls top-K=5 prior episodes via the Plan 87-07
  EpisodicMemoryService (via the message_loop_prompts_before_b6 hook),
  detects multi-indicator joint patterns (REQ-87-9), CREATEs / REINFORCEs /
  RETIREs macro_story rows on VM101 Postgres (WORM-style supersedes_story_id
  lineage). LOCK-7 retirement: 3 consecutive opposite-direction releases
  flip is_active=false with retirement_reason. Ships as docker-compose
  sibling service vm107-macro-story-tracker per LOCK-8 / REQ-87-8 /
  feedback_mgmt_commands_need_compose_service — Plan 74-03's observation
  pipeline died by skipping this lock; Plan 87-08 honours it from day one.

