id: behavioral_mentor_agent
type: agent_profile
status: real
shipped: 60
last_changed: 2026-05-29  # Phase 72-09: added COGNITIVE_LIFECYCLE to adaptive_signal_categories
name: behavioral_mentor_agent
description: 'Cross-trade behavioral pattern critique agent. Account-scoped orchestration
  entry point for the behavioral_mentor pipeline. Reads cross-trade deterministic
  evidence (Phase 56 events, Phase 57 analytics, Phase 58 behavioral patterns, Neo4j
  edges) across ALL executions within the account. NEVER reads prior auditor or mentor
  narratives (narrative_visibility=NONE). MentorPipelineOrchestrator drives stage
  order: reader → analyzer → writer.

  '
version: 1.0.0
phase: 60
parent_profile: null
hard_scoped: true
sub_profiles:
- behavioral_mentor_agent._reader
- behavioral_mentor_agent._analyzer
- behavioral_mentor_agent._writer
# E-MED1 / D-03 tool-scope contract (schema doc — representative profile):
#   allowed_tools: []  (present-but-empty)  +  non-empty denied_tools  ==  ZERO tools.
# A present-but-empty allowed_tools is an explicit empty whitelist: apply_tool_scope keeps
# ONLY ids in `allowed`, so an empty allowed advertises nothing regardless of denied_tools.
# (Contrast: allowed_tools ABSENT/null == "no whitelist — keep all".) This host is a
# router/orchestrator that dispatches to its ._reader/._analyzer/._writer sub-profiles and
# holds no tools of its own. Asserted by tests/phase137/test_scope_reconciliation.py
# (test_empty_allowed_with_denied_advertises_nothing_contract + _real_profiles_...).
allowed_tools: []
denied_tools:
- call_subordinate
- code_execution_tool
- trade_execution_tool
constitutional_skills:
- citation-discipline
- hindsight-discipline
- adaptive-discipline
optional_skills:
- critique-discipline
- narrative-structure
- pattern-recognition
- reflection-chat
memory_scope:
  account_scope: required
  execution_scope: NONE
  cross_trade_visibility: ACCOUNT_SCOPED
  narrative_visibility: NONE
  adaptive_signal_categories:
  - BEHAVIORAL
  - COGNITIVE_LIFECYCLE
max_iterations: 5
max_cost_usd: 0.6
input_contract: fingpt_core.contracts.narrative.reader_io.ReaderInput
output_contract: fingpt_core.contracts.narrative.envelope.NarrativeEnvelope
template_version: 1.0.0
template_version_changelog:
- version: 1.0.0
  date: '2026-05-12'
  change: Initial Phase 60 Wave 3 release — NESTED 3-tier cross-trade profile
- version: 1.1.0
  date: '2026-05-16'
  change: 'Phase 62-03: add adaptive_signal_categories=[BEHAVIORAL] to memory_scope;
    add adaptive-discipline to constitutional_skills (CTX-DEC-14)'
- version: 1.2.0
  date: '2026-05-29'
  change: 'Phase 71-03: add reflection-chat to optional_skills so this profile can
    host the reflection_chat conversation mode (CONTEXT Decision 4).'
- version: 1.3.0
  date: '2026-05-29'
  change: 'Phase 72-09: add COGNITIVE_LIFECYCLE to adaptive_signal_categories — enables
    this profile to propose ai_mode_suggestion events and consume engine state stream
    once Phase 72-10 lands the channel (CONTEXT.md Claude''s Discretion item).'
tags:
- agent-profile
- mentor
- cross-trade
- account-scoped
- phase-60
- phase-72
- wave-3
impact_on_decision: HIGH
allowed_agent_profiles: []
deprecated: false

# P167C (167-07) — additive governance block; existing scalars above are UNCHANGED (D-05).
# Grammar frozen in Documentation/Agent Zero/agent-catalogue/AGENT-CONTRACT-BLOCK-SCHEMA.md
# PARENT contract — the ._reader/._analyzer/._writer sub-profiles INHERIT this (canon() strips the
# ._role suffix; they are stage roles, not separately-catalogued agents — no orphan entries).
agent_contract:
  contract_version: 1
  catalogue_ref: trading/behavioral-mentor-agent.md
  status: built                              # cross-trade behavioural mentor pipeline parent (Phase 60 Wave 3)
  authority: recommend                       # allowed_tools empty + trade/code/subordinate denied — narration only
  trigger_normalized: [reactive]             # no shipped `trigger` scalar — authored fresh per 04 §A (MentorPipelineOrchestrator-invoked)
  memory_rw:
    reads: [phase56_events, phase57_analytics, phase58_behavioral_patterns, neo4j_edges]  # account-scoped; NEVER prior narratives
    writes: [narrative_envelope_behavioral_critique]
  collaboration:
    invoked_by: [MentorPipelineOrchestrator]
    may_invoke: [behavioral_mentor_agent._reader, behavioral_mentor_agent._analyzer, behavioral_mentor_agent._writer]  # nested stage roles inherit this contract
    may_challenge: []
  failure_behavior:
    insufficient_evidence: "thin cross-trade evidence -> narrow the critique and say so; never fabricate a behavioural pattern"
    stale_data: "stale analytics/patterns surfaced as stale, not presented as current behaviour"
    conflict: "conflicting behavioural signals surfaced as tension, not blended into one verdict"
    tool_failure: "an evidence-source outage -> critique from the remaining named sources; no silent confident narrative"
  evaluation:
    correctness_kpi: "citation-discipline held = 1.0 (every behavioural claim cites Phase 56/57/58 evidence); account-scope integrity = 1.0; narrative-isolation = 1.0"
    cost_slo: max_cost_usd
    latency_slo: "n/a — no latency_budget_ms on this profile"
    honesty: "fabrication_rate=0; degradation_surfaced=1.0"
