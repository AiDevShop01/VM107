id: vm107.theme_monitor
type: agent_profile
status: real
shipped: 94
last_changed: "2026-06-27"
name: vm107.theme_monitor

description: >-
  Phase 94 Wave 3b — Theme Monitor agent (Router+Synthesizer §J pattern).
  Consumes Theme objects produced by the deterministic MacroThemeEngine
  (94-05), ranks them by Strength × Confidence per §H.4, and emits a
  ThemeMonitorSection clipped to the 5..7 dashboard window. NEVER mutates
  theme strength or state — the engine owns scoring. Wave 3b is template-
  based and deterministic; the contract surface stays immutable across
  future LLM swap-ins.

# Phase 47.6 LD-3 capability registry fields
capability_type: agent
vm: vm107
impact_on_decision: HIGH
hard_scoped: true
deprecated: false
phase: 94
