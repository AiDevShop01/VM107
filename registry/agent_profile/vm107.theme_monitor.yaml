# P167C (167-05) — additive governance block; existing scalars above are UNCHANGED (D-05).
# Grammar frozen in Documentation/Agent Zero/agent-catalogue/AGENT-CONTRACT-BLOCK-SCHEMA.md
agent_contract:
  contract_version: 1
  catalogue_ref: macro/theme-monitor.md
  status: built
  authority: recommend                       # belief_store.propose + forecast/pillar tools DENIED; ranks, never re-scores
  trigger_normalized: [event-driven]         # alias of shipped `trigger: event_driven` ([macro_release, regime_change, research]) (04 §A)
  memory_rw:
    reads: [macrothemeengine_theme_objects]
    writes: [theme_monitor_section]
  collaboration:
    invoked_by: [theme_monitor_subscriber]
    may_invoke: []
    may_challenge: []
  failure_behavior:
    insufficient_evidence: "fewer than 5 themes -> emit what exists; surface insufficient_history, never pad"
    stale_data: "beyond 300s freshness -> mark stale on the section"
    conflict: "tied scores -> deterministic tie-break; present the tie honestly"
    tool_failure: "engine-capability miss -> abstain; never fabricate themes"
  evaluation:
    correctness_kpi: "engine-lock respected = 1.0 (0 theme-score mutations); ranking-correctness = 1.0 (order matches Strength x Confidence)"
    cost_slo: max_cost_usd
    latency_slo: latency_budget_ms
    honesty: "fabrication_rate=0; degradation_surfaced=1.0"
