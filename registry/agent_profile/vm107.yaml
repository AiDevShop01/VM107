name: vm107
description: |
  Base agent_profile for the VM107 sub-profile namespace. Sub-profiles like
  ``vm107.macro_regime_analyst`` / ``vm107.macro_release_analyst`` /
  ``vm107.macro_transmission_analyst`` etc. declare themselves with this
  ``vm107`` prefix; the stage-5 registry validator extracts the leading
  segment before the first ``.`` and requires the base prefix to also be
  registered as an agent_profile.

  Created 2026-06-21 to resolve a startup crashloop where ``belief_store``
  listed ``allowed_agent_profiles=[..., 'vm107.macro_regime_analyst', ...]``
  and the validator refused to load because base profile ``vm107`` was
  unregistered.

  This file is a registration marker for the VM107 sub-profile namespace.
  All concrete VM107 agent behavior lives in the dotted sub-profile YAMLs.
