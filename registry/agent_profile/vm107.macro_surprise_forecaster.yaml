name: vm107.macro_surprise_forecaster
description: >-
  Phase 90 Plan 05 Task 1 — macro surprise forecaster (Layer 2). Consumes
  VM102 GET /api/v2/forecast/surprise/<id> to produce Surprise direction
  assessments (Beat / Miss / In-Line) with confidence. The VM102 endpoint
  ships in Plan 05; the dedicated VM107 agent wiring (LLM-emitted
  ExplanationResult narrative around the surprise verdict) is Plan 06
  scope per LD-90-1 (LLMs may explain forecasts but never emit
  ForecastResult). Currently a STUB profile so the
  ``vm102_forecast_surprise.allowed_agent_profiles`` lookup resolves
  during boot-validation sweep; Plan 06 promotes to status=real.

