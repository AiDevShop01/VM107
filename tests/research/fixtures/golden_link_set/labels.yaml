# Phase 92 Plan 03 — Golden labelled set for the indicator linker harness.
#
# expected_indicators: All FRED EconomicIndicator IDs the document substantively
#                      discusses. Aim for COMPLETE coverage of indicators that
#                      Stage 1 (synonym match) would legitimately surface — this
#                      keeps the precision metric meaningful.
# expected_assets:     1-4 asset IDs from VM107/data/asset_universe.yaml.
# expected_tier:       1 for FOMC + ECB Tier-1; 3 for NBER.
# expected_status:     'classified' (default) — soft-reject tested separately.
# expected_linker_stage: 'synonym' = covered by indicator_synonyms.yaml; 'llm' =
#                        Stage 2 needed for the marginal hits.
#
# Distribution: 25/30 synonym-coverable, 5/30 LLM-fallback territory (term
# premium, convenience yield, r-star, neutral rate, real yields).

