# Phase 92 Plan 03 — Golden labelled set for the indicator linker harness.
#
# expected_indicators: 1-3 FRED EconomicIndicator IDs (Phase 83 catalog of 64).
# expected_assets:     1-4 asset IDs from VM107/data/asset_universe.yaml.
# expected_tier:       1 for FOMC + ECB Tier-1; 3 for NBER.
# expected_status:     'classified' (default) — soft-reject path tested separately.
# expected_linker_stage: 'synonym' = covered by indicator_synonyms.yaml; 'llm' = LLM fallback only.
#
# Distribution: 25/30 synonym-coverable, 5/30 LLM-fallback-only (fomc_06, ecb_08, nber_03,
# nber_05 [dollar/dxy via synonym + DXY direct], nber_08 — term-premium / convenience-yield /
# neutral-rate / r-star) to exercise both stages.

