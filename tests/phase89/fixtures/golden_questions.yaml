# Phase 89 UAT Question Bank — 20 macro questions for REQ-89-9 UAT
# 5 questions per indicator family: CPI, NFP, GDP, FEDFUNDS
# Categories: factual | counterfactual | explanatory | contradiction_explaining | regime_aware
# Lock: expected_hallucination_flag = false for all 20 (Wave 6 UAT reviewer fills actuals)

questions:

  # ── CPI (Consumer Price Index) ───────────────────────────────────────────────
  - question_id: "CPI-01"
    indicator_id: "CPIAUCSL"
    category: "factual"
    prompt: "What was the CPI reading for March 2024, and how did it compare to the consensus forecast?"
    expected_evidence_kinds:
      - "fred_release_data"
      - "consensus_estimate"
    expected_word_count_max: 250
    expected_hallucination_flag: false

  - question_id: "CPI-02"
    indicator_id: "CPIAUCSL"
    category: "counterfactual"
    prompt: "If CPI had come in at 2.9% instead of the actual 3.5% in January 2024, how would you expect DXY, Gold, and the 10Y UST to have moved?"
    expected_evidence_kinds:
      - "historical_analogues"
      - "phase_86_event_study"
      - "market_impact_estimate"
    expected_word_count_max: 250
    expected_hallucination_flag: false

  - question_id: "CPI-03"
    indicator_id: "CPIAUCSL"
    category: "explanatory"
    prompt: "Why did Gold rise despite the CPI beat in June 2022, when a CPI beat normally strengthens the dollar and pressures Gold?"
    expected_evidence_kinds:
      - "transmission_chain"
      - "regime_context"
      - "historical_analogues"
    expected_word_count_max: 250
    expected_hallucination_flag: false

  - question_id: "CPI-04"
    indicator_id: "CPIAUCSL"
    category: "contradiction_explaining"
    prompt: "The system flagged a contradiction: the model predicted DXY +0.8% on the April 2024 CPI beat, but DXY fell -0.3%. What could explain this divergence?"
    expected_evidence_kinds:
      - "divergence_event"
      - "regime_context"
      - "historical_analogues"
    expected_word_count_max: 250
    expected_hallucination_flag: false

  - question_id: "CPI-05"
    indicator_id: "CPIAUCSL"
    category: "regime_aware"
    prompt: "How does the typical CPI-to-Gold transmission chain differ between a rate-hike regime and a rate-pause regime? Use analogues from 2022-2024."
    expected_evidence_kinds:
      - "regime_context"
      - "transmission_chain"
      - "historical_analogues"
    expected_word_count_max: 250
    expected_hallucination_flag: false

