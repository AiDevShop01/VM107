  # ---------------------------------------------------------------------------
  # Notification-pipeline wire-up Phase 1 — vm107-cost-monitor sibling service
  #
  # CLAUDE.md lock (feedback_mgmt_commands_need_compose_service.md): every
  # long-running worker MUST ship as a docker-compose sibling service. This
  # service runs an APScheduler BlockingScheduler (scripts/run_cost_monitor.py)
  # that every COST_MONITOR_INTERVAL_SEC (default 300s) aggregates AI-spend from
  # fingpt_agents.agent_runs and drives the two dormant Phase 74 detectors
  # (CostAnomalyDetector + BudgetThresholdMonitor), which publish Observations to
  # the `vm107.observations` Redis channel consumed by VM100's notification bell.
  # Without this service the detectors have no trigger — their inputs were
  # populated only by tests (Phase 74-03 cautionary tale: a producer with no
  # compose service silently never runs).
  #
  # Restart after env changes (NEVER `docker restart` — it ignores env_file edits):
  #   docker compose up -d --force-recreate --no-deps vm107-cost-monitor
  # ---------------------------------------------------------------------------
  vm107-cost-monitor:
    container_name: vm107-cost-monitor
    # AZI-01 (Phase 154-02) Tier C monitor — lightest worker (5-min tick).
    mem_limit: 384m
    cpus: 0.25
    build:
      context: .
      dockerfile: DockerfileLocal
    image: vm107-agent-zero:local
    restart: unless-stopped
    command: /opt/venv-a0/bin/python -m scripts.run_cost_monitor
    env_file:
      - .env.local
    environment:
      PYTHONPATH: /a0_extras:/a0
      # ── Required — fail-fast at startup (env-driven-no-fallbacks lock) ──────
      # ${VAR:?msg} aborts `docker compose up` if unset. The runner ALSO
      # re-checks these at process boot before wiring collaborators, and the
      # detectors + observation_publisher fail-fast on them at import time.
      MONGODB_URI: "${MONGODB_URI:?MONGODB_URI is required (cost-monitor — fingpt_agents.agent_runs source)}"
      VM107_SUPERVISORY_REDIS_URL: "${VM107_SUPERVISORY_REDIS_URL:?VM107_SUPERVISORY_REDIS_URL is required (cost-monitor — observation_publisher channel)}"
      COST_ANOMALY_MULTIPLIER_WARN: "${COST_ANOMALY_MULTIPLIER_WARN:?COST_ANOMALY_MULTIPLIER_WARN is required (cost-monitor — cost_anomaly_detector)}"
      COST_ANOMALY_MULTIPLIER_CRITICAL: "${COST_ANOMALY_MULTIPLIER_CRITICAL:?COST_ANOMALY_MULTIPLIER_CRITICAL is required (cost-monitor — cost_anomaly_detector)}"
      DAILY_AI_BUDGET_USD: "${DAILY_AI_BUDGET_USD:?DAILY_AI_BUDGET_USD is required (cost-monitor — budget_threshold_monitor)}"
      # ── Optional tunable — tick cadence in seconds (default 300) ────────────
      COST_MONITOR_INTERVAL_SEC: "${COST_MONITOR_INTERVAL_SEC:-300}"
    volumes:
      - ./usr:/a0/usr
      - "/Volumes/ HardDrive/FinGPT/Dagster/fingpt_core/src/fingpt_core:/a0_extras/fingpt_core:ro"
      # Runner + its transitive imports (aggregator, detectors, publisher,
      # cost_calculator, budget_tracker). Bind-mounted so host edits propagate
      # without an image rebuild (mirrors the macro-regime-monitor layout).
      - ./scripts:/a0/scripts:ro
      - ./services:/a0/services:ro
      - ./core:/a0/core:ro
      # core.boundary.budget_tracker imports emitters.source_health_registry;
      # emitters/ imports lib/. These override-CMD sidecars skip the /a0
      # population step, so both must be bind-mounted or the runner ModuleNotFounds
      # on 'emitters' at import time (2026-08-27 fix — pre-existing compose drift).
      - ./emitters:/a0/emitters:ro
      - ./lib:/a0/lib:ro
      # Heartbeat file is written under /app/logs by the runner; the healthcheck
      # reads it from the same path.
      - ./logs:/app/logs
    depends_on:
      vm107-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/venv-a0/bin/python", "-m", "scripts.cost_monitor_health"]
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 2m
    networks:
      - vm107_network
    labels:
      - "com.tradetracker.service=vm107-cost-monitor"
      - "com.tradetracker.component=worker"
      - "com.tradetracker.phase=notification-wireup"

  # ---------------------------------------------------------------------------
  # Phase 154-02 (AZI-03) — willfarrell/autoheal sidecar
  #
  # Watches the HEALTHCHECK state the engine already computes for every
  # container and restarts any that go `unhealthy`. Delivered compose-native
  # (survives `compose down/up` + host restart via restart: unless-stopped) so
  # there is NO host crontab — the AZI-03 requirement.
  #
  # AUTOHEAL_CONTAINER_LABEL=all watches every container on the host, so new
  # services are covered with no per-service edit. All 16 VM107 services already
  # declare a real healthcheck, so coverage is complete on day one.
  #
  # Image is pinned BY DIGEST (not :latest) for immutability — a compromised
  # tag cannot inject a new binary (threat T-154-03 primary control, alongside
  # keeping the sidecar off any public interface: vm107_network is internal and
  # no host port is published). Digest resolved 2026-08-31 from the official
  # Docker Hub registry (willfarrell/autoheal, current released tag).
  #
  # docker.sock is mounted read-only (:ro) as defense-in-depth; note this only
  # restricts filesystem-metadata ops on the socket file, NOT the Docker API
  # calls (container restart) issued over the connection — the effective control
  # is the network isolation + digest pin above. Residual EoP is accepted for a
  # dev-host sidecar; revisit if this pattern travels to prod in Phase 174.
  #
  # Pitfall 3 (RESEARCH): repeated autoheal restarts of the SAME container are a
  # signal a service is genuinely broken, not a fix — the per-service
  # start_periods bound churn and the AZI-01 caps ensure a churning container
  # cannot host-OOM.
  # ---------------------------------------------------------------------------
  autoheal:
    image: willfarrell/autoheal@sha256:1c00ddf723629daf91a70f2f8c74500db4e4ac1b3c27d2e7b610dced267511f5
    container_name: vm107-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: all
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - vm107_network

volumes:
  redis_data:

networks:
  vm107_network:
    external: true
