services:
  vm107-redis:
    image: redis:7-alpine
    container_name: vm107-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    # Bucket-A3 (2026-06-08): expose to host so vm100-backend's Phase 74
    # agent_activity_client can connect via VM107_TELEMETRY_REDIS_URL.
    # Without this the client raises RuntimeError on init and the entire
    # agent telemetry channel is disabled.
    ports:
      - "${VM107_REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vm107_network

  vm107:
    container_name: vm107-agent-zero
    build:
      context: .
      dockerfile: DockerfileLocal
    image: vm107-agent-zero:local
    restart: unless-stopped
    ports:
      - "50081:80"
      # Phase 67 Plan 12 — FastMCP server streamable-HTTP transport.
      # Host port and container port both come from VM107_MCP_PORT (fail-fast).
      - "${VM107_MCP_PORT:?VM107_MCP_PORT is required (Phase 47.3 lock — no fallback defaults)}:${VM107_MCP_PORT:?VM107_MCP_PORT is required (Phase 47.3 lock — no fallback defaults)}"
    env_file:
      - .env.local
    environment:
      # Make fingpt_core importable from VM107 tools/Tier-1 builder.
      # Mounted from sibling Dagster repo at the path below.
      PYTHONPATH: /a0_extras:/a0
      # 2026-06-15 Phase 85.1 deployment fix — the prior /a0/registry/registry
      # overlay path no longer exists in the current image; init silently
      # loaded 0 entries and any prompt-building extension (_11_tools_prompt.py)
      # raised "CapabilityRegistry not initialized" when CapabilityRegistry.get()
      # ran. Pointed at the live volume-mounted ./registry instead so host
      # YAML edits propagate without rebuild.
      CAPABILITY_REGISTRY_ROOT: /a0/registry
      # Phase 67 Plan 12 — FastMCP server env (fail-fast — Phase 47.3 lock).
      # The ${VAR:?msg} syntax is docker-compose's fail-fast operator: missing
      # env at `docker compose up` aborts with the message. No fallback defaults.
      VM107_MCP_JWKS_URI: "${VM107_MCP_JWKS_URI:?VM107_MCP_JWKS_URI is required (Phase 67 Plan 12 — JWT validation)}"
      VM107_MCP_ISSUER: "${VM107_MCP_ISSUER:?VM107_MCP_ISSUER is required (Phase 67 Plan 12 — JWT issuer)}"
      VM107_MCP_AUDIENCE: "${VM107_MCP_AUDIENCE:?VM107_MCP_AUDIENCE is required (Phase 67 Plan 12 — JWT audience)}"
      VM107_MCP_PORT: "${VM107_MCP_PORT:?VM107_MCP_PORT is required (Phase 67 Plan 12 — FastMCP streamable-http port)}"
      # VM100 chokepoint config — MCP tools call VM100 backend, not direct data.
      VM100_BASE_URL: "${VM100_BASE_URL:?VM100_BASE_URL is required (Phase 67 Plan 12 — VM100 chokepoint base URL)}"
      VM100_INTERNAL_TOKEN: "${VM100_INTERNAL_TOKEN:?VM100_INTERNAL_TOKEN is required (Phase 67 Plan 12 — service-to-service bearer token)}"
      # Phase 73-followup — VM100→VM107 service-to-service X-API-KEY token.
      # Validated by helpers/api.py @requires_api_key on mission_control endpoints
      # (opportunities/ranked, intelligence_feed/*, narratives/global).
      VM107_INTERNAL_TOKEN: "${VM107_INTERNAL_TOKEN:?VM107_INTERNAL_TOKEN is required (Phase 73-followup — VM100↔VM107 service auth)}"

      # Phase 91 Plan 1 — Universal Alert Engine intake URL.
      # VM107 emitters (core/alerts/phase91_emit.py) POST alert_candidate_event
      # v1.0 envelopes here. Producer-side DLQ on missing URL preserves
      # observability when Phase 91 is gated off; when alerts are enabled the
      # var MUST be set (no fallback default per env-driven config lock).
      # Dev value example: http://192.168.1.100/api/mission-control/internal/alert-candidate-created
      # X-Internal-Token uses VM100_INTERNAL_TOKEN above.
      PHASE_91_UAE_URL: "${PHASE_91_UAE_URL:?PHASE_91_UAE_URL is required (Phase 91 Plan 1 — UAE intake endpoint, no fallback)}"

      # Phase 74 — Supervisory AI + Cost Anomaly emitter config.
      # Read by supervisory_emitter.py + cost_anomaly_detector.py at import time.
      # No fallback defaults (env-driven-no-fallbacks lock).
      VM107_SUPERVISORY_REDIS_URL: ${VM107_SUPERVISORY_REDIS_URL}
      COST_ANOMALY_MULTIPLIER_WARN: ${COST_ANOMALY_MULTIPLIER_WARN}
      COST_ANOMALY_MULTIPLIER_CRITICAL: ${COST_ANOMALY_MULTIPLIER_CRITICAL}
      BEHAVIORAL_COOLDOWN_MIN: ${BEHAVIORAL_COOLDOWN_MIN}
      SUPERVISORY_COOLDOWN_ADVISORY_SEC: ${SUPERVISORY_COOLDOWN_ADVISORY_SEC}
      SUPERVISORY_COOLDOWN_WARNING_SEC: ${SUPERVISORY_COOLDOWN_WARNING_SEC}
      SUPERVISORY_COOLDOWN_CRITICAL_SEC: ${SUPERVISORY_COOLDOWN_CRITICAL_SEC}
      DAILY_AI_BUDGET_USD: ${DAILY_AI_BUDGET_USD}
      # Phase 85.1 — A0 invokes via HTTP from sibling services + in-container backfill.
      VM107_AGENT_ZERO_URL: "${VM107_AGENT_ZERO_URL:-http://localhost:80}"
    volumes:
      - ./usr:/a0/usr
      # Phase 85.1 — mount the live registry so capability YAML edits propagate
      # to A0 without a rebuild. Required for A0's prompt-building extensions
      # (_11_tools_prompt.py) which read from CapabilityRegistry.
      - ./registry:/a0/registry:ro
      # Phase 85.1 — mount workers/ + backfill/ so the in-container backfill CLI
      # (`python -m backfill.backfill_indicator_descriptions`) imports the live
      # HTTP-path workers.agent_invocation, not the image-baked old in-process
      # version. Without these the backfill silently runs the wrong invocation
      # path and Agent Zero responds with stale runtime errors.
      - ./workers:/a0/workers:ro
      - ./backfill:/a0/backfill:ro
      - ./persistence:/a0/persistence:ro
      # Vendor fingpt_core source (read-only) so the Phase 39/47.2 typed
      # tool layer (`from fingpt_core.clients import ...`,
      # `from fingpt_core.contracts.* import ...`) actually imports inside
      # the running container. Without this mount every Tier-2/Tier-3 tool
      # silently fails at agent.get_tool() with ModuleNotFoundError.
      - "/Volumes/ HardDrive/FinGPT/Dagster/fingpt_core/src/fingpt_core:/a0_extras/fingpt_core:ro"
    depends_on:
      vm107-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    networks:
      - vm107_network

  # ---------------------------------------------------------------------------
  # Phase 83 Plan 10 — vm107-macro-emitter sibling service (Decision G1 / Pitfall 2)
  #
  # CLAUDE.md lock (feedback_mgmt_commands_need_compose_service.md): any
  # long-running process MUST ship as a docker-compose sibling service, never
  # as a management command or manual `docker exec` invocation.  Phase 74-03
  # shipped run_observation_listener without a service and it silently died on
  # every backend restart.  This service is the cautionary-tale fix applied
  # proactively.
  #
  # Healthcheck probes /healthz (Task 3): 200 = all deps ok, 503 = degraded.
  # ---------------------------------------------------------------------------
  vm107-macro-emitter:
    container_name: vm107-macro-emitter
    build:
      context: .
      dockerfile: DockerfileLocal
    image: vm107-agent-zero:local
    restart: unless-stopped
    command: /opt/venv-a0/bin/python -m emitters.intelligence_feed_macro_emitter
    ports:
      - "${MACRO_EMITTER_HEALTHZ_HOST_PORT:-8090}:${MACRO_EMITTER_HEALTHZ_PORT:-8090}"
    env_file:
      - .env.local
    environment:
      PYTHONPATH: /a0_extras:/a0
      # ── Phase 83 Plan 10 — MACRO emitter required env vars ────────────────
      # Fail-fast syntax: ${VAR:?msg} aborts `docker compose up` if unset.
      # See env-driven-no-fallbacks lock in CLAUDE.md.
      MACRO_EMITTER_SNAPSHOT_URL: "${MACRO_EMITTER_SNAPSHOT_URL:?MACRO_EMITTER_SNAPSHOT_URL is required (Phase 83 Plan 10 — Postgres truth-write endpoint)}"
      VM107_SERVICE_JWT: "${VM107_SERVICE_JWT:?VM107_SERVICE_JWT is required (Phase 83 Plan 10 — Phase 65 JWTAuth service token)}"
      MACRO_EMITTER_REDIS_URL: "${MACRO_EMITTER_REDIS_URL:?MACRO_EMITTER_REDIS_URL is required (Phase 83 Plan 10 — Redis interrupt + cache)}"
      MACRO_EMITTER_CALENDAR_URL: "${MACRO_EMITTER_CALENDAR_URL:?MACRO_EMITTER_CALENDAR_URL is required (Phase 83 Plan 10 — macro calendar source)}"
      # ── Optional env vars (have sensible defaults in code) ────────────────
      MACRO_EMITTER_ENABLED: "${MACRO_EMITTER_ENABLED:-true}"
      MACRO_EMITTER_HEALTHZ_PORT: "${MACRO_EMITTER_HEALTHZ_PORT:-8090}"
      MACRO_EMITTER_MAX_EMISSION_AGE_SEC: "${MACRO_EMITTER_MAX_EMISSION_AGE_SEC:-1200}"
      MACRO_EMITTER_CACHE_TTL_SEC: "${MACRO_EMITTER_CACHE_TTL_SEC:-60}"
      MACRO_EMITTER_INTERRUPT_POLL_SEC: "${MACRO_EMITTER_INTERRUPT_POLL_SEC:-1.0}"
      # Phase 83.1 — calendar lookahead window. 24h is fine for active FRED
      # release days; widen to 168h (7d) for quiet stretches so MACRO tab
      # never goes empty just because no event is in the next 24h.
      MACRO_EMITTER_LOOKAHEAD_HOURS: "${MACRO_EMITTER_LOOKAHEAD_HOURS:-168}"
      # Per-state cadence overrides (default values documented in conf/macro_emitter_env.example)
      MACRO_EMITTER_CADENCE_PRE_SEC: "${MACRO_EMITTER_CADENCE_PRE_SEC:-300}"
      MACRO_EMITTER_CADENCE_OPEN_SEC: "${MACRO_EMITTER_CADENCE_OPEN_SEC:-60}"
      MACRO_EMITTER_CADENCE_ACTIVE_SEC: "${MACRO_EMITTER_CADENCE_ACTIVE_SEC:-90}"
      MACRO_EMITTER_CADENCE_MID_SEC: "${MACRO_EMITTER_CADENCE_MID_SEC:-120}"
      MACRO_EMITTER_CADENCE_CLOSE_SEC: "${MACRO_EMITTER_CADENCE_CLOSE_SEC:-300}"
      MACRO_EMITTER_CADENCE_REVIEW_SEC: "${MACRO_EMITTER_CADENCE_REVIEW_SEC:-600}"
    volumes:
      - ./usr:/a0/usr
      - "/Volumes/ HardDrive/FinGPT/Dagster/fingpt_core/src/fingpt_core:/a0_extras/fingpt_core:ro"
      - ./emitters:/a0/emitters:ro
      - ./services:/a0/services:ro
      - ./lib:/a0/lib:ro
      - ./core:/a0/core:ro
    depends_on:
      vm107-redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:${MACRO_EMITTER_HEALTHZ_PORT:-8090}/healthz')"
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - vm107_network

  # ---------------------------------------------------------------------------
  # Phase 74 — vm107-agent-telemetry-publisher sibling service (2026-06-11)
  #
  # Subscribes to the `vm107.agent_telemetry` PubSub channel and aggregates
  # the per-agent state into the `vm107:agent_telemetry:snapshot` Redis key
  # that VM100's agent_activity_client reads (Phase 74 Agents panel).
  #
  # CLAUDE.md lock: long-running processes ship as a sibling compose service
  # (mgmt_commands_need_compose_service) — never as a one-off `docker exec`.
  # ---------------------------------------------------------------------------
  vm107-agent-telemetry-publisher:
    container_name: vm107-agent-telemetry-publisher
    build:
      context: .
      dockerfile: DockerfileLocal
    image: vm107-agent-zero:local
    restart: unless-stopped
    command: /opt/venv-a0/bin/python -m emitters.agent_telemetry_snapshot_publisher
    ports:
      - "${AGENT_TELEMETRY_HEALTHZ_HOST_PORT:-8091}:${AGENT_TELEMETRY_HEALTHZ_PORT:-8091}"
    env_file:
      - .env.local
    environment:
      PYTHONPATH: /a0_extras:/a0
      # Inside the docker network, vm107-redis is the broker hostname.
      # The standalone snapshot reader on VM100 (vm100-backend) reads via
      # host.docker.internal:6380; that mapping is set in VM100/.env.
      AGENT_TELEMETRY_REDIS_URL: "${AGENT_TELEMETRY_REDIS_URL:-redis://vm107-redis:6379/0}"
      AGENT_TELEMETRY_PUBLISH_INTERVAL_SEC: "${AGENT_TELEMETRY_PUBLISH_INTERVAL_SEC:-5}"
      AGENT_TELEMETRY_HEALTHZ_PORT: "${AGENT_TELEMETRY_HEALTHZ_PORT:-8091}"
    volumes:
      - ./usr:/a0/usr
      - "/Volumes/ HardDrive/FinGPT/Dagster/fingpt_core/src/fingpt_core:/a0_extras/fingpt_core:ro"
      - ./emitters:/a0/emitters:ro
    depends_on:
      vm107-redis:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:${AGENT_TELEMETRY_HEALTHZ_PORT:-8091}/healthz')"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - vm107_network

  # ---------------------------------------------------------------------------
  # Phase 85 Plan 10 — vm107-macro-release-event-listener sibling service
  #
  # CLAUDE.md lock (feedback_mgmt_commands_need_compose_service.md): long-running
  # processes MUST ship as a docker-compose sibling service.  Phase 74-03 shipped
  # run_observation_listener without a service and the worker died silently on
  # every backend restart.  This service applies the fix proactively.
  #
  # Subscribes to Redis ``macro.release_events`` channel (Phase 83 producer).
  # On each release event: Brain creates macro_release_analysis goal + 3 tasks.
  #
  # Restart after env changes (NEVER use `docker restart` — it ignores env_file edits):
  #   docker compose up -d --force-recreate --no-deps vm107-macro-release-event-listener
  # ---------------------------------------------------------------------------
  vm107-macro-release-event-listener:
    container_name: vm107-macro-release-event-listener
    build:
      context: .
      dockerfile: DockerfileLocal
    image: vm107-agent-zero:local
    restart: unless-stopped
    command: /opt/venv-a0/bin/python -m listeners.macro_release_event_listener
    env_file:
      - .env.local
    environment:
      PYTHONPATH: /a0_extras:/a0
      # REDIS_URL — required, fail-fast (env-driven-no-fallbacks lock).
      # Points at the vm107-redis service inside the docker network.
      REDIS_URL: "${REDIS_URL:?REDIS_URL is required (Phase 85 Plan 10 — macro release event subscriber)}"
      # PHASE85_RELEASE_TOPIC — the Redis topic name published by Phase 83.
      # Canonical default: macro.release_events. Override only if Phase 83
      # changes the channel name.
      PHASE85_RELEASE_TOPIC: "${PHASE85_RELEASE_TOPIC:-macro.release_events}"
    volumes:
      - ./usr:/a0/usr
      - "/Volumes/ HardDrive/FinGPT/Dagster/fingpt_core/src/fingpt_core:/a0_extras/fingpt_core:ro"
      - ./listeners:/a0/listeners:ro
      - ./core:/a0/core:ro
      # Phase 85.1 Plan 02 patch loads workers.task_dispatcher (for _publish_once
      # dedup) and publishers.macro_ws_invalidation at module import — all of
      # these and their transitive deps need to be mounted.
      - ./workers:/a0/workers:ro
      - ./publishers:/a0/publishers:ro
      - ./persistence:/a0/persistence:ro
      - ./services:/a0/services:ro
      - ./profiles:/a0/profiles:ro
      - ./prompts:/a0/prompts:ro
      - ./registry:/a0/registry:ro
      - ./config/templates:/a0/config/templates:ro
    depends_on:
      vm107:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - vm107_network
    labels:
      - "com.tradetracker.service=vm107-macro-release-event-listener"
      - "com.tradetracker.component=worker"
      - "com.tradetracker.phase=85"

  # ---------------------------------------------------------------------------
  # Phase 85.1 Plan 03 — vm107-task-dispatcher sibling service
  #
  # CLAUDE.md lock (feedback_mgmt_commands_need_compose_service.md): every
  # long-running poll-loop worker MUST ship as a docker-compose sibling service.
  # Plan 02 shipped workers/task_dispatcher.py; without this block it is dead
  # weight — `docker compose up -d` starts no process polling brain_state.
  # Phase 74-03 was the canonical cautionary tale (run_observation_listener).
  #
  # Restart after env changes (NEVER use `docker restart` — it ignores env_file):
  #   docker compose up -d --force-recreate --no-deps vm107-task-dispatcher
  # ---------------------------------------------------------------------------
  vm107-task-dispatcher:
    container_name: vm107-task-dispatcher
    build:
      context: .
      dockerfile: DockerfileLocal
    image: vm107-agent-zero:local
    restart: unless-stopped
    command: /opt/venv-a0/bin/python -m workers.task_dispatcher
    env_file:
      - .env.local
    environment:
      PYTHONPATH: /a0_extras:/a0
      # ── Required URLs/credentials — fail-fast at startup ─────────────────
      # ${VAR:?msg} aborts `docker compose up` if unset (env-driven-no-fallbacks lock).
      REDIS_URL:    "${REDIS_URL:?REDIS_URL is required (Phase 85.1 — Brain task dispatcher)}"
      MONGODB_URI:  "${MONGODB_URI:?MONGODB_URI is required (Phase 85.1 — vm107_brain.brain_state poll)}"
      POSTGRES_HOST: "${POSTGRES_HOST:?POSTGRES_HOST is required (Phase 85.1 — persistence writes)}"
      POSTGRES_DB:   "${POSTGRES_DB:?POSTGRES_DB is required (Phase 85.1 — persistence writes)}"
      POSTGRES_ANALYTICS_DB: "${POSTGRES_ANALYTICS_DB:?POSTGRES_ANALYTICS_DB is required (Phase 85.1 — B1 + event analysis writes)}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER is required (Phase 85.1)}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (Phase 85.1)}"
      # ── Tunable knobs — defaults acceptable (NOT credentials/URLs) ────────
      VM107_BRAIN_DB: "${VM107_BRAIN_DB:-vm107_brain}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      VM107_TEMPLATES_DIR: "${VM107_TEMPLATES_DIR:-/a0/config/templates}"
      VM107_TASK_DISPATCHER_POLL_SEC: "${VM107_TASK_DISPATCHER_POLL_SEC:-5}"
      VM107_TASK_DISPATCHER_MAX_CONCURRENT: "${VM107_TASK_DISPATCHER_MAX_CONCURRENT:-10}"
      VM107_TASK_DISPATCHER_MAX_RETRIES: "${VM107_TASK_DISPATCHER_MAX_RETRIES:-3}"
      # Phase 85.1 HTTP path to Agent Zero — dispatcher POSTs to /api/api_message
      # on the existing vm107-agent-zero service rather than invoking A0 in-process.
      # Required: VM107_AGENT_ZERO_URL + VM107_INTERNAL_TOKEN (in .env.local).
      VM107_AGENT_ZERO_URL: "${VM107_AGENT_ZERO_URL:-http://vm107-agent-zero:80}"
      VM107_INTERNAL_TOKEN: "${VM107_INTERNAL_TOKEN:?VM107_INTERNAL_TOKEN is required (Phase 85.1 — A0 HTTP X-API-KEY)}"
    volumes:
      - ./usr:/a0/usr
      - "/Volumes/ HardDrive/FinGPT/Dagster/fingpt_core/src/fingpt_core:/a0_extras/fingpt_core:ro"
      - ./workers:/a0/workers:ro
      - ./core:/a0/core:ro
      - ./persistence:/a0/persistence:ro
      - ./publishers:/a0/publishers:ro
      - ./services:/a0/services:ro
      - ./profiles:/a0/profiles:ro
      - ./prompts:/a0/prompts:ro
      - ./registry:/a0/registry:ro
      - ./config/templates:/a0/config/templates:ro
    depends_on:
      vm107:
        condition: service_healthy
    healthcheck:
      disable: true
    networks:
      - vm107_network
    labels:
      - "com.tradetracker.service=vm107-task-dispatcher"
      - "com.tradetracker.component=worker"
      - "com.tradetracker.phase=85.1"

  # ---------------------------------------------------------------------------
  # Phase 87 Plan 08 — vm107-macro-story-tracker sibling service
  #
  # CLAUDE.md lock (feedback_mgmt_commands_need_compose_service.md): every
  # long-running worker MUST ship as a docker-compose sibling service.  Plan
  # 87-08 ships an APScheduler BlockingScheduler that fires the
  # macro_story_tracker hourly (cron minute 5 UTC); without this block it
  # would die on every backend restart (Phase 74-03 lesson — observation
  # pipeline silently severed for ≥1 cycle).
  #
  # The runner polls VM101 typed economic_event API (Phase 47.2 lock — no
  # parquet), pulls top-K=5 episodes via Plan 87-07 EpisodicMemoryService,
  # CREATEs/REINFORCEs/RETIREs macro_story rows on VM101 Postgres, and
  # publishes macro.story.updated on the VM100 WS topic.
  #
  # Restart after env changes (NEVER use `docker restart` — it ignores env_file edits):
  #   docker compose up -d --force-recreate --no-deps vm107-macro-story-tracker
  # ---------------------------------------------------------------------------
  vm107-macro-story-tracker:
    container_name: vm107-macro-story-tracker
    build:
      context: .
      dockerfile: DockerfileLocal
    image: vm107-agent-zero:local
    restart: unless-stopped
    command: /opt/venv-a0/bin/python -m scripts.run_macro_story_tracker
    env_file:
      - .env.local
    environment:
      PYTHONPATH: /a0_extras:/a0
      # ── Required URLs — fail-fast at startup (env-driven-no-fallbacks lock) ──
      # ${VAR:?msg} aborts `docker compose up` if unset.  The runner ALSO
      # re-checks these at process boot before wiring collaborators so the
      # sibling-service container never silently no-ops.
      VM101_INTERNAL_BASE_URL: "${VM101_INTERNAL_BASE_URL:?VM101_INTERNAL_BASE_URL is required (Phase 87 Plan 08 — macro_story_tracker poller)}"
      QDRANT_URL: "${QDRANT_URL:?QDRANT_URL is required (Phase 87 Plan 08 — B6 EpisodicMemoryService)}"
    volumes:
      - ./usr:/a0/usr
      - "/Volumes/ HardDrive/FinGPT/Dagster/fingpt_core/src/fingpt_core:/a0_extras/fingpt_core:ro"
      # Plan 87-08 modules + their transitive deps (mirrors the
      # macro_release_event_listener bind-mount set so host edits propagate
      # without rebuild).
      - ./agents:/a0/agents:ro
      - ./scripts:/a0/scripts:ro
      - ./core:/a0/core:ro
      - ./persistence:/a0/persistence:ro
      - ./publishers:/a0/publishers:ro
      - ./services:/a0/services:ro
      - ./profiles:/a0/profiles:ro
      - ./prompts:/a0/prompts:ro
      - ./registry:/a0/registry:ro
      - ./config/templates:/a0/config/templates:ro
      # Heartbeat file is written under /app/logs by the runner; the
      # healthcheck reads it from the same path.
      - ./logs:/app/logs
    depends_on:
      vm107:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/venv-a0/bin/python", "-m", "scripts.macro_story_tracker_health"]
      interval: 5m
      timeout: 30s
      retries: 3
      # Plan 87-14 deploy gate also verifies survival across
      # `docker compose restart vm107` (the agent-zero backend service).
      start_period: 5m
    networks:
      - vm107_network
    labels:
      - "com.tradetracker.service=vm107-macro-story-tracker"
      - "com.tradetracker.component=worker"
      - "com.tradetracker.phase=87"

  # ---------------------------------------------------------------------------
  # Phase 87 Plan 10 — vm107-macro-regime-monitor sibling service
  #
  # CLAUDE.md lock (feedback_mgmt_commands_need_compose_service.md): every
  # long-running worker MUST ship as a docker-compose sibling service.  Plan
  # 87-10 ships an APScheduler BlockingScheduler that fires the
  # macro_regime_monitor every 6 hours UTC (cron `0 */6 * * *`); without
  # this block it would die on every backend restart (Phase 74-03 lesson —
  # observation pipeline silently severed for ≥1 cycle).
  #
  # The runner queries BeliefStore (Plan 87-09) for all 7 LOCK-2 regimes,
  # polls VM101 typed economic_event API for the last 12h of anchor
  # indicator releases (Phase 47.2 lock — no parquet), calls
  # BeliefStore.propose() with proposer_id='macro_regime_monitor' (the
  # second of two entries in DETERMINISTIC_PROPOSERS), and on LOCK-3 0.65
  # transition threshold emits a regime_transition_detected event +
  # dispatches a Phase 74 macro-channel P2 Warning notification (LOCK-9
  # 12h producer-side dedup applied first).
  #
  # Restart after env changes (NEVER use `docker restart` — it ignores env_file edits):
  #   docker compose up -d --force-recreate --no-deps vm107-macro-regime-monitor
  # ---------------------------------------------------------------------------
  vm107-macro-regime-monitor:
    container_name: vm107-macro-regime-monitor
    build:
      context: .
      dockerfile: DockerfileLocal
    image: vm107-agent-zero:local
    restart: unless-stopped
    command: /opt/venv-a0/bin/python -m scripts.run_macro_regime_monitor
    env_file:
      - .env.local
    environment:
      PYTHONPATH: /a0_extras:/a0
      # ── Required URLs — fail-fast at startup (env-driven-no-fallbacks lock) ──
      # ${VAR:?msg} aborts `docker compose up` if unset.  The runner ALSO
      # re-checks these at process boot before wiring collaborators so the
      # sibling-service container never silently no-ops.
      BELIEF_STORE_POSTGRES_URL: "${BELIEF_STORE_POSTGRES_URL:?BELIEF_STORE_POSTGRES_URL is required (Phase 87 Plan 10 — macro_regime_monitor BeliefStore writes)}"
      BELIEF_STORE_MONGO_URL: "${BELIEF_STORE_MONGO_URL:?BELIEF_STORE_MONGO_URL is required (Phase 87 Plan 10 — macro_regime_monitor BeliefStore cache)}"
      PHASE74_DISPATCHER_URL: "${PHASE74_DISPATCHER_URL:?PHASE74_DISPATCHER_URL is required (Phase 87 Plan 10 — macro_regime_monitor Phase 74 NotificationDispatcher)}"
      VM101_INTERNAL_BASE_URL: "${VM101_INTERNAL_BASE_URL:?VM101_INTERNAL_BASE_URL is required (Phase 87 Plan 10 — macro_regime_monitor release poller)}"
    volumes:
      - ./usr:/a0/usr
      - "/Volumes/ HardDrive/FinGPT/Dagster/fingpt_core/src/fingpt_core:/a0_extras/fingpt_core:ro"
      # Plan 87-10 modules + their transitive deps (mirrors the
      # macro_story_tracker sibling-service bind-mount set so host edits
      # propagate without rebuild).
      - ./agents:/a0/agents:ro
      - ./scripts:/a0/scripts:ro
      - ./core:/a0/core:ro
      - ./persistence:/a0/persistence:ro
      - ./publishers:/a0/publishers:ro
      - ./services:/a0/services:ro
      - ./profiles:/a0/profiles:ro
      - ./prompts:/a0/prompts:ro
      - ./registry:/a0/registry:ro
      - ./config/templates:/a0/config/templates:ro
      # Heartbeat file is written under /app/logs by the runner; the
      # healthcheck reads it from the same path.
      - ./logs:/app/logs
    depends_on:
      vm107:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/venv-a0/bin/python", "-m", "scripts.macro_regime_monitor_health"]
      interval: 10m
      timeout: 30s
      retries: 3
      # Plan 87-14 deploy gate also verifies survival across
      # `docker compose restart vm107` (the agent-zero backend service).
      start_period: 5m
    networks:
      - vm107_network
    labels:
      - "com.tradetracker.service=vm107-macro-regime-monitor"
      - "com.tradetracker.component=worker"
      - "com.tradetracker.phase=87"

  # ---------------------------------------------------------------------------
  # Phase 94 Plan 02 — event_bus sibling service (Wave 1)
  #
  # CLAUDE.md lock (feedback_mgmt_commands_need_compose_service.md): any
  # long-running ``python -m listeners.X`` MUST ship as a docker-compose
  # sibling service so the worker survives backend restarts.  Phase 74-03
  # was the canonical cautionary tale (run_observation_listener silently
  # died on every backend restart until the service block landed).
  #
  # The listener (listeners/run_event_bus_listener.py) bootstraps a Phase
  # 94 EventBus (core/event_bus/bus.py) that publishes EconomicEvent
  # objects over Redis pub/sub on channels ``economic_event_bus:<type>``.
  # Wave 3+ agent modules register handlers via import hooks.
  #
  # Restart after env changes (NEVER use ``docker restart`` — it ignores
  # env_file edits):
  #   docker compose up -d --force-recreate --no-deps event_bus
  # ---------------------------------------------------------------------------
  event_bus:
    container_name: vm107-event-bus
    build:
      context: .
      dockerfile: DockerfileLocal
    image: vm107-agent-zero:local
    restart: unless-stopped
    command: /opt/venv-a0/bin/python -m listeners.run_event_bus_listener
    env_file:
      - .env.local
    environment:
      PYTHONPATH: /a0_extras:/a0
      # ── Required URLs — fail-fast at startup (env-driven-no-fallbacks lock) ──
      # ${VAR:?msg} aborts ``docker compose up`` if unset.  The EventBus
      # module also re-checks these at import time before any pub/sub call.
      REDIS_HOST: "${REDIS_HOST:?REDIS_HOST is required (Phase 94 Plan 02 — EventBus pub/sub)}"
      REDIS_PORT: "${REDIS_PORT:?REDIS_PORT is required (Phase 94 Plan 02 — EventBus pub/sub)}"
    volumes:
      - ./usr:/a0/usr
      - "/Volumes/ HardDrive/FinGPT/Dagster/fingpt_core/src/fingpt_core:/a0_extras/fingpt_core:ro"
      # Bind-mount the modules the listener imports so host edits propagate
      # without rebuild (mirrors macro_release_event_listener layout).
      - ./listeners:/a0/listeners:ro
      - ./core:/a0/core:ro
      - ./contracts:/a0/contracts:ro
      - ./agents:/a0/agents:ro
      - ./registry:/a0/registry:ro
    depends_on:
      vm107-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f run_event_bus_listener || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - vm107_network
    labels:
      - "com.tradetracker.service=vm107-event-bus"
      - "com.tradetracker.component=worker"
      - "com.tradetracker.phase=94"

volumes:
  redis_data:

networks:
  vm107_network:
    external: true
