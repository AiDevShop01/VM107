services:
  vm107-redis:
    image: redis:7-alpine
    container_name: vm107-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vm107_network

  vm107:
    container_name: vm107-agent-zero
    build:
      context: .
      dockerfile: DockerfileLocal
    image: vm107-agent-zero:local
    restart: unless-stopped
    ports:
      - "50081:80"
    env_file:
      - .env.local
    volumes:
      - ./usr:/a0/usr
    depends_on:
      vm107-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:80/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    networks:
      - vm107_network

volumes:
  redis_data:

networks:
  vm107_network:
    external: true
