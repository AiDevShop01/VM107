schema_version: 2
title: trade_auditor_agent._analyzer
description: >
  Analyzer stage for the trade_auditor pipeline. Calls typed VM107 analytical
  tools (behavioral_analysis, execution_quality, get_trade_quality_score,
  get_behavioral_edges) to produce a scored, pattern-annotated AnalyzerOutput.
  Does not persist. Does not retrieve raw evidence.
parent_profile: trade_auditor_agent

allowed_tools:
  - behavioral_analysis
  - execution_quality
  - get_trade_quality_score
  - get_behavioral_edges
  - skills_tool

denied_tools:
  - call_subordinate
  - code_execution_tool
  - persist_narrative
  - lookup_replay_artifact
  - fetch_replay_frame
  - get_trade_context

constitutional_skills:
  - citation-discipline
optional_skills:
  - critique-discipline
  - pattern-recognition

memory_scope:
  account_scope: "required"
  execution_scope: "required"
  cross_trade_visibility: "NONE"
  narrative_visibility: "NONE"

max_iterations: 4
max_cost_usd: 0.30

input_contract: fingpt_core.contracts.narrative.analyzer_io.AnalyzerInput
output_contract: fingpt_core.contracts.narrative.analyzer_io.AnalyzerOutput
