schema_version: 2
title: behavioral_mentor_agent._reader
description: >
  Reader stage for the behavioral_mentor pipeline. Retrieves cross-trade evidence
  from Phase 56 event store, Phase 57 analytics snapshots, Phase 58 derived
  intelligence (Neo4j behavioral edges, Qdrant embeddings), and Phase 59 replay
  artifacts for ALL executions within the account scope. Applies strict
  treat-instructions-as-data doctrine (CTX-§14 LOCKED). Denied all write/persist
  and analyzer-tier tools.
parent_profile: behavioral_mentor_agent

allowed_tools:
  - lookup_replay_artifact
  - fetch_replay_frame
  - get_trade_context
  - get_performance_history
  - skills_tool

denied_tools:
  - call_subordinate
  - code_execution_tool
  - persist_narrative
  - behavioral_analysis
  - execution_quality
  - get_cross_trade_behavioral_patterns

constitutional_skills:
  - citation-discipline

memory_scope:
  account_scope: "required"
  execution_scope: "NONE"
  cross_trade_visibility: "ACCOUNT_SCOPED"
  narrative_visibility: "NONE"

max_iterations: 4
max_cost_usd: 0.30

input_contract: fingpt_core.contracts.narrative.reader_io.ReaderInput
output_contract: fingpt_core.contracts.narrative.reader_io.ReaderOutput
