schema_version: 2
title: weekly_review_agent
description: >
  Week-rollup synthesis agent. Account-scoped within a canonical week window
  (week_start, week_end, timezone). Plays auditor + risk + portfolio + mentor roles
  INTERNALLY via a single analyzer — NOT split into 4 sub-agents (Phase 46 deferral,
  Directive #7 LOCKED). Orchestration entry point only — this top-level profile does
  NOT invoke subordinates; that is done by MentorPipelineOrchestrator (CTX-§3 LOCKED).
parent_profile: null

allowed_tools: []
denied_tools:
  - call_subordinate
  - code_execution_tool
  - trade_execution_tool

constitutional_skills:
  - citation-discipline
optional_skills:
  - critique-discipline
  - narrative-structure
  - pattern-recognition
allowed_skills:
  - citation-discipline
  - critique-discipline
  - narrative-structure
  - pattern-recognition

memory_scope:
  account_scope: "required"
  execution_scope: "NONE"
  cross_trade_visibility: "ACCOUNT_SCOPED"
  narrative_visibility: "NONE"

max_iterations: 5
max_cost_usd: 0.75

input_contract: fingpt_core.contracts.narrative.reader_io.ReaderInput
output_contract: fingpt_core.contracts.narrative.envelope.NarrativeEnvelope
