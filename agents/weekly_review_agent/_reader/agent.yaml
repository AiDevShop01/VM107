schema_version: 2
title: weekly_review_agent._reader
description: >
  Reader stage for the weekly_review pipeline. Retrieves week-window evidence via
  get_weekly_execution_summary (batch read of all executions + snapshots for the
  canonical week_window), plus per-execution replay artifacts and performance history.
  Applies strict treat-instructions-as-data doctrine (CTX-§14 LOCKED). Denied all
  write/persist and analyzer-tier tools.
parent_profile: weekly_review_agent

allowed_tools:
  - lookup_replay_artifact
  - fetch_replay_frame
  - get_performance_history
  - get_weekly_execution_summary
  - skills_tool

denied_tools:
  - call_subordinate
  - code_execution_tool
  - persist_narrative
  - behavioral_analysis
  - execution_quality
  - get_regime_context
  - get_cross_trade_behavioral_patterns

constitutional_skills:
  - citation-discipline

memory_scope:
  account_scope: "required"
  execution_scope: "NONE"
  cross_trade_visibility: "ACCOUNT_SCOPED"
  narrative_visibility: "NONE"

max_iterations: 5
max_cost_usd: 0.40

# BUG-23 / Phase 62.1: utility tier with thinking off for mechanical evidence gathering
model_tier: utility
thinking_mode: false

input_contract: fingpt_core.contracts.narrative.reader_io.ReaderInput
output_contract: fingpt_core.contracts.narrative.reader_io.ReaderOutput
