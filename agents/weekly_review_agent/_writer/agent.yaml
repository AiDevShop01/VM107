schema_version: 2
title: weekly_review_agent._writer
description: >
  Writer stage for the weekly_review pipeline. Produces a structured NarrativeEnvelope
  with a cited sentence array following the 5-section week-rollup structural template
  (Setup of the Week / Behavioral Themes / Risk and Portfolio Observations / Outcomes /
  Forward Mentor Note). The ONLY stage that may call persist_narrative. Denied all
  read-tier and analyzer-tier tools (CTX-§2 LOCKED).
parent_profile: weekly_review_agent

allowed_tools:
  - persist_narrative
  - skills_tool

denied_tools:
  - call_subordinate
  - code_execution_tool
  - lookup_replay_artifact
  - fetch_replay_frame
  - behavioral_analysis
  - execution_quality
  - get_trade_context
  - get_performance_history
  - get_weekly_execution_summary
  - get_regime_context
  - get_cross_trade_behavioral_patterns

constitutional_skills:
  - citation-discipline
optional_skills:
  - narrative-structure

memory_scope:
  account_scope: "required"
  execution_scope: "NONE"
  cross_trade_visibility: "ACCOUNT_SCOPED"
  narrative_visibility: "NONE"

max_iterations: 4
max_cost_usd: 0.35

input_contract: fingpt_core.contracts.narrative.writer_io.WriterInput
output_contract: fingpt_core.contracts.narrative.envelope.NarrativeEnvelope
