# Phase 92 Plan 03 — Synonym table for indicator_linker Stage 1.
#
# Schema:
#   <concept_key>:
#     match:
#       <synonym_phrase>: [<FRED_ID>, ...]
#       <synonym_phrase>: [<FRED_ID>, ...]
#
# Each phrase under `match` is a case-insensitive substring; when found in
# doc.title + doc.text, the linker emits one hit per FRED_ID in the value.
#
# Why per-phrase mapping (not flat per-concept): different phrasings within
# the same CONCEPT may carry materially different signal. "core cpi" should
# hit CPILFESL specifically; bare "inflation" is most cleanly mapped to
# CPIAUCSL (the canonical headline series). This precision-discipline lets
# us hold the Stage-1 precision ≥0.95 threshold from the plan's must_haves.
#
# Pitfall 3 mitigation: ≥15 concept keys, ≥3 distinct match phrases each,
# covering ≥40 of the Phase 83 catalog's 64 EconomicIndicators.
#
# Build protocol: add a phrase when it is UNAMBIGUOUSLY about an indicator
# in the catalog. If the phrase is ambiguous (e.g. "labor market" — could
# touch UNRATE, PAYEMS, AHETPI, U6RATE), keep its expansion narrow to the
# most-canonical 1-2 indicators and let the LLM fallback pick up the rest
# on a per-doc basis.

inflation:
  match:
    "core cpi":                  [CPILFESL]
    "core consumer price":       [CPILFESL]
    "headline cpi":              [CPIAUCSL]
    "consumer price index":      [CPIAUCSL]
    "cpi inflation":             [CPIAUCSL]
    "cpi rose":                  [CPIAUCSL]
    "12-month change in the consumer price": [CPIAUCSL]
    "core pce":                  [PCEPILFE]
    "pce price index":           [PCEPI]
    "pce inflation":             [PCEPI]
    "personal consumption expenditures (pce)": [PCEPI]
    "the price index for personal consumption expenditures": [PCEPI]
    "core inflation":            [CPILFESL, PCEPILFE]
    "inflation has eased":       [CPIAUCSL]
    "inflation has come down":   [CPIAUCSL]
    "inflation has declined":    [CPIAUCSL]
    "inflation has continued to decline": [CPIAUCSL]
    "inflation remains elevated": [CPIAUCSL]
    "inflation has fallen":      [CPIAUCSL]
    "the disinflation":          [CPIAUCSL]
    "disinflation process":      [CPIAUCSL]
    "inflation persistence":     [CPIAUCSL]
    "inflation dynamics":        [CPIAUCSL]
    "inflation episode":         [CPIAUCSL]

