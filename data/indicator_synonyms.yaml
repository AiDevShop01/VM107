# Phase 92 Plan 03 — Synonym table for indicator_linker Stage 1.
#
# Schema:
#   <synonym_key>:
#     synonyms: [list of phrases — case-insensitive substring match]
#     indicators: [list of FRED EconomicIndicator IDs from the Phase 83 catalog]
#
# Each key represents a CONCEPT (e.g. "inflation"); synonyms are phrasings;
# indicators are the FRED IDs the concept SHOULD link to. Stage 1 of the linker
# walks every key; if ANY synonym matches doc.title + doc.text, ALL indicators
# under that key are added to the hit list with confidence=1.0, via='synonym'.
#
# Pitfall 3 mitigation: ≥15 keys, ≥3 synonyms each, covering ≥40 of the Phase 83
# catalog's 64 EconomicIndicators. See VM107/tests/research/conftest.py for the
# locked-in subset used by the host-shell precision/recall harness.
#
# Build protocol: add a new key when a golden-link-set doc would otherwise
# require LLM fallback for a CONCEPT we know is well-defined. Keep the table
# small enough that the LLM fallback retains a meaningful role (~5/30 of the
# golden set should land in Stage 2).

