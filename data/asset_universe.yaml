# Phase 92 Plan 03 — Curated asset universe + indicator drivers for the
# deterministic asset_linker.
#
# The asset_linker joins doc.indicators ∩ assets[N].drivers_via_indicators
# to populate doc.assets. Each asset entry lists 2-N driver indicators, each
# carrying a (confidence, direction) tuple representing the macro relationship.
#
# Schema:
#   assets:
#     - id: <ASSET_ID>             # e.g. DXY / GOLD / SPX / UST10Y
#       name: <human-readable name>
#       category: <fx|metal|equity|rates|crypto|etc.>
#       drivers_via_indicators:
#         - indicator_id: <FRED ID>
#           confidence: <0.0..1.0>
#           direction: <positive|negative|mixed>
#
# confidence: how strongly the indicator is believed to drive the asset.
# direction:  positive = same-sign move; negative = opposite-sign move;
#             mixed = regime-dependent or non-monotone.
#
# This file is hand-curated by the macro team; the linker treats it as the
# source of truth. Add a new asset when ≥1 indicator in the synonym table
# meaningfully moves it AND the asset is something the trading desk takes
# a directional view on.

